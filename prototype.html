<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용후기 프로토타입</title>
<meta name="description" content="조건에 따라 달라지는 이용후기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교)은 components.js 의
     initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(kbz_3.0_ui_stytem 의 프로토타입 예시와 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-bg-base,#fff)}
</style>
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">
      <span class="proto-nav-group-label">로그인</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="login-기본"
        data-why="이용사가 들어오는 자리. 아래 띠는 미이용사가 바로 작성 화면으로 가는 길입니다."
        data-steps="아이디·비밀번호를 넣고 이용후기 남기기를 누르면 작성 화면으로 넘어갑니다"
        data-look="아래 띠를 누르면 미이용사 작성 화면으로 갑니다|로그인 박스 아래에는 비밀번호 찾기만 있습니다">기본</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="login-만석"
        data-why="이 계정의 계약 현장이 하나도 남지 않았을 때. 들어가도 새로 쓸 자리가 없어 로그인을 누른 자리에서 알립니다. 임시저장만 해둔 현장도 찬 것으로 봅니다. 현장 수는 계정마다 다르고, 이 시나리오에서는 네 곳으로 두었습니다."
        data-steps="아이디·비밀번호를 넣고 이용후기 남기기를 누른 상태입니다"
        data-look="모달 '모든 계약 현장의 후기가 작성되었습니다'|누구의 후기인지 모르는 채라 시각을 적지 않습니다|후기 수정하기 → 작성 화면으로 넘어가 본인 확인을 거칩니다">계약 현장이 다 참</button>
      <span class="proto-nav-group-label">이용사</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">새 후기 작성</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-인증전"
        data-why="로그인한 이용사가 처음 들어온 자리. 회사명은 계정에서 오므로 머리글에만 있고 따로 묻지 않습니다."
        data-steps="아무것도 하지 않은 처음 상태입니다|이름과 번호를 넣고 인증하면 다음 시나리오의 화면이 됩니다"
        data-look="아래가 흐리고 손이 닿지 않습니다 — 탭으로도 들어가지 않습니다|플로팅 막대가 숨어 있습니다|단계 표시가 ① 작성자 인증에 있습니다">인증 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-인증후"
        data-why="번호 인증을 마친 직후. 쓴 적 없는 번호라 되찾을 기록이 없고, 빈 폼이 열립니다."
        data-steps="이름 최소장, 번호 010-9000-0001 로 인증을 마친 상태입니다"
        data-look="인증 칸이 한 줄 요약으로 접히고 수정이 붙습니다|흐림이 걷히고 플로팅 막대가 올라옵니다|필수값을 다 채우기 전 제출 버튼은 눌린 것처럼 보이지 않습니다">인증 후</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-만석현장"
        data-why="후기는 한 사람이 한 건만 남깁니다. 대신 맡은 현장은 여러 곳을 함께 골라 그 한 건에 담습니다. 한 현장에 후기도 하나뿐이어서, 다른 분이 먼저 고른 현장은 잠깁니다. 그분이 아직 제출하지 않고 임시저장만 해둔 상태여도 잠깁니다."
        data-steps="아직 후기를 쓰지 않은 번호로 인증하고 계약 현장 목록을 열어 둔 상태입니다|회색으로 눌린 줄에 마우스를 올려 보세요|잠기지 않은 두 곳을 함께 눌러 보세요"
        data-look="1번·3번 현장이 회색으로 잠겨 있습니다|올리면 '이미 생성된 후기가 있는 현장입니다'|내 후기에 든 현장은 잠기지 않습니다 — 잠기면 내 후기를 못 고칩니다|잠긴 현장도 목록에서 지우지는 않습니다 — 없어진 현장과 구별되어야 합니다|남은 곳은 여러 개를 함께 고를 수 있습니다|고른 뒤 버튼은 '첫 현장 외 N곳' 으로 줄어듭니다">이미 찬 현장</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">쓰던 후기</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-임시"
        data-why="쓰다 만 후기가 있으면 인증과 동시에 그대로 돌아옵니다."
        data-steps="이름 김소장, 번호 010-5555-0001 로 인증을 마친 상태입니다"
        data-look="'임시저장하신 내용을 불러왔습니다'|초기화가 있습니다 — 임시저장분에만 둡니다|인증 수정은 없습니다 — 번호가 그 후기를 찾는 열쇠입니다">임시저장분 불러오기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-제출"
        data-why="이미 낸 후기를 고치러 온 자리. 검토 전이라 고쳐서 다시 낼 수 있습니다."
        data-steps="이름 이소장, 번호 010-5555-0002 로 인증을 마친 상태입니다"
        data-look="제출 버튼이 '수정해서 제출'|플로팅에 임시 저장이 없습니다 — 이미 보관된 글 위에 초안을 덮지 않습니다|초기화도 인증 수정도 없습니다">제출분 수정</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">제출한 뒤</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="mem-완료"
        data-why="제출한 직후 화면. 후기는 바로 실리지 않고 검토를 거칩니다."
        data-steps="따로 할 것 없이 바로 보입니다"
        data-look="'이용 후기 제출이 완료되었습니다'|검토를 거친 뒤 목록에 등록된다는 안내|수정하기를 누르면 이용사는 곧장 폼으로 돌아갑니다">제출 완료</button>
      <span class="proto-nav-group-label">미이용사</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">새 후기 작성</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="gst-인증전"
        data-why="로그인 없이 들어온 자리. 계약 목록이 없으니 회사명·사업자등록번호를 직접 밝힙니다. 이용사와 달리 문이 둘이라, 사업장을 먼저 밝혀야 작성자 칸이 열립니다."
        data-steps="아무것도 하지 않은 처음 상태입니다"
        data-look="작성자 이름·번호 칸이 회색으로 잠겨 있습니다|머리글이 '다시 만나서 반가워요!' — 아직 회사명을 모릅니다|회사명을 적는 대로 머리글이 따라옵니다">인증 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="gst-사업자확인"
        data-why="사업자등록번호 확인을 마친 직후. 사업장이 밝혀져 작성자 칸이 열립니다."
        data-steps="회사명 대한건설, 사업자등록번호 555-66-77880 을 확인한 상태입니다"
        data-look="확인된 칸이 회색으로 죽지 않고 파란 성공 상태가 됩니다 — 못 쓰는 칸이 아니라 통과한 칸입니다|확인 버튼이 그 자리에서 수정으로 바뀝니다|작성자 칸의 잠금이 풀립니다">사업자 확인 후</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="gst-인증후"
        data-why="문 둘을 다 지난 상태. 사업장과 작성자가 한 줄로 접히고 폼이 열립니다."
        data-steps="사업자등록번호 확인에 이어 이름 김소장, 번호 010-9000-0002 로 인증까지 마친 상태입니다"
        data-look="회사 정보와 작성자가 한 카드에서 함께 접힙니다|현장명을 직접 적습니다 — 계약 목록이 없기 때문입니다|플로팅 막대가 올라옵니다">인증 후</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">쓰던 후기</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="gst-중복"
        data-why="한 사업장에 한 분입니다. 같은 번호로 남은 후기가 있으면 본인인지 먼저 묻습니다."
        data-steps="회사명과 사업자등록번호 321-45-67890 을 넣고 확인을 누른 상태입니다|모달에서 번호 010-7777-0001 → 인증 → 6자리 → 후기 불러오기"
        data-look="모달 '이미 생성된 후기가 있습니다' — 임시저장이든 제출이든 같은 문구입니다|다른 번호를 넣고 인증을 누르면 그 자리에서 '후기 작성 시 인증한 번호와 일치하지 않습니다' — 문자는 가지 않습니다|취소하면 사업자번호 칸 아래에 까닭이 남습니다">이미 쓴 사업자번호</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">제출한 뒤</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="gst-완료"
        data-why="미이용사도 적어 낸 회사명으로 부릅니다."
        data-steps="따로 할 것 없이 바로 보입니다"
        data-look="머리글이 '대한건설 담당자님'|수정하기를 누르면 번호 인증 모달이 뜹니다 — 기댈 로그인이 없기 때문입니다|통과하면 회사 정보를 다시 받지 않고 쓰던 폼으로 돌아갑니다">제출 완료</button>
      <span class="proto-nav-group-label">막히는 자리</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">로그인</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-로그인빈칸"
        data-why="빈 칸으로 로그인을 누른 자리. 무엇이 틀렸는지가 아니라 무엇이 비었는지를 말합니다."
        data-steps="아이디·비밀번호를 비운 채 이용후기 남기기를 누른 상태입니다"
        data-look="'아이디를 입력해 주세요.'|'비밀번호를 입력해 주세요.'|비어 있는 칸만 붉습니다 — 어느 칸이 빌지 알기 때문입니다|한 글자만 쳐도 그 칸의 안내만 사라집니다">빈 칸</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-로그인실패"
        data-why="아이디나 비밀번호가 틀렸을 때. 어느 칸 탓인지 가릴 수 없어 둘 다 붉게 두고, 말은 아래 칸에 붙입니다 — '아이디 또는' 이 이미 모른다고 말하고 있습니다. 주소에 authfail=1 을 붙이면 그 화면이 나옵니다."
        data-steps="아이디·비밀번호를 넣고 이용후기 남기기를 누른 상태입니다"
        data-look="'아이디 또는 비밀번호가 일치하지 않습니다.'|두 칸이 모두 붉습니다 — 빈 칸일 때는 비어 있는 칸만 붉습니다|어느 칸을 고쳐도 둘 다 풀립니다|비밀번호가 선택된 채로 있어 바로 다시 칠 수 있습니다">아이디·비밀번호 불일치</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">번호 인증</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-번호형식"
        data-why="핸드폰 칸이라 01× 11자리만 받습니다. 10자리 유선번호를 넣으면 021 - 2345 - 678 처럼 엉뚱하게 끊겨 보이는데, 여기 들어올 번호가 아닙니다."
        data-steps="번호 칸에 02-1234-5678 을 넣고 인증을 누른 상태입니다"
        data-look="'010으로 시작하는 11자리로 입력해 주세요.'|인증번호 칸은 잠긴 채입니다 — 문자를 보내지 않았습니다|번호를 고치면 안내가 사라집니다">형식 오류</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-인증번호"
        data-why="문자로 받은 6자리가 맞지 않을 때. 프로토타입에서는 000000 이 실패로 떨어집니다."
        data-steps="인증번호를 요청하고 000000 을 넣어 확인을 누른 상태입니다"
        data-look="'인증번호가 올바르지 않습니다.'|타이머는 그대로 흐릅니다 — 다시 넣을 기회가 남아 있습니다|한 글자만 고쳐도 안내가 사라집니다">번호 틀림</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-시간초과"
        data-why="문자로 받은 번호는 3분까지만 삽니다. 이 화면을 보려고 주소에 sec=3 을 붙여 3초로 줄였습니다 — 실제 화면은 3분입니다."
        data-steps="인증번호를 요청하고 시간이 다 지나기를 기다린 상태입니다"
        data-look="'인증 시간이 지났습니다. 다시 요청해 주세요.'|타이머가 00:00 에 멈춰 있습니다|재전송을 누르면 다시 3분이 시작됩니다">시간 초과</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">사업장 확인</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-계약없음"
        data-why="2026년 이후에 계약한 사업장만 참여할 수 있습니다. 번호를 잘못 친 것이 아니라 자격이 아니어서 막히는 자리라, 다시 쳐 보라는 말이 아니라 무엇이 없어서 막혔는지를 말합니다."
        data-steps="자격이 없는 사업자등록번호 111-11-11111 을 넣고 확인을 누른 상태입니다"
        data-look="'2026년 이후 계약 내역이 없어 참여하실 수 없습니다.'|작성자 칸은 잠긴 채입니다 — 사업장이 통과하지 못했습니다|프로토타입에는 계약 대장이 없어 이 번호 하나만 막습니다 — 실제로는 서버가 계약 시작일을 봅니다">계약 없음</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-사업자자릿수"
        data-why="사업자등록번호는 10자리입니다. 모자란 채로는 있는 번호인지 볼 수 없습니다. 확인은 사업자등록번호만 봅니다 — 회사명은 검토 대상이 아니라 적어 두는 값이어서, 비어 있어도 확인을 막지 않고 제출할 때 붉은 테두리로 가리킵니다."
        data-steps="사업자등록번호를 555-66 까지만 넣어 확인을 누른 상태입니다"
        data-look="'사업자등록번호 10자리를 모두 입력해 주세요.'|회사명 칸은 붉지 않습니다 — 확인이 보는 값이 아닙니다">자릿수 모자람</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-사업자중복"
        data-why="한 사업장에 한 분입니다. 본인 확인을 취소하면 왜 막혔는지가 칸 아래에 남습니다."
        data-steps="이미 후기가 있는 사업자등록번호로 확인을 누르고, 뜬 모달에서 취소를 누른 상태입니다"
        data-look="'이미 생성된 후기가 있는 사업자등록번호입니다.' — 방금 닫은 모달의 머리글과 같은 말입니다|제출분이든 임시저장분이든 같은 말입니다 — 막는 까닭도 세기도 같습니다|같은 말을 배너로 한 번 더 하지 않습니다 — 사연은 모달이 이미 말했습니다">취소한 뒤 남는 말</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">본인 확인</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-모달빈번호"
        data-why="인증을 거치지 않고 불러오기부터 누른 자리. 번호가 그 후기를 찾는 열쇠라 건너뛸 수 없습니다."
        data-steps="모달이 뜬 채로 후기 불러오기를 바로 누른 상태입니다"
        data-look="'핸드폰 번호를 입력하고 인증을 눌러 주세요.'|번호 칸이 붉어집니다 — 인증번호 칸은 아직 잠겨 있습니다">번호 없이 진행</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-모달남의번호"
        data-why="그 후기의 번호가 아니면 통과할 수 없는 번호입니다. 문자를 보내 6자리를 받아 본 뒤에 돌려보내면 헛걸음을 한 번 더 시키는 셈이라, 인증을 누른 그 자리에서 막습니다."
        data-steps="모달에 다른 번호를 넣고 인증을 누른 상태입니다"
        data-look="'후기 작성 시 인증한 번호와 일치하지 않습니다.'|문자는 가지 않았습니다 — 인증번호 칸은 잠긴 채이고 타이머도 없습니다|번호를 고치면 안내가 사라집니다">남의 번호</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-로그인모달"
        data-why="계약 현장이 다 찬 모달에서도 같은 규칙입니다. 불러올 후기가 없는 번호에는 문자를 보내지 않습니다. 다만 찾는 대상이 사업장이 아니라 계약 현장이라 문구가 다릅니다."
        data-steps="로그인 → 모달 → 후기를 쓰지 않은 번호를 넣고 인증을 누른 상태입니다"
        data-look="'이 번호로 작성한 후기가 없습니다.'|작성 화면과 묻는 것이 다릅니다 — 거기서는 그 후기의 번호와 맞는지 보고, 여기서는 이 번호로 남긴 후기가 있는지 봅니다">로그인 모달</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">제출</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="err-필수칸"
        data-why="빈 칸을 둔 채 제출한 자리. 여기서만은 글이 아니라 붉은 테두리로 가리키고 첫 칸으로 데려갑니다."
        data-steps="인증만 마치고 아무것도 채우지 않은 채 제출하기를 누른 상태입니다"
        data-look="빈 칸마다 붉은 테두리|화면이 첫 빈 칸으로 내려갑니다|글자 수가 모자란 칸도 같이 붉어집니다|칸 아래 설명은 없습니다 — 다른 실패와 달리 까닭을 글로 적지 않습니다">빈 칸</button>

    </nav>
  </aside>

  <main class="proto-content">
    <div id="screen"><iframe title="화면 미리보기"></iframe></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var REVIEW='face-attendance-review.html', LOGIN='login.html';
  var SITES=['예지 스타힐스 신축공사','동탄2 물류센터 신축공사','세종 행복주택 3BL 건립공사',
             '부산 명지 오피스텔 신축공사'];
  var LONG='안면인식 출퇴근관리를 도입한 뒤로 현장 출퇴근 기록이 훨씬 정확해졌습니다. '
          +'예전에는 반장님이 수기로 적어 오던 것을 다시 옮겨 적었는데 그 일이 사라졌습니다. '
          +'대리 출근이 원천적으로 막히는 것도 큰 변화였습니다.';

  /* 기록 한 건 — 작성 화면이 저장하는 모양 그대로 만든다.
     모양이 어긋나면 불러오기가 조용히 빈 폼을 준다 */
  function base(){
    return {'r-biz':'종합건축사업','q0':LONG,'q1':LONG,'q2':LONG,'q3':LONG+LONG,'q4':LONG+LONG,
      'sat1':'출퇴근 기록 정확도','sat2':'관리 시간 절감','sat3':'없음',
      'feat1':'출퇴근 기록 조회','feat2':'출역일보 내려받기','feat3':'없음',
      'wish-yn':'아니오. 없습니다','wish':'','@sat-final':'5'};
  }
  function mem(phone,name,sites,status,ago){
    var d=base(); d['r-name']=name; d['#site']=sites;
    return {status:status,at:Date.now()-(ago||3600000),phone:phone,guest:false,name:name,data:d};
  }
  function gst(phone,name,co,biz,site,status,ago){
    var d=base(); d['r-name']=name; d['g-co']=co; d['g-biz']=biz; d['r-sitename']=site;
    return {status:status,at:Date.now()-(ago||3600000),phone:phone,guest:true,name:name,data:d};
  }

  /* 시나리오 이름이 가리키는 상태를 열자마자 보여 준다. 누르는 순서를 적어 두고
     직접 밟게 하면, 그 화면을 보러 온 사람이 매번 같은 준비를 되풀이하게 된다.
     미리보기가 같은 출처라 여기서 대신 몰 수 있다 — 작성 화면에는 손대지 않는다 */
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function put(el,v){ if(!el) return; el.value=v; el.dispatchEvent(new Event('input',{bubbles:true})); }
  function hit(el){ if(el) el.click(); }
  async function signIn(d,name,phone){
    put(d.querySelector('#r-name'),name);
    put(d.querySelector('#r-phone'),phone);
    hit(d.querySelector('#btnSend')); await wait(120);
    put(d.querySelector('#r-code'),'123456');
    hit(d.querySelector('#btnVerify')); await wait(500);
  }
  /* 미이용사는 문이 둘이다 — 사업장을 밝혀야 작성자 칸이 열린다 */
  async function passBiz(d){
    put(d.querySelector('#g-co'),'대한건설');
    put(d.querySelector('#g-biz'),'5556677880');
    hit(d.querySelector('#btnBiz')); await wait(350);
  }
  /* 인증번호 요청까지만 — 실패 화면은 그 뒤에서 갈린다 */
  async function sendCode(d,name,ph){
    put(d.querySelector('#r-name'),name);
    put(d.querySelector('#r-phone'),ph);
    hit(d.querySelector('#btnSend')); await wait(150);
  }
  /* 이미 후기가 있는 사업자번호로 본인 확인 모달을 띄운다 */
  async function dupAsk(d){
    put(d.querySelector('#g-co'),'대한건설');
    put(d.querySelector('#g-biz'),'3214567890');
    hit(d.querySelector('#btnBiz')); await wait(350);
  }
  /* 모달을 취소하면 막힌 까닭이 사업자번호 칸 아래에 남는다 */
  async function dupCancel(d){
    await dupAsk(d);
    hit(d.querySelector('#askCancel')); await wait(200);
  }
  /* 모달에 남의 번호를 넣고 인증을 누른다 — 문자는 가지 않고 그 자리에서 막힌다 */
  async function askOther(d){
    put(d.querySelector('#ask-phone'),'01088880000');
    hit(d.querySelector('#askSend')); await wait(200);
  }
  function look(d,sel){ var e=d.querySelector(sel); if(e) e.scrollIntoView({block:'center'}); }
  async function logIn(d){
    put(d.querySelector('#lg-id'),'yeji');
    put(d.querySelector('#lg-pw'),'kbz1234!');
    hit(d.querySelector('#login-form button[type=submit]')); await wait(300);
  }

  /* 이미 후기가 남은 사업자번호 — 중복과 본인 확인 시나리오가 함께 쓴다 */
  var DUP_G=gst('01077770001','정소장','대한건설','321 - 45 - 67890','예지타워 신축공사','done');

  /* 화면은 목록 버튼이 가리킨다 — 설명(why·steps·look)은 버튼이 들고 있고,
     여기서는 '무엇을 열고 무엇을 심을지'만 정한다 */
  var S={
    'login-기본'   :{url:LOGIN, seed:[]},
    'login-만석'   :{url:LOGIN, act:logIn,
      seed:[mem('01011110001','김소장',[SITES[0]],'done',7200000),
            mem('01011110002','이소장',[SITES[1]],'done',5400000),
            mem('01011110003','박소장',[SITES[2]],'temp',3600000),
            mem('01011110004','최소장',[SITES[3]],'done',1800000)]},
    'mem-인증전'   :{url:REVIEW+'?u=yeji', seed:[]},
    'mem-인증후'   :{url:REVIEW+'?u=yeji', seed:[],
      act:function(d){ return signIn(d,'최소장','01090000001'); }},
    'mem-임시'     :{url:REVIEW+'?u=yeji', seed:[mem('01055550001','김소장',[SITES[1]],'temp')],
      act:function(d){ return signIn(d,'김소장','01055550001'); }},
    'mem-제출'     :{url:REVIEW+'?u=yeji', seed:[mem('01055550002','이소장',[SITES[2]],'done')],
      act:function(d){ return signIn(d,'이소장','01055550002'); }},
    'mem-만석현장' :{url:REVIEW+'?u=yeji',
      seed:[mem('01066660001','김소장',[SITES[0]],'done'), mem('01066660002','박소장',[SITES[2]],'temp')],
      act:async function(d){ await signIn(d,'최소장','01077777777');
        d.querySelector('#siteBtn').scrollIntoView({block:'center'});
        hit(d.querySelector('#siteBtn')); await wait(150); }},
    'mem-완료'     :{url:REVIEW+'?u=yeji&done=1', seed:[]},
    'gst-인증전'   :{url:REVIEW+'?guest=1', seed:[]},
    'gst-사업자확인':{url:REVIEW+'?guest=1', seed:[], act:passBiz},
    'gst-인증후'   :{url:REVIEW+'?guest=1', seed:[],
      act:async function(d){ await passBiz(d); await signIn(d,'김소장','01090000002'); }},
    'gst-중복'     :{url:REVIEW+'?guest=1',
      seed:[DUP_G], act:dupAsk},
    'gst-완료'     :{url:REVIEW+'?guest=1&done=1', seed:[]},

    /* 막히는 자리 — 칸마다 어떤 말로 막는지 한 자리에 모은다.
       실패 문구는 성공 화면보다 눈에 덜 띄어 고칠 때 빠지기 쉽다 */
    'err-로그인빈칸':{url:LOGIN, seed:[],
      act:function(d){ hit(d.querySelector('#login-form button[type=submit]')); }},
    'err-로그인실패':{url:LOGIN+'?authfail=1', seed:[], act:logIn},
    'err-번호형식' :{url:REVIEW+'?u=yeji', seed:[],
      act:async function(d){ await sendCode(d,'최소장','0212345678'); look(d,'#secVerify'); }},
    'err-인증번호' :{url:REVIEW+'?u=yeji', seed:[],
      act:async function(d){ await sendCode(d,'최소장','01090000001');
        put(d.querySelector('#r-code'),'000000');
        hit(d.querySelector('#btnVerify')); await wait(150); look(d,'#secVerify'); }},
    /* 3분을 그대로 기다릴 수는 없다 — 주소로 3초까지 줄여 둔다 */
    'err-시간초과' :{url:REVIEW+'?u=yeji&sec=3', seed:[],
      act:async function(d){ await sendCode(d,'최소장','01090000001');
        await wait(3800); look(d,'#secVerify'); }},
    'err-계약없음' :{url:REVIEW+'?guest=1', seed:[],
      act:async function(d){ put(d.querySelector('#g-co'),'대한건설');
        put(d.querySelector('#g-biz'),'1111111111');
        hit(d.querySelector('#btnBiz')); await wait(200); }},
    'err-사업자자릿수':{url:REVIEW+'?guest=1', seed:[],
      act:async function(d){ put(d.querySelector('#g-biz'),'55566');
        hit(d.querySelector('#btnBiz')); await wait(150); }},
    'err-사업자중복':{url:REVIEW+'?guest=1', seed:[DUP_G], act:dupCancel},
    'err-모달빈번호':{url:REVIEW+'?guest=1', seed:[DUP_G],
      act:async function(d){ await dupAsk(d);
        hit(d.querySelector('#askOk')); await wait(150); }},
    'err-모달남의번호':{url:REVIEW+'?guest=1', seed:[DUP_G],
      act:async function(d){ await dupAsk(d); await askOther(d); }},
    'err-로그인모달':{url:LOGIN+'?sec=180',
      seed:[mem('01011110001','김소장',[SITES[0]],'done',7200000),
            mem('01011110002','이소장',[SITES[1]],'done',5400000),
            mem('01011110003','박소장',[SITES[2]],'temp',3600000),
            mem('01011110004','최소장',[SITES[3]],'done',1800000)],
      act:async function(d){ await logIn(d); await wait(250); await askOther(d); }},
    'err-필수칸'   :{url:REVIEW+'?u=yeji', seed:[],
      act:async function(d){ await signIn(d,'최소장','01090000001');
        hit(d.querySelector('#btnSubmit')); await wait(500); }}
  };

  /* 시나리오마다 기록을 새로 깐다. 화면이 같은 출처라 여기서 심으면 그대로 읽는다 */
  function seed(s){
    try{
      for(var i=localStorage.length-1;i>=0;i--){
        var k=localStorage.key(i);
        if(k && k.indexOf('kbz_rv_')===0) localStorage.removeItem(k);
      }
      (s.seed||[]).forEach(function(r){ localStorage.setItem('kbz_rv_'+r.phone, JSON.stringify(r)); });
    }catch(e){}
  }
  function open(name){
    var s=S[name]; if(!s) return;
    seed(s);
    var f=$('#screen iframe'); if(!f) return;
    f.onload=function(){
      if(!s.act) return;
      /* 그새 다른 시나리오로 옮겨 갔으면 손대지 않는다 */
      var now=document.querySelector('.proto-nav-btn.is-active');
      if(now && now.dataset.scenario!==name) return;
      try{ s.act(f.contentDocument); }catch(e){}
    };
    f.src=s.url+(s.url.indexOf('?')<0?'?':'&')+'_t='+Date.now();
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/components.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});
  /* components.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
</body>
