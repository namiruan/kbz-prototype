<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 김반장</title>
<meta name="description" content="김반장 계정으로 로그인하고 이용후기를 남겨보세요.">
<!-- 라이브(kbz.co.kr) 폰트: 본문/CTA=Wanted Sans, 타이틀=SUITE, 배지=Pretendard -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUITE/fonts/variable/woff2/SUITEVariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* =========================================================
   kbz.co.kr 라이브 CSS 토큰 그대로 이식 (common.css :root)
   — index.html · quote.html 과 동일
   ========================================================= */
/* 이 디자인에는 어두운 모드가 없다. 선언해 두지 않으면 OS 가 어두운 모드일 때
   select 의 옵션 목록 같은 네이티브 위젯만 검게 그려져 페이지와 따로 논다 */
:root{color-scheme:light}
:root{
  --header-height:70px;
  --color-white-rgb:255,255,255;
  --color-gray-rgb:230,232,234;   /* #E6E8EA */
  --color-black-rgb:19,20,22;     /* #131416 */
  --color-blue-rgb:17,90,198;     /* #115AC6 */
  --color-navy-rgb:14,59,99;      /* #0E3B63 */
  --color-w-gray-rgb:244,245,246; /* #F4F5F6 */
  --color-d-gray-rgb:109,120,130; /* #6D7882 */
  --color-d-blue-rgb:17,71,151;   /* #114797 */
  --color-cyan-rgb:27,159,226;    /* #1B9FE2 */
  --color-p-blue-rgb:220,232,249; /* #DCE8F9 */
  --color-p-cyan-rgb:183,225,245; /* #B7E1F5 */
  --color-sky-rgb:220,238,255;    /* #DCEEFF */
  --color-lake-rgb:138,218,255;   /* #8ADAFF */

  --main-white:rgba(var(--color-white-rgb),1);
  --main-gray:rgba(var(--color-gray-rgb),1);
  --main-black:rgba(var(--color-black-rgb),1);
  --main-blue:rgba(var(--color-blue-rgb),1);
  --main-navy:rgba(var(--color-navy-rgb),1);
  --sub-w-gray:rgba(var(--color-w-gray-rgb),1);
  --sub-d-gray:rgba(var(--color-d-gray-rgb),1);
  --sub-d-blue:rgba(var(--color-d-blue-rgb),1);
  --sub-cyan:rgba(var(--color-cyan-rgb),1);
  --pastel-blue:rgba(var(--color-p-blue-rgb),1);
  --pastel-cyan:rgba(var(--color-p-cyan-rgb),1);
  --sky:rgba(var(--color-sky-rgb),1);
  --lake:rgba(var(--color-lake-rgb),1);

  /* 라이브 폰트 스택: 본문/CTA=Wanted Sans, 타이틀=SUITE, 폴백=Apple SD Gothic Neo */
  --font-body:"Wanted Sans Variable","Wanted Sans","Apple SD Gothic Neo",sans-serif;
  --font-title:"SUITE Variable","SUITE","Apple SD Gothic Neo",sans-serif;
  /* 라이브 로그인 화면의 안내 배지는 Pretendard 를 쓴다 */
  --font-pretendard:"Pretendard Variable","Pretendard","Apple SD Gothic Neo",sans-serif;

  /* 김반장 3.0 디자인 시스템 시맨틱 토큰 (index.html 의 .ui-demo 와 같은 출처)
     로그인 화면이 쓰는 것만 가져왔다 */
  --ds-text-body:#131416;
  --ds-text-subtle:#6d7882;
  --ds-text-disabled:#8a949e;
  --ds-border-subtle:#cdd1d5;
  --ds-text-label:#464c53;
  --ds-text-disabled:#8a949e;
  --ds-bg-disabled:#e6e8ea;

  /* 라이브 radial-sky 그라디언트 */
  --grad-radi-sky-top:radial-gradient(66.24% 130.23% at 51.11% -20.35%, rgba(var(--color-sky-rgb),.8) 0%, rgba(var(--color-sky-rgb),0) 100%);
  --grad-radi-sky-bottom:radial-gradient(49.14% 96.61% at 51.11% 100%, rgba(var(--color-sky-rgb),.8) 0%, rgba(var(--color-sky-rgb),0) 100%);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-body);color:var(--main-black);background:#FBFBFB;line-height:1.62;-webkit-font-smoothing:antialiased;cursor:default}
h1,h2,h3,h4{font-family:var(--font-title);line-height:1.24;letter-spacing:-0.03em;font-weight:800}
a{color:inherit;text-decoration:none}
.tnum{font-variant-numeric:tabular-nums}
.inner{max-width:1120px;margin:0 auto;padding:0 30px;width:100%}
.acts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:30px}
.title-lg{font-family:var(--font-title);font-size:38px;color:var(--main-black);letter-spacing:-.035em}
.title-md{font-family:var(--font-title);font-size:30px;color:var(--main-black);letter-spacing:-.03em}
.center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* =========================================================
   후기 작성 페이지 전용
   ---------------------------------------------------------
   quote.html 과 같은 규율: 여백과 타이포로 구조를 만들고,
   색은 '선택된 것'과 CTA 에만 쓴다. 박스·그림자·알약 버튼 없음.
   ========================================================= */
body.review-page{
  --ink:#0C0D0F;          /* 본문 */
  --ink-2:#5C636C;        /* 보조 */
  --ink-3:#6F767E;        /* 라벨·설명 (흰 배경 대비 4.6:1) */
  --ink-4:#A7ADB4;        /* 장식용 — 플레이스홀더·아이콘·구분자 */
  --line:#E8EAED;         /* 헤어라인 */
  --line-soft:#F0F1F3;    /* 더 옅은 구분선 */
  --fill:#F7F8F9;         /* 사이드 패널 */
  --accent:var(--main-blue);
  --accent-tint:rgba(var(--color-blue-rgb),.06);
  --danger:#D93F45;
  --field-line:#6D7882;   /* 라이브 폼 테두리 */
  --field-ink:#33363D;    /* 라이브 폼 입력 텍스트 */
  --field-label:#131416;  /* 라이브 폼 라벨 */
  background:var(--main-white);
  color:var(--ink);
  letter-spacing:-.012em;
}
.review-page .inner{max-width:1060px}

/* 완료 화면에만 깔리는 하늘색 바닥 — quote.html 과 같은 연출 */
body.review-page.is-done::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(78% 108% at 100% 100%, rgba(var(--color-sky-rgb),.8) 0%, rgba(var(--color-sky-rgb),0) 100%) no-repeat}

/* =========================================================
   1) 로그인 게이트 — kbz.co.kr/login 라이브 규격 이식
   ---------------------------------------------------------
   배경 : linear-gradient(#DCEEFF 21.75%, transparent 61.64%) + #F4F5F6
   폼   : 폭 280 고정. 라벨칸 130 + 입력칸 180 이 280 을 넘겨 줄이 접히므로
          라벨이 위, 입력칸이 아래로 내려간다 (세로 간격 5px).
   입력 : padding 16/12 · radius 4 · 테두리 #CDD1D5
          본문 Wanted Sans 17/22 · 자간 -0.43px · 플레이스홀더 #6D7882
   CTA  : 파란 알약이 아니라 검정 블록 — padding 30 · radius 12 ·
          hover 시 radius 300 + 파란 radial 그라디언트
   ========================================================= */
.lg-bg{display:flex;width:100%;min-height:100vh;padding:96px 0 0;flex-direction:column;justify-content:center;align-items:center;
  background:linear-gradient(rgba(var(--color-sky-rgb),1) 21.75%, rgba(var(--color-white-rgb),0) 61.64%), var(--sub-w-gray)}
@supports(min-height:100dvh){.lg-bg{min-height:100dvh}}
.lg-frame{display:flex;max-width:100%;max-height:900px;justify-content:center;align-items:center;gap:40px;flex:1 0 0;align-self:stretch}
.lg-group{display:flex;padding:0 30px;justify-content:center;align-items:center;gap:60px;flex:1 0 0}
@media(max-width:340px){.lg-group{padding:0 20px}}
.lg-list{display:flex;flex-direction:column;align-items:center;gap:30px}
.lg-contents{display:flex;max-width:600px;flex-direction:column;align-items:center;gap:10px;align-self:stretch}
.lg-title{display:flex;place-content:center;align-items:center;gap:2px;align-self:stretch;flex-wrap:wrap}
/* 피그마 partition-conetents-head : Wanted Sans Bold 30 / 자간 -5% / 줄높이 120%
   (contents-title 높이 72 = 36 × 2줄). 899·532 에서 26 / 24 로 줄어든다. */
.lg-title-txt{width:100%;color:var(--main-navy);text-align:center;font-family:var(--font-body);font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-1.5px}
@media(max-width:899px){.lg-title-txt{font-size:26px;letter-spacing:-1.3px}}
@media(max-width:532px){.lg-title-txt{font-size:24px;letter-spacing:-1.2px}}
#login-form{display:flex;width:280px;flex-direction:column;gap:30px}
.lg-input-group{display:flex;flex-direction:column;align-items:flex-start;gap:20px}
.lg-row{display:flex;width:280px;max-width:280px;align-items:center;align-content:center;gap:5px 10px;flex-wrap:wrap}
.lg-row-title{display:flex;width:130px;height:19px;align-items:center;gap:5px;flex-shrink:0}
/* 피그마 partition-banner-contents : 18/400 · 줄높이 1.4 · 자간 -0.36px */
.lg-row-title label{color:var(--main-black);font-size:18px;font-weight:400;line-height:1.4;letter-spacing:-.36px;white-space:nowrap}
@media(max-width:532px){.lg-row-title label{font-size:16px}}
.lg-input{display:flex;min-width:180px;flex-direction:column;align-items:flex-start;gap:3px;flex:1 0 0}
.lg-input-wrap{display:flex;padding:16px 12px;justify-content:space-between;align-items:center;align-self:stretch;border-radius:4px;border:1px solid var(--ds-border-subtle);background:var(--main-white);transition:border-color .15s}
.lg-input-wrap:focus-within{border-color:var(--main-blue)}
.lg-input-wrap.is-err{border-color:#E53935}
.lg-input-wrap input{display:block;min-width:20px;flex:1 0 0;overflow:hidden;border:0;outline:0;background:none;text-overflow:ellipsis;
  /* Body/Regular = typo/font/type(Pretendard) 17 / 줄높이 22 / 자간 -0.43 */
  color:var(--main-black);font-family:var(--font-pretendard);font-size:17px;font-style:normal;font-weight:400;line-height:22px;letter-spacing:-.43px}
.lg-input-wrap input::placeholder{color:var(--sub-d-gray)}
/* 피그마 icon_size 20×20 · Color/Icon/gray-light = --ds-text-disabled (#8A949E) */
.lg-eye{flex:none;display:flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:10px;padding:0;border:0;background:none;color:var(--ds-text-disabled);cursor:pointer}
/* 색은 CSS 가 정하고 svg 는 모양만 낸다 — <img> 로 두면 파일에 박힌 색을 못 덮는다.
   그래서 mask 로 실루엣만 떠서 currentColor 를 입힌다. */
.lg-eye i{display:block;width:20px;height:20px;background:currentColor;
  -webkit-mask:url("images/review/hide.svg") center/contain no-repeat;
          mask:url("images/review/hide.svg") center/contain no-repeat}
.lg-eye[aria-pressed="true"] i{-webkit-mask-image:url("images/review/show.svg");mask-image:url("images/review/show.svg")}
.lg-eye:hover{color:var(--main-black)}
.lg-eye:focus-visible{outline:2px solid var(--main-blue);outline-offset:2px;border-radius:3px}
/* 오류는 칸마다 바로 아래에 붙는다 (라이브 .input_message_atomic) */
.lg-msg{display:none;font-size:12px;line-height:1.5}
.lg-msg.danger{display:block;color:#E53935}
.lg-btn-group{display:flex;flex-direction:column;align-items:center;gap:5px;align-self:stretch}
/* 피그마 CTA button : p-30 · radius 12 · #131416 · max-w 300 (실측 280×89) */
.review-page .lg-cta{position:relative;display:flex;max-width:300px;padding:30px;align-items:center;align-self:stretch;border-radius:12px;background:var(--main-black);
  border:0;box-shadow:none;overflow:hidden;cursor:pointer;font-family:inherit;z-index:1}
.review-page .lg-cta:focus-visible{outline:2px solid var(--main-blue);outline-offset:3px}
/* 글자칸은 오른쪽 48px 을 비워 화살표 자리를 남긴다 (피그마 btn name pr-48) */
.lg-cta .btn-name{display:flex;flex-direction:column;align-items:flex-start;gap:5px;flex:1 0 0;min-width:0;padding-right:48px}
.lg-cta .btn-name b{color:var(--main-white);font-family:var(--font-body);font-size:24px;font-weight:700;line-height:normal;text-align:left;white-space:nowrap}
@media(max-width:532px){.lg-cta .btn-name b{font-size:20px}}
/* 화살표는 흐름에 끼우지 않고 오른쪽 32px 에 띄운다 (피그마 main_banner_btn) */
/* 라이브 .btn-icon 과 같은 규격 : 24×24 · 오른쪽 끝에서 32px · 세로 가운데 */
.lg-cta .arrow{position:absolute;right:32px;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px;color:var(--main-white)}
.lg-cta .arrow svg{position:relative;width:24px;height:24px;display:block}
/* hover : 라이브 .partition-7-btns .btn::after 그대로.
   오른쪽 위에 걸친 378px 원이 scale(0) → scale(1) 로 부풀어 오른다.
   버튼 모양(radius 12)과 바탕색은 그대로다. */
.lg-cta::after{content:"";position:absolute;width:378px;height:378px;border-radius:50%;
  right:-213px;top:-122px;transform:scale(0);opacity:0;z-index:0;pointer-events:none;
  transition:transform .3s,opacity .3s;
  background:radial-gradient(49.14% 96.61% at 51.11% 100%, rgb(0,98,196) 45%, rgba(0,67,134,0) 100%)}
.review-page .lg-cta:hover::after{opacity:1;transform:scale(1)}
@media(prefers-reduced-motion:reduce){.lg-cta::after{transition:opacity .3s}.review-page .lg-cta:hover::after{transform:scale(1)}}
/* 피그마 footer-tab : Wanted Sans 16/400 · 자간 -0.16px. group-list 간격이 30px 인데
   .lg-btn-group 의 gap 5px 가 이미 붙으므로 25px 만 더한다 */
.lg-link{max-width:500px;align-self:stretch;margin-top:25px;color:var(--sub-d-gray);text-align:center;cursor:pointer;
  font-size:16px;font-weight:400;line-height:normal;letter-spacing:-.16px}
.lg-link a:hover{color:var(--main-black)}

/* ===== 로그인 화면 하단 이벤트 띠 (피그마 partition-06) =====
   바닥 흰색 + backdrop-blur 50. padding 25 에 안쪽 높이 50 → 띠 자체는 100px.
   사진은 흐름에 끼우지 않고 띠 오른쪽에 띄워 위로 65px 삐져나온다. */
/* .lg-bg 가 align-items:center 라 그냥 두면 띠가 내용 너비로 줄어든다 — 화면 폭을 꽉 채운다 */
.lg-promo{align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;background:var(--main-white);backdrop-filter:blur(50px)}
.lg-promo-inner{position:relative;display:flex;flex-direction:column;gap:15px;height:50px;align-items:flex-start;justify-content:center;max-width:600px;width:100%;padding:0 30px}
@media(max-width:532px){.lg-promo-inner{padding:0}}
.lg-promo-txt{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;max-width:450px;width:100%;line-height:normal;word-break:keep-all}
/* contents-marque : Wanted Sans SemiBold 16 (691 아래 14) · Black #272B2F */
.lg-promo-txt .sm{color:#272B2F;font-family:var(--font-body);font-size:16px;font-weight:600;line-height:normal;white-space:nowrap}
/* contents-marque-header : Wanted Sans Bold 24 · 자간 -1.2px (899→22, 691→18) */
.lg-promo-txt .bg{color:var(--main-blue);font-family:var(--font-body);font-size:24px;font-weight:700;line-height:normal;letter-spacing:-1.2px}
@media(max-width:899px){.lg-promo-txt .bg{font-size:22px;letter-spacing:-1.1px}}
@media(max-width:691px){.lg-promo-txt .sm{font-size:14px}.lg-promo-txt .bg{font-size:18px;letter-spacing:-.9px}}
/* =========================================================
   계약 현장이 다 찼을 때 뜨는 모달
   ---------------------------------------------------------
   작성 화면의 모달(피그마 3617:35909)과 같은 껍데기를 쓴다. 같은 일을 하는
   창이 화면마다 달라 보이면 같은 창인지 알아보지 못한다.
   다만 시각 배지는 두지 않는다 — 로그인 전이라 누구의 후기인지 모르는 채이고,
   모르는 사람의 시각을 적으면 남의 기록을 보여 주는 셈이 된다.
   ========================================================= */
.lg-modal{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.lg-modal[hidden]{display:none}
.lg-modal-dim{position:absolute;inset:0;background:rgba(39,43,47,.8);animation:lgFade .18s ease}
/* min-width:0 이 없으면 flex 아이템의 자동 최소폭이 max-width 를 이겨 상자가 화면 밖으로 밀린다 */
.lg-modal-box{position:relative;display:flex;flex-direction:column;width:100%;max-width:350px;min-width:0;
  max-height:calc(100vh - 40px);overflow:auto;border-radius:8px;background:var(--main-white);
  animation:lgRise .22s cubic-bezier(.22,1,.36,1)}
@keyframes lgFade{from{opacity:0}to{opacity:1}}
@keyframes lgRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.lg-modal-dim,.lg-modal-box{animation:none}}
.lg-modal-body{padding:20px}
.lg-modal-box h3{color:var(--main-black);font-family:var(--font-body);font-size:30px;font-weight:700;
  letter-spacing:-1.5px;line-height:normal;word-break:keep-all}
.lg-modal-box .lg-modal-note{margin-top:14px;color:var(--ds-text-subtle);font-family:var(--font-body);
  font-size:16px;font-weight:400;line-height:1.5;letter-spacing:-.32px;word-break:keep-all}
/* 입력 칸은 작성 화면의 것을 그대로 옮겼다 — 같은 모달이므로 같은 칸이어야 한다 */
.ask-fields{display:grid;gap:20px;margin-top:20px;min-width:0}
.ask-fields>*,.ask-fields .f-in{min-width:0}
.rw-lb{display:flex;align-items:center;gap:5px;min-height:19px;margin-bottom:5px}
.rw-lb span{color:var(--ds-text-label);font-family:var(--font-pretendard);font-size:14px;font-weight:400;line-height:18px;letter-spacing:-.08px}
.rw-lb em{font-style:normal;color:var(--main-blue);font-family:var(--font-pretendard);font-size:14px;font-weight:400}
.f-in{display:flex;align-items:center;gap:10px;padding:16px 12px;background:var(--main-white);
  border:1px solid var(--ds-border-subtle);border-radius:4px;transition:border-color .15s}
.f-in:focus-within{border-color:#6d7882}
.f-in.is-err{border-color:#E53935}
.f-in[data-disabled]{background:var(--ds-bg-disabled)}
.f-in input{flex:1 0 0;min-width:20px;border:0;outline:0;background:none;
  color:var(--ds-text-body);font-family:var(--font-pretendard);font-size:17px;font-weight:400;line-height:22px;letter-spacing:-.43px}
.f-in input::placeholder{color:var(--ds-text-subtle)}
/* 칸 옆에 붙는 버튼 — 작성 폼과 같은 규칙. align-items:stretch 라 버튼 높이가 칸에 맞는다 */
.rw-withbtn{display:flex;align-items:stretch;gap:8px}
.rw-withbtn .f-in{flex:1 0 0;min-width:0}
.rw-withbtn .btn{flex:none;padding:0 16px;border-radius:4px;border:1px solid var(--main-blue);
  background:var(--main-blue);color:var(--main-white);
  font-family:var(--font-pretendard);font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.rw-withbtn .btn:hover{background:#0E4CAA;border-color:#0E4CAA}
.ask-fields .timer{flex:none;color:var(--main-blue);font-family:var(--font-body);font-size:14px;font-variant-numeric:tabular-nums}
/* 칸 아래 한 줄 — 작성 폼의 .f-msg 와 같은 규격이다 (input_message_atomic) */
.f-msg{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-msg .note{color:var(--sub-d-gray);font-family:var(--font-pretendard);font-size:13px;font-weight:400;line-height:18px;letter-spacing:-.08px}
.f-msg .note.danger{color:#E53935}
.f-msg .note.ok{color:var(--main-blue)}
/* 자리를 미리 비워 두면 칸 사이가 늘 떠 보인다 — 말이 있을 때만 자리를 차지한다 */
.ask-fields .f-msg{margin-top:0}
.ask-fields .f-msg .note{margin-top:8px;word-break:keep-all}
.ask-fields .f-msg .note:empty{display:none}
.lg-modal-acts .p .ic{flex:none;display:flex;width:24px;height:24px;align-items:center;justify-content:center}
.lg-modal-acts .p .ic svg{width:20px;height:20px;display:block}
.lg-modal-acts{display:flex;align-items:stretch;margin-top:auto;background:var(--main-blue)}
.lg-modal-acts button{display:flex;align-items:center;justify-content:center;gap:4px;
  padding:16px clamp(12px,4vw,24px);border:0;cursor:pointer;
  font-family:var(--font-pretendard);font-size:clamp(17px,5.2vw,22px);font-weight:600;
  line-height:28px;letter-spacing:-.26px;white-space:nowrap}
.lg-modal-acts .s{flex:none;width:clamp(86px,26vw,120px);background:var(--main-white);color:var(--main-black);
  border-top:1px solid rgba(var(--color-black-rgb),.1)}
.lg-modal-acts .s:hover{background:#F4F5F6}
.lg-modal-acts .p{flex:1 0 0;min-width:0;background:var(--main-blue);color:var(--main-white)}
.lg-modal-acts .p:hover{background:#0E4CAA}
@media(max-width:380px){.lg-modal-box h3{font-size:26px;letter-spacing:-1.3px}}

/* 사진은 background 로 둔다 — 파일이 없으면 깨진 아이콘 없이 그냥 비어 보인다 */
.lg-promo-img{display:block;position:absolute;right:0;top:-65px;width:115px;height:140px;background:url("images/review/login-cta.png") center bottom/contain no-repeat}
@media(max-width:532px){.lg-promo-img{top:-24px;width:81px;height:99px}}
/* 460 아래에선 사진을 비운다 — 문구가 두 줄 다 사진 자리까지 와서, 같이 두면 글자가 사진에 깔린다.
   사진은 곁들인 그림이고 문구가 이 띠의 용건이라 그림을 접는다.

   접고 남은 자리는 글자가 메운다. 그림을 치웠는데 오른쪽이 비면 접은 값이 없다 —
   큰 줄이 띠 폭을 끝까지 쓰도록 화면 폭에 맞춰 글자를 키운다.
   18px 일 때 큰 줄의 글자 폭이 295, 화살표가 차지하는 폭이 18, 반올림 여유가 4 라
   글자크기 = 18 × (안쪽폭 − 22) ÷ 295 이고, 안쪽폭은 화면폭에서 좌우 여백 50 을 뺀 값이다.
   화살표 그림은 24 칸에 그려졌지만 오른쪽 9 가 빈 칸이라, 그 몫을 음수 여백으로 걷어내야
   글자가 아니라 획이 끝에 닿는다 — 눈은 칸이 아니라 획을 본다.
   작은 줄도 같은 식으로 제 폭을 채운다. 큰 줄만 채우면 작은 줄 끝이 한참 남아 덜 찬 것으로 보인다 —
   크기 차이가 줄어드는 대신 굵기와 색이 위아래를 가른다.
   자간은 px 로 두면 커진 글자에 안 맞아 비율(-.05em = 18px 의 -.9px)로 바꾼다.
   그래도 접힐 만큼 좁으면 잘리지 않게 높이는 고정을 풀고 최소값으로만 둔다 */
@media(max-width:459px){
  .lg-promo-img{display:none}
  .lg-promo-inner{height:auto;min-height:50px}
  .lg-promo-txt .bg{font-size:calc(6.1vw - 4.39px);letter-spacing:-.05em}
  .lg-promo-txt .bg .go{margin-right:-9px}
  .lg-promo-txt .sm{font-size:calc(5.224vw - 2.821px)}
}
/* 360 아래는 좌우 여백 25 가 글자보다 아까워진다 — 16 으로 줄이고 그만큼 글자를 더 키운다 */
@media(max-width:360px){
  .lg-promo{padding:25px 16px}
  .lg-promo-txt .bg{font-size:calc(6.1vw - 3.29px)}
  .lg-promo-txt .sm{font-size:calc(5.224vw - 1.881px)}
}
/* 띠 전체가 누르는 자리다 — 글자만 링크처럼 꾸미면 어디를 눌러야 할지 흐려진다.
   안쪽 사진이 right/top 으로 붙어 있어 여백을 주면 사진이 밀린다. 자리는 그대로
   두고 hover 배경만 box-shadow 로 바깥까지 번지게 한다 */
a.lg-promo-inner{text-decoration:none;color:inherit;cursor:pointer;border-radius:8px;
  transition:background .15s,box-shadow .15s}
a.lg-promo-inner:hover{background:rgba(var(--color-blue-rgb),.05);
  box-shadow:0 0 0 10px rgba(var(--color-blue-rgb),.05)}
a.lg-promo-inner:focus-visible{outline:2px solid var(--main-blue);outline-offset:2px}
/* 갈 곳이 있다는 표시 — 문구 끝에 붙여 한 줄로 읽히게 한다 */
.lg-promo-txt .bg .go{display:inline-flex;vertical-align:-4px;margin-left:2px;transition:transform .15s}
.lg-promo-txt .bg .go svg{width:20px;height:20px;display:block}
a.lg-promo-inner:hover .go{transform:translateX(3px)}
@media(max-width:691px){.lg-promo-txt .bg .go svg{width:17px;height:17px}
  .lg-promo-txt .bg .go{vertical-align:-3px}}

</style>
</head>

<body class="review-page">

<section class="lg-bg">
  <div class="lg-frame">
    <div class="lg-group">
      <div class="lg-list">

        <div class="lg-contents">
          <div class="lg-title">
            <p class="lg-title-txt">김반장 계정으로<br>이용후기를 남겨보세요!</p>
          </div>
        </div>

        <form id="login-form" novalidate>
          <div class="lg-input-group">

            <div class="lg-row">
              <div class="lg-row-title"><label for="lg-id">아이디</label></div>
              <div class="lg-input">
                <div class="lg-input-wrap">
                  <input id="lg-id" type="text" name="userid" required autocomplete="username" placeholder="아이디를 입력하세요">
                </div>
                <p class="lg-msg" id="lgMsgId" role="alert"></p>
              </div>
            </div>

            <div class="lg-row">
              <div class="lg-row-title"><label for="lg-pw">비밀번호</label></div>
              <div class="lg-input">
                <div class="lg-input-wrap">
                  <input id="lg-pw" type="password" name="password" required autocomplete="current-password" placeholder="비밀번호를 입력하세요">
                  <button type="button" class="lg-eye" id="lgEye" aria-label="비밀번호 보기" aria-pressed="false">
                    <i aria-hidden="true"></i>
                  </button>
                </div>
                <p class="lg-msg" id="lgMsgPw" role="alert"></p>
              </div>
            </div>

          </div>

          <div class="lg-btn-group">
            <button type="submit" class="lg-cta">
              <span class="btn-name"><b>이용후기 남기기</b></span>
              <span class="arrow" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </button>

            <p class="lg-link"><a href="#">비밀번호 찾기</a></p>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- 하단 이벤트 띠 — 띠 전체가 비회원 작성 폼으로 가는 길이다.
       작은 줄은 자격(26년 안면인식 사용 이력), 큰 줄은 지금 상태를 풀어 준다.
       '계약이 끝났어도'라고 하면 안면인식 계약인지 본 서비스 계약인지 모른다 —
       안면인식은 그만뒀어도 김반장은 쓰고 있을 수 있어서, 제품명을 그대로 적는다 -->
  <div class="lg-promo">
    <a class="lg-promo-inner" href="face-attendance-review.html?guest=1">
      <div class="lg-promo-txt">
        <p class="sm">26년에 안면인식 출퇴근관리를 쓴 적 있다면</p>
        <p class="bg">현재 이용사가 아니어도 참여 가능해요!<span class="go"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span></p>
      </div>
      <span class="lg-promo-img" role="img" aria-label="현장에서 휴대폰으로 후기를 남기는 이용자"></span>
    </a>
  </div>
</section>

<!-- 계약 현장이 다 찼을 때 -->
<div class="lg-modal" id="fullModal" hidden>
  <div class="lg-modal-dim" id="fullDim"></div>
  <div class="lg-modal-box" role="dialog" aria-modal="true" aria-labelledby="fullTitle">
    <div class="lg-modal-body">
      <h3 id="fullTitle">모든 계약 현장의<br>후기가 작성되었습니다</h3>
      <p class="lg-modal-note">임시저장했거나 제출한 후기를 불러오려면 작성자 본인 확인을 해주세요.</p>
      <!-- 작성 화면의 인증 모달과 같은 칸이다. 시각은 적지 않는다 —
           아직 누구인지 모르는 채라, 남의 기록의 시각을 보여 주는 셈이 된다 -->
      <div class="ask-fields">
        <div>
          <div class="rw-lb"><label for="ask-phone"><span>작성자 핸드폰번호</span></label><em>(필수)</em></div>
          <!-- 인증 버튼은 작성 폼의 것과 같다 — 같은 일을 하는 버튼이 자리마다 다르게
               생기면 같은 버튼인지 알아보지 못한다 (피그마 3617:35909 의 칸 안 칩에서 벗어난다) -->
          <div class="rw-withbtn">
            <div class="f-in">
              <input id="ask-phone" type="tel" inputmode="tel" maxlength="17" placeholder="010 - **** - ****" autocomplete="off">
            </div>
            <button type="button" class="btn" id="askSend">인증</button>
          </div>
          <!-- 막힌 칸 바로 밑에서 말한다 — 상자 맨 아래 한 줄로 몰아 두면
               두 칸 중 어느 쪽 이야기인지 알아보려 눈이 되돌아간다 -->
          <div class="f-msg"><p class="note" id="askPhoneMsg"></p></div>
        </div>
        <div>
          <div class="rw-lb"><label for="ask-code"><span>인증번호</span></label><em>(필수)</em></div>
          <div class="f-in" id="askCodeWrap" data-disabled>
            <input id="ask-code" type="text" inputmode="numeric" maxlength="6" placeholder="문자로 받은 6자리" autocomplete="off" disabled>
            <span class="timer" id="askTimer" hidden>03:00</span>
          </div>
          <div class="f-msg"><p class="note" id="askCodeMsg"></p></div>
        </div>
      </div>
    </div>
    <div class="lg-modal-acts">
      <button type="button" class="s" id="fullCancel">취소</button>
      <button type="button" class="p" id="fullGo">
        <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5 11-11"/></svg></span><span>후기 불러오기</span></button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var $ = function(s){return document.querySelector(s);};

  /* 칸마다 바로 아래에 붉은 안내를 붙인다 (라이브 .input_message_atomic) */
  var LG = [
    {el:$('#lg-id'), msg:$('#lgMsgId'), text:'아이디를 입력해 주세요.'},
    {el:$('#lg-pw'), msg:$('#lgMsgPw'), text:'비밀번호를 입력해 주세요.'}
  ];
  /* 값이 틀린 경우는 어느 칸 탓인지 가릴 수 없다 — 둘 다 붉게 두고 말은 아래 칸에 붙인다.
     '아이디 또는' 이 이미 어느 쪽인지 모른다고 말하고 있다.
     빈 칸과 달리 한 칸만 고쳐 지울 수 없으므로, 어느 칸을 건드리든 둘 다 푼다 */
  var MISS = false;
  function lgClear(f){
    f.el.closest('.lg-input-wrap').classList.remove('is-err');
    f.msg.classList.remove('danger');
    f.msg.textContent = '';
  }
  function lgClearAll(){ LG.forEach(lgClear); MISS = false; }
  LG.forEach(function(f){ f.el.addEventListener('input', function(){
    if(MISS) lgClearAll(); else lgClear(f); }); });

  /* 비밀번호 보기 — 가려져 있을 때만 눈에 사선이 그어진다 */
  var lgEye = $('#lgEye');
  lgEye.addEventListener('click', function(){
    var pw = $('#lg-pw'), on = pw.type === 'password';
    pw.type = on ? 'text' : 'password';
    lgEye.setAttribute('aria-pressed', on ? 'true' : 'false');
    lgEye.setAttribute('aria-label', on ? '비밀번호 가리기' : '비밀번호 보기');
    pw.focus();
  });

  $('#login-form').addEventListener('submit', function(e){
    e.preventDefault();
    if(MISS) lgClearAll();
    var first = null;
    LG.forEach(function(f){
      if(!f.el.value.trim()){
        f.el.closest('.lg-input-wrap').classList.add('is-err');
        f.msg.textContent = f.text;
        f.msg.classList.add('danger');
        if(!first) first = f.el;
      } else lgClear(f);
    });
    if(first){ first.focus(); return; }

    /* 프로토타입은 비어 있지만 않으면 통과시킨다.
       값이 틀린 화면을 보려면 주소에 ?authfail=1 을 붙이면 된다. */
    if(new URLSearchParams(location.search).get('authfail') === '1'){
      MISS = true;
      LG.forEach(function(f){ f.el.closest('.lg-input-wrap').classList.add('is-err'); });
      var m = $('#lgMsgPw');
      m.textContent = '아이디 또는 비밀번호가 일치하지 않습니다.';
      m.classList.add('danger');
      $('#lg-pw').select();
      return;
    }
    /* 계약 현장에 빠짐없이 후기가 있으면 새로 쓸 자리가 없다 — 들여보내기 전에 말한다 */
    if(allSitesCovered()){ openFull(); return; }
    go();
  });

  /* 어느 계정으로 들어왔는지 작성 화면이 머리에 띄울 수 있게 넘긴다 */
  function go(){
    location.href = 'face-attendance-review.html?u=' + encodeURIComponent($('#lg-id').value.trim());
  }

  /* =========================================================
     계약 현장이 다 찼는지
     ---------------------------------------------------------
     프로토타입이라 계약 목록과 후기가 한 브라우저 안에 있다. 목록은 작성 화면과
     같은 것을 써야 하므로 여기에도 같은 배열을 둔다 (한 파일씩 독립인 구조라
     가져다 쓸 자리가 없다 — 작성 화면의 SITES 를 고치면 여기도 같이 고친다).
     본사는 현장이 아니라 계약 건에서 뺀다.
     ========================================================= */
  var SITES=['예지 스타힐스 신축공사','동탄2 물류센터 신축공사','세종 행복주택 3BL 건립공사',
             '부산 명지 오피스텔 신축공사'];
  function coveredSites(){
    var out={};
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k.indexOf('kbz_rv_')!==0) continue;
        var r=JSON.parse(localStorage.getItem(k)||'null');
        /* 임시저장분도 센다 — 아직 제출 전이라도 그 현장을 맡은 사람이 이미 있다.
           비회원은 계약 목록이 없어 현장명을 글로 적는다(r-sitename). 계약 현장을
           가리키는 #site 는 애초에 담기지 않으니 따로 걸러낼 것이 없다 */
        if(!r || !r.data) continue;
        (r.data['#site']||[]).forEach(function(v){ out[v]=true; });
      }
    }catch(e){}
    return out;
  }
  function allSitesCovered(){
    var c=coveredSites();
    return SITES.every(function(t){ return c[t]; });
  }

  /* =========================================================
     본인 확인 — 작성 화면의 인증 모달과 같은 규칙을 쓴다
     번호가 그 후기를 찾는 열쇠이므로, 여기서 한 번 받으면 작성 화면에서 다시
     받지 않는다. 확인한 번호를 탭에 남겨 건네준다
     ========================================================= */
  var fullModal=$('#fullModal');
  var onlyNum=function(v){ return String(v).replace(/\D/g,''); };
  function fmtPhone(v){
    var d=onlyNum(v).slice(0,11);
    return d.length>7 ? d.slice(0,3)+' - '+d.slice(3,7)+' - '+d.slice(7)
         : d.length>3 ? d.slice(0,3)+' - '+d.slice(3) : d;
  }
  /* 인증 유효 시간. 작성 화면과 같은 규칙이다 — 시나리오에서만 sec=3 처럼 줄인다 */
  var SEC=(function(){ var n=parseInt(new URLSearchParams(location.search).get('sec'),10);
    return (n>0 && n<=180) ? n : 180; })();
  var askTimer=null, askLeft=SEC;
  /* 말은 그 말이 가리키는 칸 밑에 둔다. where 가 'code' 면 인증번호 칸,
     아니면 핸드폰 칸이다. 한 번에 한 마디만 남기고 다른 칸은 비운다 */
  function askMsg(t,ok,where){
    var on = $(where==='code' ? '#askCodeMsg' : '#askPhoneMsg');
    var off= $(where==='code' ? '#askPhoneMsg' : '#askCodeMsg');
    on.textContent=t||''; on.className = t ? (ok?'note ok':'note danger') : 'note';
    off.textContent=''; off.className='note';
  }
  function askReset(){
    if(askTimer){ clearInterval(askTimer); askTimer=null; }
    $('#ask-phone').value=''; $('#ask-code').value='';
    $('#ask-code').disabled=true; $('#askCodeWrap').setAttribute('data-disabled','');
    $('#askTimer').hidden=true;
    $('#askSend').disabled=false; $('#askSend').textContent='인증';
    document.querySelectorAll('#fullModal .f-in').forEach(function(w){ w.classList.remove('is-err'); });
    askMsg('');
  }
  function openFull(){
    askReset();
    fullModal.hidden=false;
    document.body.style.overflow='hidden';
    setTimeout(function(){ $('#ask-phone').focus(); },30);
  }
  function closeFull(){
    if(askTimer){ clearInterval(askTimer); askTimer=null; }
    fullModal.hidden=true; document.body.style.overflow='';
  }
  $('#ask-phone').addEventListener('input',function(){
    this.value=fmtPhone(this.value);
    this.closest('.f-in').classList.remove('is-err'); askMsg('');
  });
  $('#ask-code').addEventListener('input',function(){
    $('#askCodeWrap').classList.remove('is-err'); askMsg('');
  });
  function askTick(){
    var m=String(Math.floor(askLeft/60)).padStart(2,'0'), sec=String(askLeft%60).padStart(2,'0');
    $('#askTimer').textContent=m+':'+sec;
    if(askLeft--<=0){ clearInterval(askTimer); askTimer=null;
      askMsg('인증 시간이 지났습니다. 다시 요청해 주세요.', false, 'code'); }
  }
  /* 이 번호로 남은 계약 현장 후기 — 없으면 이 창에서 할 수 있는 일이 없다 */
  function ownerOf(d){
    var rec=null;
    try{ rec=JSON.parse(localStorage.getItem('kbz_rv_'+d)||'null'); }catch(e){}
    return (rec && !rec.guest && rec.data && (rec.data['#site']||[]).length) ? rec : null;
  }
  $('#askSend').addEventListener('click',function(){
    var d=onlyNum($('#ask-phone').value);
    if(d.length!==11 || d.slice(0,2)!=='01'){
      $('#ask-phone').closest('.f-in').classList.add('is-err');
      askMsg('010으로 시작하는 11자리로 입력해 주세요.'); $('#ask-phone').focus(); return;
    }
    /* 불러올 후기가 없는 번호에 문자를 보낼 까닭이 없다 — 작성 화면과 같은 규칙이다.
       다만 묻는 것이 다르다. 작성 화면은 손에 쥔 후기의 번호와 맞는지 보고,
       여기서는 이 번호로 남긴 후기가 있는지 찾는다 — 그래서 말도 다르다 */
    if(!ownerOf(d)){
      $('#ask-phone').closest('.f-in').classList.add('is-err');
      askMsg('이 번호로 작성한 후기가 없습니다.'); $('#ask-phone').focus(); return;
    }
    $('#askSend').textContent='재전송';
    $('#ask-code').disabled=false; $('#askCodeWrap').removeAttribute('data-disabled');
    $('#askTimer').hidden=false; $('#ask-code').value=''; $('#ask-code').focus();
    askMsg('인증번호를 보냈습니다.', true);
    askLeft=SEC; if(askTimer) clearInterval(askTimer); askTick(); askTimer=setInterval(askTick,1000);
  });
  $('#fullGo').addEventListener('click',function(){
    var d=onlyNum($('#ask-phone').value), v=onlyNum($('#ask-code').value);
    if(d.length!==11){
      $('#ask-phone').closest('.f-in').classList.add('is-err');
      askMsg('핸드폰 번호를 입력하고 인증을 눌러 주세요.'); return;
    }
    if(v.length!==6 || v==='000000'){
      $('#askCodeWrap').classList.add('is-err');
      askMsg('인증번호가 올바르지 않습니다.', false, 'code'); return;
    }
    /* 여기까지 오는 건 문자를 보낸 뒤 번호를 고친 경우뿐이다 — 인증을 누를 때 이미 걸렀다 */
    if(!ownerOf(d)){
      $('#ask-phone').closest('.f-in').classList.add('is-err');
      askMsg('이 번호로 작성한 후기가 없습니다.'); return;
    }
    /* 작성 화면이 같은 번호를 두 번 받지 않도록 확인한 번호를 건넨다 */
    try{ sessionStorage.setItem('kbz_pre', d); }catch(e){}
    closeFull(); go();
  });
  $('#fullCancel').addEventListener('click', closeFull);
  $('#fullDim').addEventListener('click', closeFull);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && !fullModal.hidden) closeFull();
  });
})();
</script>
</body>
</html>
