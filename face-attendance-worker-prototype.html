<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 근로자 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 근로자 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 근로자 앱(kpmUser) 화면을 시나리오별로 모아 본다. 현장소장 앱은 face-attendance-app-prototype.html 에 따로 있다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
/* 설명(data-why)은 말하려는 것마다 줄을 바꿔 적는다. 크롬은 그 값을 한
   문단으로 내므로 줄바꿈이 살아 있게 한다 — 한 덩어리로 이어 붙으면 어디서
   다음 이야기가 시작되는지 읽는 사람이 찾아야 한다.
   다만 빈 줄은 한 줄 높이를 통째로 가져가 사이가 너무 벌어진다. 아래
   스크립트가 빈 줄을 걷어내고 문단마다 블록으로 끊으므로 사이는 여기서
   잡는다 — 스크립트가 못 돌아도 pre-line 이 받쳐 준다 */
.proto-brief__why{white-space:pre-line}
.proto-brief__wp{display:block}
.proto-brief__wp + .proto-brief__wp{margin-top:var(--space-8)}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-worker.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="근로자 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

                  <span class="proto-nav-group-label">근로자 앱 · 홈</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">당일 퇴근</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-early"
        data-why="현장 출근 가능 시각 전 화면입니다."
        data-steps="출근 가능 시각보다 이른 때에 홈을 연 상태"
        data-look="
          |@{.act__b--lock} 출근 버튼이 잠겨 있으며 disabled 상태로 노출됩니다.
          |@{.tip} 툴팁으로 출근 가능 시간을 보여줍니다. 해당 툴팁은 닫을 수 없습니다.
          ">출근 가능 시각 전</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home"
        data-why="출근 가능 시간에 노출되는 화면입니다."
        data-steps="근로자 앱을 열고 출근하지 않은 근로자가 오늘 날짜를 보고 있는 상태"
        data-look="
          |@sm @md @lg @{.cal__week} 일자 리스트는 브라우저 넓이에 따라 확장되어 보여집니다. 스와이프로 자리를 이동할 수 있습니다.
          |@{.cal__date} 연, 월을 선택하면 날짜고르기 바텀시트가 열립니다.
          |@{.cal__week .cal__n--on} 날짜를 클릭하면 그날의 홈으로 이동합니다.
          |@{.tcard__v--none} 아직 찍히지 않은 시각은 '--:--' 로 표시됩니다
          |@{.cta__time} 현재 시간을 실시간으로 보여줍니다.
          |@{.cta__need} 일반 출퇴근이 아닌 인증의 경우 하단에 뱃지로 인증 스타일을 표기합니다.
          |@{.row--zone} '출퇴근 범위 확인하기' 를 클릭하면 출퇴근 범위 지도가 바텀시트로 열립니다.
          |@{.go__card} '출근하기' 버튼을 클릭하면 얼굴 등록 안내로 이동합니다. 이름 옆의 화살표는 일정 간격으로 움직이는 애니메이션이 작동합니다">출근 전</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-done"
        data-why="출근 완료된 상태의 출퇴근 홈 화면입니다."
        data-steps="얼굴 인증으로 출근이 기록되어 홈으로 돌아온 상태"
        data-look="
          |@{.bd--positive} 출근 카드 아래에 어떤 기기와 방법으로 인증을 거쳤는지 뱃지에 표기됩니다.
          |@{.cal__n--open} 출근만 찍히고 퇴근이 없을 때는 일자 아래에 경고색 점이 생깁니다.
          |@{.cardb} '작업내용 작성하기' 를 클릭하면 작업내용 작성 화면으로 갑니다. 오른쪽 끝의 화살표가 일정 간격으로 한 번씩 움직입니다.
          |@{.act__b--lock} '퇴근하기' 는 잠겨 있어 클릭되지 않고, 이름 옆의 화살표가 자물쇠로 바뀝니다.
          |@{.tip} 툴팁을 활용해 퇴근하기 버튼을 활성화시키기 위한 안내를 보여줍니다. 사용에 익숙한 사용자는 닫기버튼으로 안내를 거부할 수 있습니다.">출근 완료</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-work"
        data-why="작업내용까지 작성한 상태입니다.

이제 퇴근을 찍을 수 있습니다."
        data-steps="작업내용을 저장하고 홈으로 돌아온 상태"
        data-look="
          |@{.wnote__e} '수정' 을 클릭하면 작업내용 작성 화면으로 돌아갑니다
          |@{.go__card} '퇴근하기' 버튼이 활성화되고, 이름 옆이 자물쇠 아이콘에서 화살표로 바뀝니다.">작업내용 작성 완료</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-out"
        data-why="퇴근까지 인증 완료된 화면입니다."
        data-steps="퇴근 인증까지 끝나 홈으로 돌아온 상태"
        data-look="
          |@{.tcards} 출근과 퇴근 모두 시각 아래에 인증 경로가 함께 표시됩니다
          |@{.cardb--quiet} 퇴근 시간 변경이 필요할 때는 관리자에게 변경 사유를 보낼 수 있습니다">퇴근 완료</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">익일 퇴근</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-over-today"
        data-why="야간근무 근로자의 퇴근이 익일이라 다음날 일자를 클릭해 들어온 화면입니다"
        data-steps="이전 날 22:00에 출근하고 퇴근을 찍지 않은 채 날짜가 바뀌어, 그 다음 날 홈을 연 상태"
        data-look="
          |@{.cardb--warn} 버튼에는 끝내지 못한 근무의 날짜가 적힙니다. 날짜는 화면을 연 날을 기준으로 다시 계산됩니다.
          |@{.act__b--lock} 출근 버튼은 잠겨 있고, 이름 옆의 화살표가 자물쇠 아이콘으로 바뀝니다
          |@{.tip} 툴팁에는 선택한 날의 출근 버튼이 잠긴 사유를 안내하며, 사용에 익숙한 사용자는 닫기버튼으로 안내를 거부할 수 있습니다.">이전 근무 퇴근 전</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-over"
        data-why="익일 퇴근이 발생할 때 화면입니다.

출퇴근 한 건은 출근한 날에 기록되므로, 날짜가 바뀐 뒤에 찍은 퇴근도 이 날의 기록이 됩니다."
        data-steps="22:00에 출근해 작업내용까지 쓰고 퇴근을 찍지 않은 채 날짜가 바뀌어, 다음 날 홈의 알림을 클릭해 그 날짜로 돌아온 상태"
        data-look="
          |@{.cal__n--open} 캘린더의 선택한 날짜 아래에 점이 경고색입니다. 출근만 찍히고 퇴근이 아직 없다는 뜻입니다
          |@{.pill--today} 오늘이 아닌 날짜를 선택해 &#39;오늘&#39;이 켜져 있습니다. 클릭하면 오늘 날짜로 이동합니다">퇴근 전</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-over-out"
        data-why="출근과 퇴근이 다른 날일 때 화면입니다.

익일 퇴근인 경우 출근일 기준 날짜에 퇴근 시각이 함께 표기됩니다."
        data-steps="22:00에 출근해 다음 날 06:10에 퇴근한 날짜를 열어 본 상태"
        data-look="
          |@{.tcards .tcard:last-child .tcard__k} 퇴근 카드의 이름이 &#39;익일 퇴근&#39;으로 표기됩니다.">퇴근 완료</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">날짜 옮기기</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-cal"
        data-why="상단의 연,월 입력폼을 클릭했을 때 나오는 화면입니다."
        data-steps="홈에서 날짜 영역을 클릭해 월 달력을 펼친 상태"
        data-look="
          |@{.calm__g} 스와이프하여 달을 이동할 수 있습니다. 선택된 일자는 그대로 반영됩니다. 만일 이동한 달에 없는 날짜가 선택되었을 경우(ex.28일,31일) 마지막 날이, 아직 오지 않은 날짜면 오늘이 선택됩니다. 미래 날짜는 비활성화 상태입니다. 
          |@{.cal__more--up} 펼친 동안에는 쉐브론 위를 향합니다. 클릭하면 이전 하면으로 돌아갑니다.
          |@{.calm__g .cal__n--off} 흐리게 표시된 날짜는 클릭할 수 없습니다. 이번 달이 아닌 날짜와 오늘 이후 날짜입니다
          |@{.calm .cal__n--on} 채워진 원이 선택한 날짜이고, 오늘이 아닌 날짜를 고르면 오늘 자리에 점선 테두리가 생깁니다. 날짜를 클릭하면 그날의 홈으로 이동하며, 기록이 있는 날짜는 숫자 아래에 점이 표시됩니다.
          |@{.wheel} 휠은 연·월까지만 고릅니다. 멈춘 값으로 달력이 바뀌며 월 달력은 펼친 상태로 남습니다. 오늘 이후의 연·월은 휠에 표기되지 않습니다.
          |@{.dim--cal} dim 영역을 클릭하면 닫힙니다. 화살표로 닫을 때와 마찬가지로 보고 있던 날짜는 유지됩니다">날짜 고르기</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-past"
        data-why="지난 날짜의 기록을 확인하는 화면입니다.

지난 날짜에는 인증할 것이 없습니다. 오늘로 돌아가는 '오늘' 버튼과 '퇴근 시간 변경 요청' 버튼만 둡니다."
        data-steps="주간 달력에서 지난 날짜를 클릭한 상태"
        data-look="
          |@{.pill--today} '오늘' 이 흰 면에 짙은 글자로 켜집니다. 클릭하면 오늘 날짜로 이동합니다. 오늘을 선택한 화면에서는 disabled 상태가 됩니다
          |@{.cardb--quiet} 지난 날짜에서 할 수 있는 것은 '퇴근 시간 변경 요청' 뿐입니다">지난 날 보기</button>
      <span class="proto-nav-group-label">근로자 앱 · 얼굴 등록</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-face"
        data-why="얼굴 인증을 쓰는 현장인데 이 현장에 등록된 얼굴이 없는 경우입니다.

등록을 마쳐야 출근을 찍을 수 있어, 출근 대신 등록으로 넘깁니다."
        data-steps="현장에 얼굴이 미등록된 상태에서 '출근하기' 를 클릭한 상태"
        data-look="
          |@{.scan--alert} 얼굴을 스캔하는 그림이 움직입니다 — 움직임을 줄인 기기에서는 재생되지 않습니다
          |@{.scan__go} '얼굴 등록하고 출근하기' 를 클릭하면 바텀시트가 내려가지 않고 바로 동의 화면으로 넘어갑니다. 내려가는 몸짓은 취소하고 나간다는 뜻이라 닫기(✕)와 어두운 영역에만 씁니다
          |@{.dim} 어두운 영역이나 닫기(✕)를 클릭하면 홈으로 돌아갑니다">안내</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-reg"
        data-why="얼굴은 민감정보라 촬영 전에 동의를 받는 단계입니다.

등록한 얼굴은 그 현장의 출퇴근 확인에만 쓰기 때문에 동의도 현장마다 한 번씩 받습니다."
        data-steps="얼굴 등록 안내에서 '얼굴 등록하고 출근하기' 를 클릭한 상태"
        data-look="
          |@{.card--agree} '전체 동의' 를 선택하면 아래 두 항목이 함께 선택됩니다
          |@{.agr[aria-controls]} [필수] 항목을 클릭하면 약관 본문이 그 줄 아래로 펼쳐지고, 꺾쇠가 뒤집힙니다. 다시 클릭하면 접힙니다
          |@{.bnr} 등록한 얼굴을 어디에 쓰는지, 동의하지 않으면 어떻게 되는지를 적습니다
          |@{.act__b--on} '동의하고 촬영하기' 를 클릭하면 얼굴 등록 온보딩으로 이동합니다">동의</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-ready"
        data-why="맨 처음 얼굴을 등록할 때만 지나는 화면입니다. 마스크를 쓴 채 찍으면 그 사진이 그대로 남아, 그 뒤로 출근할 때마다 얼굴 인증이 실패합니다.

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-worker.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* 설명(why)의 문단 사이를 좁힌다. 크롬은 why 를 한 <p> 로 내고 pre-line 이
     빈 줄을 그대로 살리는데, 빈 줄은 한 줄 높이(21px)를 통째로 가져간다.
     빈 줄을 걷어내고 문단마다 블록으로 끊어, 사이를 CSS 로 잡게 한다.
     크롬이 시나리오를 옮길 때마다 다시 그리므로 그려진 뒤에 집는다 */
  function splitWhy() {
    var p = document.querySelector('.proto-brief__why:not([data-wp])');
    if (!p) return;
    p.setAttribute('data-wp', '');   /* 먼저 표시한다 — 아래 조작이 감시기를 다시 부른다 */
    var parts = p.textContent.split(/\n{2,}/);
    if (parts.length < 2) return;
    p.textContent = '';
    for (var i = 0; i < parts.length; i++) {
      var s = document.createElement('span');
      s.className = 'proto-brief__wp';
      s.textContent = parts[i];
      p.appendChild(s);
    }
  }
  new MutationObserver(splitWhy).observe(document.body, { childList: true, subtree: true });

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
  splitWhy();
</script>
