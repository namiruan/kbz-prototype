<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 근로자 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 근로자 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 근로자 앱(kpmUser) 화면을 시나리오별로 모아 본다. 현장소장 앱은 face-attendance-app-prototype.html 에 따로 있다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
/* 설명(data-why)은 말하려는 것마다 줄을 바꿔 적는다. 크롬은 그 값을 한
   문단으로 내므로 줄바꿈이 살아 있게 한다 — 한 덩어리로 이어 붙으면 어디서
   다음 이야기가 시작되는지 읽는 사람이 찾아야 한다 */
.proto-brief__why{white-space:pre-line}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-worker.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="근로자 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

            <span class="proto-nav-group-label">근로자 앱 · 홈</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home"
        data-why="근로자가 이 앱에서 할 일은 출근 인증 하나라, 화면 아래 버튼도 하나만 뒀습니다.

카드는 날짜가 바뀌어도 그대로인 정보(현장 이름, 인정범위)와 그날의 기록(출근, 퇴근)으로 나눴습니다.

출근과 퇴근은 좌우로 나란히 넣어 아직 찍지 않은 쪽이 한눈에 보이게 했습니다.

기준 시각(07:00부터, 17:00까지)은 찍힌 시각 바로 옆에 적어, 지각 여부를 같은 자리에서 확인하게 했습니다."
        data-steps="근로자 앱을 열고 오늘 날짜를 보고 있는 상태 — 아직 출근 인증을 하지 않았습니다. 날짜는 기기의 날짜를 따릅니다"
        data-look="@sm @md @{.cal__week} 주간 달력에는 한 달치 날짜가 들어 있습니다. 모바일에서는 한 주만 보이고 좌우로 스와이프하면 다른 주가 나옵니다(화면이 넓으면 한 달이 모두 보여 스와이프할 것이 없습니다). 스와이프는 주 단위로 멈춰서 요일 위치가 흐트러지지 않습니다. 날짜를 클릭하면 그날의 홈으로 이동하고 헤더의 날짜도 함께 바뀝니다. 오늘 이후 날짜는 흐리게 표시되고 클릭되지 않습니다|@{.tcard__v--none} 아직 찍히지 않은 시각은 빈칸이 아니라 '--:--' 로 표시됩니다|@{.cta__now} 버튼 위의 시각은 기기 시계를 그대로 받아 1초마다 바뀝니다|@{.cta__need} 얼굴 인증을 쓰는 현장이면 시각 옆에 '얼굴 인식' 이 함께 표시됩니다. 버튼을 누르면 카메라가 열린다는 것을 미리 알려 줍니다|@{.row--zone} 클릭하면 인정범위 지도가 열립니다|@{.act__b--on} 클릭하면 얼굴 등록 안내로 이동합니다|@{.act__go} 버튼 오른쪽 끝의 화살표가 일정 간격으로 한 번씩 움직입니다">홈 — 출근 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-cal"
        data-why="날짜 변경은 주간 달력이 있던 자리에서 합니다.

헤더(날짜, '오늘', 알림)는 그대로 두고 그 아래 한 줄만 월 달력으로 펼쳐, 보고 있던 위치가 유지되게 했습니다.

주간 달력과 월 달력은 같은 칸을 같은 순서로 써서 요일 위치도 바뀌지 않습니다."
        data-steps="홈에서 날짜 영역을 클릭해 월 달력을 펼친 상태"
        data-look="@{.calm} 달력을 좌우로 스와이프하면 이전·다음 달로 이동합니다. 선택한 날짜는 그대로 따라가고(해당 월에 없는 날짜면 그 달의 마지막 날로 조정됩니다), 오늘이 속한 달보다 뒤로는 이동하지 않습니다|@{.cal__more--up} 펼친 동안에는 화살표가 위를 향합니다. 클릭하면 주간 달력으로 돌아갑니다|@{.cal__n--off} 흐리게 표시된 날짜는 클릭되지 않습니다. 이번 달이 아닌 날짜와 오늘 이후 날짜입니다|@{.calm .cal__n--on} 날짜를 클릭하면 그날의 홈으로 이동합니다. 기록이 있는 날짜는 숫자 아래에 점이 표시됩니다|@{.wheel} 년·월·일 휠은 각각 따로 스크롤되고, 손을 떼면 가운데 영역에 맞춰 멈춥니다. 멈춘 값으로 달력이 바뀌며 월 달력은 펼친 상태로 남습니다. 오늘 이후의 연·월·일은 휠에 나오지 않습니다|@{.dim--cal} 어두운 영역을 클릭하면 닫힙니다. 화살표로 닫을 때와 마찬가지로 보고 있던 날짜는 유지됩니다">홈 — 날짜 고르기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-done"
        data-why="퇴근 인증은 작업내용을 작성한 뒤에만 할 수 있어서, 작성 전에는 퇴근 버튼을 비활성으로 두고 버튼 아래에 무엇을 먼저 해야 하는지 적었습니다.

출근 시각 옆에는 인증 수단을 함께 적습니다. 같은 날 기록이 앱, 단말기, 현장소장 앱 등 여러 경로로 들어오기 때문입니다."
        data-steps="얼굴 인증으로 출근이 기록되어 홈으로 돌아온 상태 — 작업내용은 아직 작성하지 않았습니다"
        data-look="@{.bd--positive} 출근 시각 옆의 '앱 · 얼굴' 은 그 기록이 어느 경로로 들어왔는지 보여 줍니다|@{.cal__n--open} 주간 달력의 오늘 아래 점이 경고색입니다. 출근만 찍히고 퇴근이 아직 없는 날이라는 뜻이며, 하루가 끝난 날(파란 점)과 구분됩니다|@{.cardb} 이 화면에서 클릭할 수 있는 것은 '작업내용 작성하기' 하나입니다. 클릭하면 작업내용 작성 화면으로 이동합니다|@{.cardb__c} 오른쪽 끝의 화살표가 일정 간격으로 한 번씩 움직입니다|@{.act__b--lock} 퇴근 버튼은 비활성이라 클릭되지 않고, 오른쪽 끝에 화살표 대신 자물쇠 아이콘이 들어갑니다|@{.cta__why} '퇴근 인증하기' 아래에 '작업내용 작성 후 퇴근이 가능해요' 가 표시됩니다">홈 — 출근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-work"
        data-why="작업내용을 작성하면 퇴근 버튼이 활성화됩니다.

작성한 내용은 그날 찍힌 시각 다음 순서라 출퇴근 카드 바로 아래에 붙입니다.

내용은 줄여서 보여 줍니다. 여기서 할 일은 다시 읽는 것이 아니라 작성했는지 확인하는 것입니다."
        data-steps="작업내용을 저장하고 홈으로 돌아온 상태"
        data-look="@{.card--note} 작성한 내용은 두 줄까지 보이고 나머지는 말줄임으로 처리됩니다|@{.wnote__e} '수정' 을 클릭하면 작업내용 작성 화면으로 돌아갑니다|@{.act__b--dark} 퇴근 버튼이 활성화되고, 오른쪽 끝이 자물쇠 아이콘에서 화살표로 바뀝니다">홈 — 작업내용 작성 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-out"
        data-why="출근과 퇴근이 모두 기록되면 인증할 것이 없어, 그 자리에 '퇴근시간 변경' 을 넣었습니다. 기록된 시각을 고칠 수 있는 곳이 여기뿐이기 때문입니다.

지금 해야 할 일은 아니라서 버튼이 아닌 한 줄짜리 카드로 뒀습니다."
        data-steps="퇴근 인증까지 끝나 홈으로 돌아온 상태"
        data-look="@{.tcards} 출근과 퇴근 모두 시각 아래에 인증 경로가 함께 표시됩니다|@{.cardb--quiet} 아래쪽의 '퇴근시간 변경' 은 화살표가 움직이지 않습니다. 지금 하라고 권하는 기능이 아니기 때문입니다">홈 — 퇴근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-past"
        data-why="'오늘' 버튼은 오늘로 돌아가는 기능이라 다른 날짜를 보고 있을 때만 활성화됩니다.

활성화돼도 회색 배경이라, 현장을 바꾸는 '현장선택' 보다 뒤로 물러섭니다.

지난 날짜는 인증할 것이 없어 출근·퇴근 버튼 대신 수정 기능만 둡니다."
        data-steps="주간 달력에서 어제를 클릭한 상태"
        data-look="@{.pill--today} '오늘' 이 활성화됩니다. 클릭하면 오늘 날짜로 돌아갑니다. 오늘을 보고 있는 화면에서는 같은 배경에 글자만 흐려집니다|@{.cal__n--today} 오늘은 점선 테두리로 표시되고, 채워진 원은 지금 선택한 날짜입니다|@{.cardb--quiet} 지난 날짜에서 할 수 있는 것은 '퇴근시간 변경' 뿐입니다">홈 — 지난 날 보기</button>
      <span class="proto-nav-group-label">근로자 앱 · 얼굴 등록</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-face"
        data-why="얼굴 인증을 쓰는 현장인데 등록된 얼굴이 없으면 출근 인증을 할 수 없습니다.

이때는 안내와 함께 등록 화면으로 바로 연결합니다. 근로자가 그 자리에서 할 수 있는 일이 등록밖에 없기 때문입니다."
        data-steps="홈에서 '출근 인증하기' 를 클릭한 상태 — 이 현장에 등록된 얼굴이 없습니다"
        data-look="@{.scan--alert} 얼굴을 스캔하는 일러스트가 반복 재생됩니다. 스캔 선이 위에서 아래로 지나가고 파장이 퍼집니다|@{.scan__go} '얼굴 등록하고 출근하기' 를 클릭하면 시트가 내려가는 애니메이션 없이 바로 얼굴 등록 동의 화면으로 이동합니다. 내려가는 애니메이션은 '취소하고 나간다' 는 뜻이라 닫기(✕)와 어두운 영역에만 씁니다|@{.dim} 어두운 영역이나 닫기(✕)를 클릭하면 홈으로 돌아갑니다">얼굴 등록 안내</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-reg"
        data-why="얼굴은 민감정보라 촬영 전에 동의를 받습니다. 찍은 뒤에 물으면 이미 찍힌 사진을 앞에 두게 되어 사실상 거절하기 어렵습니다.

등록한 얼굴은 그 현장의 출퇴근 확인에만 쓰므로 동의도 현장마다 한 번씩 받고, 어느 현장에 대한 동의인지를 화면 맨 위에 적습니다."
        data-steps="얼굴 등록 안내에서 '얼굴 등록하고 출근하기' 를 클릭한 상태"
        data-look="@{.card--agree} '전체 동의' 를 선택하면 아래 두 항목이 함께 선택됩니다. 각 항목 오른쪽 화살표는 약관 본문으로 들어가는 링크입니다|@{.bnr} 안내 문구는 디자인 시스템의 Banner 컴포넌트입니다. 조건이 해소될 때까지 화면에 남는 인라인 메시지입니다|@{.act__b--on} '동의하고 촬영하기' 를 클릭하면 촬영 확인 화면으로 이동합니다">얼굴 등록 — 동의</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-shot"
        data-why="촬영한 사진을 한 번 보여 주고 등록할지 확인받습니다.

기본 동작인 '등록하고 출근 인증하기' 가 먼저 읽히도록, 다시 찍는 버튼은 카드 밖에 배경 없이 뒀습니다."
        data-steps="'동의하고 촬영하기' 를 클릭해 얼굴을 촬영한 상태"
        data-look="@{.confirm__ok} 버튼 이름이 두 가지 동작을 함께 알립니다 — '등록하고 출근 인증하기'. 클릭하면 등록이 끝나고 바로 출근 인증 카메라가 열립니다|@{.confirm__re} '다시 촬영하기' 를 클릭하면 카메라로 돌아갑니다">얼굴 등록 — 촬영 확인</button>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-worker.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
