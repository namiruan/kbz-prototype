<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 근로자 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 근로자 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 근로자 앱(kpmUser) 화면을 시나리오별로 모아 본다. 현장소장 앱은 face-attendance-app-prototype.html 에 따로 있다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-worker.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="근로자 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

            <span class="proto-nav-group-label">근로자 앱 · 홈</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home"
        data-why="근로자 앱의 첫 화면입니다. 할 일은 하나뿐이라 과녁도 하나입니다 — 근로자는 '출근 인증하기' 를 클릭하고, 그 현장이 안면인식 현장이면 카메라가 뒤이어 열립니다. 어느 현장인지는 과녁 위의 '얼굴 인식' 이 미리 알립니다. 카드는 둘로 갈립니다 — 가르는 것은 '바뀌는가' 입니다. 위 카드는 현장 이름과 인정범위, 곧 날이 바뀌어도 그대로인 것을 쥡니다. 인정범위가 현장 이름과 한 카드에 드는 것은 둘이 같은 것을 말하기 때문입니다: 어느 현장이고, 그 현장은 어디까지를 출퇴근으로 쳐 주는가. 아래는 오늘 것입니다 — 출근과 퇴근이 좌우로 나란히 선 두 카드입니다. 따로 선 기록이라 각각 제 시각과 제 경로를 갖고, 나란히 세우면 아직 안 찍힌 쪽이 한눈에 보입니다. 기준 시각은 각 카드 안, 이름 바로 옆에 듭니다 — 출근은 '07:00부터', 퇴근은 '17:00까지' 입니다. 찍힌 시각과 한 덩어리로 묶여야 늦었는지가 그 자리에서 가려지고, 수는 짙고 굵게 '부터'·'까지' 는 옅게 두어 읽을 것이 수임을 가릅니다."
        data-steps="근로자 앱을 열고 오늘(2026.10.20)을 보는 상태 — 아직 출근하지 않았습니다"
        data-look="@sm @md @{.cal__week} 날짜 띠에는 지난 주까지 들어 있습니다 — 폰에서는 일곱 날만 보이고 **옆으로 밀면** 지난 날이 나옵니다(열네 날이 다 들어가는 넓은 폭에서는 밀 것이 없습니다). 띠는 늘 오늘이 든 주가 보이는 자리에서 시작합니다. 날짜를 클릭하면 그날의 홈으로 갑니다 — 19일은 퇴근까지 찍힌 날, 20일은 출근만 찍힌 날, 나머지는 아직 찍히지 않은 날입니다|@{.tcard__v--none} 아직 찍히지 않은 시각은 '--:--' 입니다 — 빈칸으로 두면 값이 없는 것인지 아직인 것인지 가릴 수 없습니다|@{.cta__now} 과녁 위의 시각은 **기기의 시계**라 1초마다 바뀝니다 — 멈춘 수가 박혀 있으면 화면이 죽은 것으로 보입니다. 수의 폭이 고른 꼴이라 바뀌어도 알약이 흔들리지 않습니다|@{.cta__need} 얼굴로 찍는 현장이면 '얼굴 인식' 이 시각 옆에 섭니다 — 누르면 카메라가 열린다는 것을 누르기 전에 알립니다|@{.row--zone} 클릭하면 인정범위 지도 창이 열립니다|@{.act__b--on} 출근 과녁은 현장소장 앱의 인증 시작 과녁과 같은 꼴입니다 — 바닥에 떠 있는 카드라 아래 내비게이션을 가리지 않습니다. 클릭하면 얼굴 등록 안내로 넘어갑니다|@{.act__go} 오른쪽 끝의 표는 한 바퀴에 한 번 앞으로 밀립니다. 그 과녁의 것과 같은 움직임입니다|@{.tabbar} 아래 내비게이션은 주화면에만 있습니다. 뒤로 가기가 있는 현장소장 앱 화면에는 없습니다">홈 — 출근 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-done"
        data-why="출근이 끝난 뒤의 홈입니다. 퇴근은 작업내용을 쓴 뒤에야 찍을 수 있어 과녁을 꺼 둡니다 — 쓰기 전에도 눌리게 두면 퇴근을 클릭한 다음에야 막히고, 그 자리에서는 무엇을 더 해야 하는지가 거절 한마디로만 돌아옵니다. 출근시간 옆에 어느 길로 찍혔는지를 함께 적는 것은, 같은 날 기록이 앱·단말기·현장소장 앱으로 섞여 들어오기 때문입니다."
        data-steps="얼굴 인증으로 출근 처리가 끝나 홈으로 돌아온 상태 — 작업내용은 아직 쓰지 않았습니다"
        data-look="@{.bd--positive} 출근 이름 옆의 '앱 · 얼굴' 이 그 기록이 어느 길로 들어왔는지 적습니다|@{.cal__n--open} 띠의 오늘 아래 점이 **경고색**입니다 — 출근만 찍히고 퇴근이 아직 없는 날입니다. 기록이 있다는 것만으로는 하루가 닫혔는지 알 수 없어, 어제(파란 점)와 가릅니다|@{.tcard__v--none} 아직 찍히지 않은 카드는 면이 비치고 그림자가 없습니다 — 찍힌 카드만 흰 면으로 떠 있고, 연한 브랜드 테가 한 겹 더 둘립니다|@{.cardb} 지금 클릭할 수 있는 것은 '작업내용 작성하기' 하나뿐입니다 — 목록 안이 아니라 과녁 바로 위에 뜨고, 클릭하면 작업내용 작성으로 갑니다|@{.cardb__c} 오른쪽 끝의 꺾쇠는 한 바퀴에 한 번 앞으로 밀립니다 — 이 화면에서 움직이는 표는 이것뿐입니다|@{.act__b--lock} 퇴근 과녁은 꺼져 있습니다 — 옅은 회색 면이고 클릭되지 않습니다. 오른쪽 끝은 꺾쇠가 아니라 자물쇠입니다|@{.cta__why} '퇴근 인증하기' 아래에 '작업내용 작성 후 퇴근이 가능해요' 가 한 줄 붙습니다|@{.act__b--lock} 꺼진 과녁은 아랫단이 바닥 내비게이션에 덮여 끝이 보이지 않습니다">홈 — 출근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-work"
        data-why="작업내용을 쓰고 돌아온 홈입니다. 여기서야 퇴근 과녁이 켜집니다 — 앞 화면에서 막아 두었던 조건이 풀린 자리라, 두 장을 나란히 보면 무엇이 그 조건이었는지가 드러납니다. 쓴 것을 출퇴근 카드 바로 아래에 붙이는 것은 오늘 한 일이 오늘 찍힌 시각 다음에 오는 순서이기 때문입니다. 글을 줄여 적는 것은 여기서 할 일이 다시 읽는 것이 아니라 썼다는 것을 확인하는 일이어서입니다 — 다 보려면 고치러 들어갑니다."
        data-steps="작업내용을 저장하고 홈으로 돌아온 상태"
        data-look="@{.card--note} 써 둔 작업내용이 출퇴근 카드 바로 아래에 붙습니다. 글은 두 줄까지 보이고 그 뒤는 말줄임이며, 붙인 사진은 쓰기 화면보다 작게 놓입니다|@{.wnote__e} 고치러 가는 길은 머리줄 오른쪽 끝의 '수정' 입니다 — 면도 테도 없는 글자 버튼이고, 클릭하면 작업내용 작성으로 돌아갑니다|@{.act__b--dark} 퇴근 과녁이 켜집니다. 검정 면은 출근 전의 파랑과 짝이고, 오른쪽 끝은 자물쇠가 아니라 꺾쇠입니다">홈 — 작업내용 작성 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-out"
        data-why="하루가 닫힌 홈입니다. 출근과 퇴근이 모두 찍혀 과녁이 할 일을 잃습니다 — 그 자리를 비워 두지 않고 고치는 길을 둡니다. 찍힌 시각이 틀렸을 때 갈 데가 여기뿐이기 때문입니다. 꼴은 과녁이 아니라 한 줄짜리 카드입니다: 오늘 해야 할 일이 아니라 필요하면 가는 길이라 색도 한 발 물러섭니다."
        data-steps="퇴근 인증까지 끝나 홈으로 돌아온 상태"
        data-look="@{.tcards} 출근과 퇴근이 모두 찍히고, 각각 어느 길로 들어왔는지가 시각 아래에 함께 적힙니다|@{.cardb--quiet} 바닥에는 '퇴근시간 변경' 이 섭니다 — 흰 면에 브랜드 글이고, 꺾쇠도 앞으로 밀지 않습니다">홈 — 퇴근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-past"
        data-why="띠에서 어제를 눌러 본 홈입니다. '오늘' 은 **되돌아가는 길**이라 오늘을 보는 동안에는 갈 데가 없어 꺼 두고, 다른 날을 보는 이 화면에서만 켭니다. 켜져도 꼴은 면색 알약입니다 — 브랜드 테를 두르면 같은 화면의 '현장선택' 과 무게가 같아지는데, 날짜를 옮겨 본 사람에게만 필요한 길이 현장을 바꾸는 길만큼 눈에 들어올 까닭이 없습니다. 지난 날이라 출근·퇴근 과녁은 없고, 고치는 길만 남습니다."
        data-steps="띠에서 19일을 클릭한 상태"
        data-look="@{.pill--today} '오늘' 이 켜집니다 — 회색 면에 짙은 글자이고, 클릭하면 오늘로 돌아갑니다. 오늘을 보는 다른 화면에서는 같은 면에 글자만 흐려집니다|@{.cal__n--today} 오늘(20)은 점선 테를 두른 브랜드 색 숫자입니다 — 채운 동그라미는 지금 고른 날(19)의 것입니다|@{.cardb--quiet} 지난 날에 할 수 있는 것은 '퇴근시간 변경' 뿐입니다">홈 — 지난 날 보기</button>
      <span class="proto-nav-group-label">근로자 앱 · 얼굴 등록</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-face"
        data-why="안면인식이 켜진 현장인데 이 현장에 등록된 얼굴이 없으면 출근이 바로 되지 않습니다. 막는 말로 끝내지 않고 등록으로 데려가는 것은, 근로자가 그 자리에서 할 수 있는 일이 등록뿐이기 때문입니다."
        data-steps="출근을 클릭한 상태 — 이 현장에 등록된 얼굴이 없습니다"
        data-look="@{.scan--alert} 얼굴을 훑는 그림이 창 안에서 돕니다 — 레이저가 위에서 아래로 한 번 훑고, 파장이 셋 떠납니다. 현장소장 앱의 '얼굴 등록하기' 자리에 서는 것과 같은 그림입니다|@{.alert--sheet} 바닥에서 올라오는 시트입니다 — 열릴 때 아래에서 밀려 올라오고, 뒤의 막도 같이 짙어집니다|@{.scan__go} 그림이 시트를 채우고 그 위에 채운 버튼이 섭니다 — 등록 촬영 확인의 과녁과 같은 치수입니다(22/28 · 키 56). 클릭하면 얼굴 등록 동의로 가는데, 시트가 내려가는 몸짓 없이 **곧바로** 넘어갑니다 — 내려가는 그림은 '여기서 나간다' 는 말이라 닫기(✕)와 뒤의 어두운 자리 몫입니다|@{.sheet__x} 되돌리는 길은 오른쪽 위의 닫기 하나입니다 — 시트가 권하는 일이 하나뿐이라 되돌리는 버튼을 따로 두지 않습니다|@{.dim} 뒤 화면은 어두워집니다. 어두운 자리나 닫기(✕)를 클릭하면 홈으로 돌아갑니다">얼굴 등록 안내</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-reg"
        data-why="얼굴은 민감정보라 **찍기 전에** 동의를 받습니다. 찍고 나서 묻는 것은 묻는 것이 아닙니다 — 이미 찍힌 사진을 앞에 두고 '아니요' 를 고르기는 어렵습니다. 동의는 현장마다 한 번입니다: 등록한 얼굴이 그 현장의 출퇴근 확인에만 쓰이기 때문에, 현장이 바뀌면 쓰는 곳도 바뀝니다. 그래서 어느 현장의 동의인지를 맨 위에 적습니다."
        data-steps="얼굴 등록 안내에서 '얼굴 등록하고 출근하기' 를 클릭한 상태"

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-worker.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
