<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 근로자 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 근로자 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 근로자 앱(kpmUser) 화면을 시나리오별로 모아 본다. 현장소장 앱은 face-attendance-app-prototype.html 에 따로 있다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-worker.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="근로자 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

            <span class="proto-nav-group-label">근로자 앱 · 홈</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home"
        data-why="할 일이 하나뿐이라 과녁도 하나입니다. 카드는 '바뀌는가' 로 가릅니다 — 위 카드는 날이 바뀌어도 그대로인 것(현장 이름 · 인정범위)을, 아래 두 카드는 오늘 것(출근 · 퇴근)을 쥡니다. 출근과 퇴근을 좌우로 나누면 아직 안 찍힌 쪽이 한눈에 들어오고, 기준 시각('07:00부터' · '17:00까지')을 각 카드 안에 두면 늦었는지가 그 자리에서 가려집니다."
        data-steps="근로자 앱을 열고 오늘을 보는 상태 — 아직 출근하지 않았습니다. 날짜는 기기에 묻습니다"
        data-look="@sm @md @{.cal__week} 날짜 띠에는 한 달이 들어 있습니다 — 폰에서는 한 주가 꽉 차고 옆으로 밀면 다른 주가 나옵니다(한 달이 다 들어가는 넓은 폭에서는 밀 것이 없습니다). 미는 것은 주 단위로 멎어 요일 자리가 바뀌지 않습니다. 날짜를 클릭하면 그날의 홈으로 가고 머리줄의 날짜도 그 날로 바뀌며, 오늘보다 뒤인 날은 흐리고 클릭되지 않습니다|@{.tcard__v--none} 아직 찍히지 않은 시각은 빈칸이 아니라 '--:--' 입니다|@{.cta__now} 과녁 위의 시각은 기기의 시계라 1초마다 바뀝니다|@{.cta__need} '얼굴 인식' 이 시각 옆에 붙어, 누르면 카메라가 열린다는 것을 누르기 전에 알립니다|@{.row--zone} 클릭하면 인정범위 지도 창이 열립니다|@{.act__b--on} 클릭하면 얼굴 등록 안내로 넘어갑니다|@{.act__go} 오른쪽 끝의 표가 한 바퀴에 한 번 앞으로 밀립니다">홈 — 출근 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-cal"
        data-why="날짜를 바꾸는 일을 띠가 있던 그 자리에서 합니다. 머리줄(날짜 칸 · '오늘' · 알림)은 그대로 두고 그 아래 한 줄만 한 달로 펴지는 것은, 같은 줄을 두 자리에 그리면 어디를 보고 있었는지가 끊기기 때문입니다. 띠와 달이 같은 칸을 같은 차례로 쥐고 있어 요일도 제자리에 그대로 옵니다."
        data-steps="홈에서 날짜 줄을 클릭해 달을 편 상태"
        data-look="@{.calm} 달을 좌우로 밀면 앞뒤 달로 넘어갑니다 — 고르던 날은 따라가고(짧은 달이면 그 달의 마지막 날로), 오늘이 든 달보다 뒤로는 가지 않습니다|@{.cal__more--up} 펴 둔 동안에는 꺾쇠가 거꾸로 돕니다. 클릭하면 띠로 돌아갑니다|@{.cal__n--off} 흐린 날은 클릭되지 않습니다 — 이 달 밖의 날과 오늘보다 뒤인 날입니다|@{.calm .cal__n--on} 날짜를 클릭하면 그날의 홈으로 갑니다. 기록이 있는 날은 숫자 아래에 점이 붙습니다|@{.wheel} 년·월·일 휠은 칸마다 따로 굴러가고, 손을 떼면 가운데 띠에 맞춰 멎습니다. 멎은 값으로 달력이 바뀌고 달은 펴진 채로 남습니다 — 오늘보다 뒤인 해·달·날은 칸에 없습니다|@{.dim--cal} 어두운 자리를 클릭하면 닫힙니다 — 꺾쇠로 닫을 때와 같이 보던 날짜는 그대로입니다">홈 — 날짜 고르기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-done"
        data-why="퇴근은 작업내용을 쓴 뒤에야 찍을 수 있어, 쓰기 전에는 과녁을 꺼 둡니다 — 눌리게 두면 누른 다음에야 막히고 무엇을 더 해야 하는지는 거절 한마디로만 돌아옵니다. 찍힌 시각 옆에 어느 길로 들어왔는지를 함께 적는 것은 같은 날 기록이 앱 · 단말기 · 현장소장 앱으로 섞여 들어오기 때문입니다."
        data-steps="얼굴 인증으로 출근이 찍혀 홈으로 돌아온 상태 — 작업내용은 아직 쓰지 않았습니다"
        data-look="@{.bd--positive} 출근 시각 옆의 '앱 · 얼굴' 이 그 기록이 어느 길로 들어왔는지 적습니다|@{.cal__n--open} 띠의 오늘 아래 점이 경고색입니다 — 출근만 찍히고 퇴근이 아직 없는 날입니다(어제는 파란 점)|@{.cardb} 지금 클릭할 수 있는 것은 '작업내용 작성하기' 하나뿐입니다 — 클릭하면 작업내용 작성으로 갑니다|@{.cardb__c} 오른쪽 끝의 꺾쇠가 한 바퀴에 한 번 앞으로 밀립니다|@{.act__b--lock} 퇴근 과녁은 클릭되지 않습니다 — 오른쪽 끝이 꺾쇠가 아니라 자물쇠입니다|@{.cta__why} '퇴근 인증하기' 아래에 '작업내용 작성 후 퇴근이 가능해요' 가 붙습니다">홈 — 출근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-work"
        data-why="작업내용을 쓰면 퇴근 과녁이 켜집니다 — 앞 화면에서 막아 두었던 조건이 풀립니다. 쓴 것을 출퇴근 카드 바로 아래에 붙이는 것은 오늘 한 일이 오늘 찍힌 시각 다음에 오는 차례이기 때문이고, 글을 줄여 적는 것은 여기서 할 일이 다시 읽는 것이 아니라 썼다는 것을 확인하는 일이어서입니다."
        data-steps="작업내용을 저장하고 홈으로 돌아온 상태"
        data-look="@{.card--note} 글은 두 줄까지 보이고 그 뒤는 말줄임입니다|@{.wnote__e} '수정' 을 클릭하면 작업내용 작성으로 돌아갑니다|@{.act__b--dark} 퇴근 과녁이 켜지고, 오른쪽 끝이 자물쇠에서 꺾쇠로 바뀝니다">홈 — 작업내용 작성 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-out"
        data-why="출근과 퇴근이 모두 찍히면 과녁이 할 일을 잃습니다. 그 자리를 비우지 않고 '퇴근시간 변경' 을 두는 것은 찍힌 시각이 틀렸을 때 갈 데가 여기뿐이기 때문입니다. 오늘 해야 할 일이 아니라 필요하면 가는 길이라 과녁이 아닌 한 줄짜리 카드로 둡니다."
        data-steps="퇴근 인증까지 끝나 홈으로 돌아온 상태"
        data-look="@{.tcards} 출근과 퇴근 모두 시각 아래에 어느 길로 들어왔는지가 붙습니다|@{.cardb--quiet} 바닥의 '퇴근시간 변경' 은 꺾쇠가 앞으로 밀지 않습니다 — 지금 하라고 권하는 일이 아닙니다">홈 — 퇴근 완료</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-home-past"
        data-why="'오늘' 은 되돌아가는 길이라 다른 날을 보는 동안에만 켭니다. 켜져도 면색 알약인 것은, 날짜를 옮겨 본 사람에게만 필요한 길이 현장을 바꾸는 길('현장선택')만큼 눈에 들어올 까닭이 없어서입니다. 지난 날에는 찍을 것이 없어 출근 · 퇴근 과녁 대신 고치는 길만 둡니다."
        data-steps="띠에서 어제를 클릭한 상태"
        data-look="@{.pill--today} '오늘' 이 켜집니다 — 클릭하면 오늘로 돌아갑니다. 오늘을 보는 화면에서는 같은 면에 글자만 흐려집니다|@{.cal__n--today} 오늘은 점선 테이고, 채운 동그라미는 지금 고른 날입니다|@{.cardb--quiet} 지난 날에 할 수 있는 것은 '퇴근시간 변경' 뿐입니다">홈 — 지난 날 보기</button>
      <span class="proto-nav-group-label">근로자 앱 · 얼굴 등록</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-face"
        data-why="안면인식 현장인데 이 현장에 등록된 얼굴이 없으면 출근이 바로 되지 않습니다. 막는 말로 끝내지 않고 등록으로 데려가는 것은 근로자가 그 자리에서 할 수 있는 일이 등록뿐이기 때문입니다."
        data-steps="홈에서 '출근 인증하기' 를 클릭한 상태 — 이 현장에 등록된 얼굴이 없습니다"
        data-look="@{.scan--alert} 얼굴을 훑는 그림이 돕니다 — 레이저가 위에서 아래로 훑고 파장이 떠납니다|@{.scan__go} '얼굴 등록하고 출근하기' 를 클릭하면 시트가 내려가는 몸짓 없이 곧바로 얼굴 등록 동의로 갑니다 — 내려가는 그림은 '여기서 나간다' 는 말이라 닫기(✕)와 어두운 자리의 몫입니다|@{.dim} 어두운 자리나 닫기(✕)를 클릭하면 홈으로 돌아갑니다">얼굴 등록 안내</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-reg"
        data-why="얼굴은 민감정보라 찍기 전에 동의를 받습니다 — 이미 찍힌 사진을 앞에 두고 '아니요' 를 고르기는 어렵습니다. 동의는 현장마다 한 번입니다: 등록한 얼굴을 그 현장의 출퇴근 확인에만 쓰기 때문에 현장이 바뀌면 쓰는 곳도 바뀝니다. 그래서 어느 현장의 동의인지를 맨 위에 적습니다."
        data-steps="얼굴 등록 안내에서 '얼굴 등록하고 출근하기' 를 클릭한 상태"
        data-look="@{.card--agree} '전체 동의' 가 아래 둘을 묶습니다 — 각 항목 오른쪽의 꺾쇠가 본문으로 들어가는 길입니다|@{.bnr} 안내는 시스템 Banner 입니다 — 조건이 해소될 때까지 흐름 안에 남는 인라인 메시지입니다|@{.act__b--on} '동의하고 촬영하기' 를 클릭하면 촬영 확인으로 갑니다">얼굴 등록 — 동의</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-shot"
        data-why="찍은 사진을 한 번 보여 주고 등록할지 묻습니다. 되돌리는 쪽을 카드 밖에 면 없이 두는 것은, 둘을 같은 크기로 나란히 두면 어느 쪽이 주된 동작인지 흐려지기 때문입니다."
        data-steps="'동의하고 촬영하기' 를 클릭해 얼굴을 찍은 상태"
        data-look="@{.confirm__ok} 이름이 두 몫을 적습니다 — '등록하고 출근 인증하기'. 클릭하면 등록이 끝나고 곧바로 출근 인증 카메라가 열립니다|@{.confirm__re} '다시 촬영하기' 를 클릭하면 카메라로 돌아갑니다">얼굴 등록 — 촬영 확인</button>
      <span class="proto-nav-group-label">근로자 앱 · 출근 인증</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-cam"
        data-why="등록을 마치면 바로 이어집니다 — 등록만 하고 홈으로 돌려보내면 출근을 한 번 더 눌러야 합니다. 이미 등록한 사람은 홈의 출근 과녁에서 곧장 옵니다. 제 얼굴 하나를 확인하고 끝나는 일이라 센 수도 종료하는 길도 두지 않습니다."
        data-steps="얼굴 등록을 마쳐 출근 인증으로 이어진 상태"
        data-look="@{.cam__who} 누구를 확인하는 중인지가 틀 위에 붙습니다 — 먼저 보여야 남의 폰에 대고 찍는 일이 생기지 않습니다|@{.cam__go} 클릭하면 인증 성공으로 갑니다|@{.cam__back} 돌아가는 길은 왼쪽 위의 뒤로 가기입니다">출근 인증 — 카메라</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="w-cam-ok"
        data-why="성공은 잠깐 띄우고 앱이 스스로 홈으로 돌려보냅니다 — 한 사람의 인증이라 결과를 눌러 닫게 하면 그 한 번이 매일 쌓입니다. '메인으로' 를 함께 두는 것은 기다리지 않고 바로 가려는 사람 몫입니다."
        data-steps="얼굴이 인식되어 출근이 찍힌 상태"

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-worker.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
