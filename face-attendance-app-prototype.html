<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 현장소장 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 현장소장 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 현장소장 앱(kpmManager) 화면을 시나리오별로 모아 본다. 근로자 앱은 face-attendance-worker-prototype.html 에 따로 있다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
/* 설명(data-why)은 말하려는 것마다 줄을 바꿔 적는다. 크롬은 그 값을 한
   문단으로 내므로 줄바꿈이 살아 있게 한다 — 한 덩어리로 이어 붙으면 어디서
   다음 이야기가 시작되는지 읽는 사람이 찾아야 한다.
   다만 빈 줄은 한 줄 높이를 통째로 가져가 사이가 너무 벌어진다. 아래
   스크립트가 빈 줄을 걷어내고 문단마다 블록으로 끊으므로 사이는 여기서
   잡는다 — 스크립트가 못 돌아도 pre-line 이 받쳐 준다 */
.proto-brief__why{white-space:pre-line}
.proto-brief__wp{display:block}
.proto-brief__wp + .proto-brief__wp{margin-top:var(--space-8)}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-app.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="현장소장 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">현장소장 앱 · 출퇴근 등록</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="m-in"
        data-why="현장소장이 출퇴근을 찍을 수 있는 화면입니다.
           
           원하는 현장을 선택한 다음 출퇴근을 진행할 수 있습니다."
        data-steps="안면 출퇴근 메뉴에 들어와 출퇴근 등록 탭을 누른 상태"
        data-look="
          |@{.cta__art} '출근 등록 시작' 카드 안에는 얼굴을 인식하는 애니메이션이 동작합니다.
          |@{.cta--in .cta__go} '출근 등록 시작' 문구 우측의 화살표도 일정 간격으로 바운스 애니메이션이 작동합니다.
          |@{.mode} 출퇴근 모드 전환은 1. 바닥의 원하는 토글 문구를 클릭했을 때 2.카드를 좌우로 스와이프할 때 3. 사이드에 빠져있는 카드를 직접 눌렀을 때 변경됩니다.
          |@{.deck__t} 카드가 없는 방향으로 스와이프 할 땐 카드가 제자리에서 좌우로 한 번 흔들리는 애니메이션이 작동합니다.
          |@{.bds} 미전송·반영불가 뱃지는 등록 카드 바로 위 가운데에 위치합니다.
          |@md @lg @{.cta--in} 태블릿모드에서 출퇴근 카드는 최대 크기가 정해져 있습니다">출근 모드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-out"
        data-why="출퇴근 등록 탭에서 퇴근모드로 전환한 화면입니다. "
        data-steps="안면 출퇴근 메뉴에 들어와 출퇴근 등록 탭을 누르고 퇴근 모드를 선택한 상태"
        data-look="@{.cta--out} 다음 차이를 제외하고 '출근 등록 시작'과 동일한 성격을 가진 카드입니다.
           1. 배경색 2. 얼굴 인식 애니메이션 캐릭터의 홍조">퇴근 모드</button>
            <span class="proto-nav-group-label proto-nav-group-label--sub">카메라를 열면</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam"
        data-why="현장소장이 직접 안면인식 기능을 활용해 근로자 출퇴근을 할 수 있는 화면입니다."
        data-steps="'출근 등록 시작' 을 클릭해 후면 카메라가 동작하는 상태"
        data-look="
          |@{.cam__tip} 얼굴 인식이 성공하여 출퇴근 등록이 완료된 수를 카운팅합니다.
          |@{.mode--cam} 출근과 퇴근 모드를 전환할 수 있는 토글이며 출근 또는 퇴근모드 페이지에 삽입된 토글과 같은 스타일입니다.
          |@{.camsw} 카메라를 전면 카메라로 바꿉니다.
          |@md @lg @{.cam__foot} 태블릿 모드에서는 토글과 스위치 버튼 그룹 폭 최대 크기가 정해져 있습니다.
          |@{.cam__stop} 출퇴근 등록 화면을 나갈 수 있습니다. ">찍는 중</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam-ok"
        data-why="근로자 얼굴 인식을 성공했을 때 화면입니다. 다른 얼굴이 인식되기 전까지 유지됩니다."
        data-steps="등록된 근로자의 얼굴이 인식되어 출근이 등록된 상태"
        data-look="
          |@{.cam__box--ok} 가이드 사각형과 안내 문구의 색이 성공컬러로 변경됩니다.
          |@{.cam__t--ok} 근로자 이름을 크게 명시하고 '출근이 등록되었습니다' 상태를 안내합니다.
          |@{.cam__tip} 등록된 근로자의 숫자가 증가합니다.">등록된 근로자</button>

<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam-new"
        data-why="얼굴 인식은 가능하나 등록된 근로자를 찾을 수 없을 때 뜨는 바텀시트입니다.

출근 도중에도 근로자 등록을 곧바로 진행할 수 있는 선택지를 제공합니다.

화면을 갈아 끼우지 않고 시트로 올리는 것은, 갈아 끼우면 줄 선 사람들 앞에서 카메라가 한 번 닫혔다 열리기 때문입니다."
        data-note="
          |해당 페이지에서 근로자 등록과 출근 등록을 마치면 등록 모드로 다시 복귀합니다."
        data-steps="카메라가 등록되지 않은 얼굴을 읽은 상태"
        data-look="
          |@{.alert--sheet} 카메라를 닫지 않고 그 위로 시트가 올라옵니다 — 뒤에 찍던 화면이 그대로 남습니다
          |@{.scan__go} &#39;근로자 얼굴 등록&#39; 을 클릭하면 근로자 얼굴 등록 화면으로 갑니다
          |@{.dim} 어두운 영역이나 닫기(✕)를 클릭하면 찍던 카메라로 돌아갑니다">미등록 근로자</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam-fail"
        data-why="얼굴을 여러 번 읽지 못했을 때 뜨는 바텀시트입니다. 등록된 근로자를 오래 인식하지 못하면 업무에 불편함을 야기하므로 다른 해결책을 제시합니다."
        data-steps="카메라 인식에서 같은 얼굴을 여러 번 읽지 못한 상태"
        data-look="
          |@{.sheet__t} 문제가 발생한 경우 폰트 컬러를 주의색으로 안내합니다.
          |@{.cta__art--ask} 근로자 얼굴이 비어있는 애니메이션이 동작합니다.
          |@{.alert__d, .scan__go} 화면에 '출근'이라 적힌 곳은 퇴근 모드일 때 모두 '퇴근'으로 치환됩니다.
          |@{.scan__go} 직접 출근 처리 화면으로 이동합니다.
          |@{.dim--sheet} 어두운 영역이나 닫기(✕)를 클릭하면 찍던 카메라로 돌아갑니다"

>얼굴 확인 실패</button>
      <!-- 얼굴 확인 실패에서 '직접 출근 처리하기' 를 누르면 갈라지는 가지다.
           셋이 한 줄기라 한 단 들여 묶는다 — 이름표가 어느 자리에서
           갈라졌는지를 말하므로, 아래 이름은 짧게 적는다 -->
      <span class="proto-nav-group-label proto-nav-group-label--sub">직접 출근 처리하기를 누르면</span>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-verify"
        data-why="촬영한 얼굴과 등록된 근로자를 직접 대조하여 출근 또는 퇴근 인증을 하는 화면입니다."
        data-steps="얼굴 확인 실패 시트에서 &#39;직접 출근 처리하기&#39; 클릭 후 근로자 얼굴을 사진으로 촬영한 상태"
        data-look="
          |@{.card--pick} 등록된 근로자의 정보를 불러온다는 것을 암시하는 스켈레톤 카드입니다. 근로자 선택 완료 시 동일한 레이아웃에 정보가 기입됩니다.
          |@{.pick__b} 현장에 등록된 근로자를 검색할 수 있는 버튼입니다. 클릭 시 근로자 선택하기 바텀시트가 올라옵니다.
          |@{.nav__ic--l} 뒤로가기 버튼 클릭 시 이전 화면인 출근 등록 찍는 페이지로 이동합니다.">직접 출근 처리</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-verify-find"
        data-why="현장에 등록된 근로자를 검색할 수 있는 바텀시트입니다. 입력폼은 이미 선택된 상태로 등장한 키보드와 함께 근로자 이름을 곧바로 입력할 수 있습니다."
        data-steps="직접 출근 처리에서 &#39;근로자 선택하기&#39; 를 클릭한 상태"
        data-look="
          |@{.inp--find} 열리자마자 활성화된 상태입니다. 초성만 쳐도 포함된 근로자를 선별합니다.
          |@{.kb} 키보드 예시 이미지입니다. 모바일 디바이스에선 기본 키보드가 활성화됩니다.
          |@{.find__list} 리스트가 많을 땐 리스트 시트 안에서 스크롤 됩니다.
          |@{.dim} 어두운 영역이나 닫기(✕)를 클릭하면 직접출근 처리로 돌아갑니다">근로자 선택하기</button>
<button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-verify-pick"
        data-why="선택한 근로자의 정보값과 현장 소장이 직접 찍은 사진을 비교할 수 있는 화면입니다."
        data-note="퇴근 모드로 찍는 중이면 헤더와 바닥의 출근 문구가 모두 퇴근으로 바뀝니다"
        data-steps="근로자 선택하기 시트에서 한 명의 근로자를 클릭한 상태"
        data-look="
          |@{.vrf .card} 선택한 근로자의 정보가 노출되는 카드입니다.
          |@{.pick__re} 다른 근로자 선택이 필요한 경우 필요한 버튼입니다.
          |@{.act__b} 숨겨져있던 등록하기 버튼이 활성화됩니다.
          |@{.photo__ref} &#39;최초 등록 얼굴 확인&#39; 을 클릭하면 등록해 둔 얼굴로 교체되며 돌아가기 버튼을 누르면 현장소장이 찍은 사진으로 되돌아갑니다.">근로자 선택 완료</button>

      <span class="proto-nav-group-label">현장소장 앱 · 근로자 관리</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-workers"
        data-why="선택한 현장에 등록된 근로자를 불러오는 화면입니다."
        data-steps="근로자 관리 탭에서 현장을 고른 상태"
        data-look="
          |@{.lbar__f} 근무상태와 직종 종류에 따라 근로자를 필터링할 수 있습니다.
          |@{.sta} 재직을 제외한 근무상태는 근로자 사진 하단에 기재됩니다.
          |@{.card--off} 재직은 제외한 근무카드는 근로자의 사진이 흑백처리되며, 배경과 폰트 색의 명도를 높여 활성화된 재직 카드와 구분합니다.
          |@{.face--none} 얼굴을 등록하지 않은 근로자는 근로자 아이콘으로 대체됩니다.
          |@{.card__k--foreign} 여권번호로 등록한 근로자는 주민번호 자리에 여권번호가 보입니다
          |@{.bd--src} 근로자를 등록한 디바이스를 뱃지로 표기합니다.
          |@{.act__b--off} 선택한 카드가 없을 땐 삭제 버튼이 비활성화 상태로 보입니다.
          |@sm @md @lg @{.list} 근로자 리스트는 디바이스 사이즈마다 모바일은 한 단, 태블릿은 두 단으로 전환됩니다.
          |@{.act} 바텀 버튼은 목록을 스크롤하는 동안 내려가 있다가, 멈추면 다시 올라옵니다">현장을 선택했을 때</button>

      <!-- 아래는 이 목록에서 무엇을 한 뒤의 모습이라 한 단 들여 묶고,

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-app.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* 설명(why)의 문단 사이를 좁힌다. 크롬은 why 를 한 <p> 로 내고 pre-line 이
     빈 줄을 그대로 살리는데, 빈 줄은 한 줄 높이(21px)를 통째로 가져간다.
     빈 줄을 걷어내고 문단마다 블록으로 끊어, 사이를 CSS 로 잡게 한다.
     크롬이 시나리오를 옮길 때마다 다시 그리므로 그려진 뒤에 집는다 */
  function splitWhy() {
    var p = document.querySelector('.proto-brief__why:not([data-wp])');
    if (!p) return;
    p.setAttribute('data-wp', '');   /* 먼저 표시한다 — 아래 조작이 감시기를 다시 부른다 */
    var parts = p.textContent.split(/\n{2,}/);
    if (parts.length < 2) return;
    p.textContent = '';
    for (var i = 0; i < parts.length; i++) {
      var s = document.createElement('span');
      s.className = 'proto-brief__wp';
      s.textContent = parts[i];
      p.appendChild(s);
    }
  }
  new MutationObserver(splitWhy).observe(document.body, { childList: true, subtree: true });

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
  splitWhy();
</script>
