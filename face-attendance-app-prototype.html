<!-- design-system: v1.0.0 -->
<!-- prototype: 안면 출퇴근 앱 — 화면별 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안면 출퇴근 앱 프로토타입</title>
<meta name="description" content="안면 출퇴근 앱 화면을 시나리오별로 모아 본다. 현장소장 앱 전체와 근로자 앱 홈이다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 와 '언제 것인지 적는 줄' 뿐이다.
   나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
.proto-stamp{margin:var(--space-stack-sm) var(--space-16) 0;
  font-size:var(--font-size-12);line-height:1.4;color:var(--color-text-subtle)}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>

  <!-- 다음 겹을 미리 당겨 둔다 — 틀 안은 문서가 겹겹이 차례로 선다 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="prefetch" href="assets/face-attendance-app.css" as="style">
  <link rel="prefetch" href="assets/face-attendance-app.js" as="script">
  <link rel="prefetch" href="face-attendance-app.html" as="document">
</head>
<body>

<div class="proto-layout" data-proto-sub="안면 출퇴근 앱 — 화면별 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <!-- ⚠ 폭은 둘뿐이다 — 이 화면들은 앱이라 데스크톱이 없다.
         lg 버튼을 지우는 것만으로는 모자라 아래 스크립트에서 비교 모드의 폭 목록과
         처음 열리는 폭도 함께 내려 잡는다 -->
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn is-active" type="button" data-viewport="sm" aria-pressed="true">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <!-- **언제 받은 페이지인지** 적는다. 화면은 틀 안에 있어 주소에 ?r= 을 실어
         늘 새로 받지만, 이 바깥 페이지에는 그런 장치가 없어 브라우저가 쥐고 있던
         것을 그대로 내놓을 수 있다 — 「고친 게 안 보인다」가 거기서 나온다.
         document.lastModified 는 **이 문서를 받은 시각**이라, 캐시에서 나온
         페이지면 옛 시각이 적힌다 -->
    <p class="proto-stamp" id="protoStamp"></p>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">현장소장 앱 · 인증</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="m-in"
        data-why="얼굴을 찍기 전의 화면입니다. 과녁 안의 그림은 카메라가 사람을 잡고 있는 모습입니다 — 얼굴이 움직일 때 꺾쇠 틀까지 함께 흔들리는 것은 흔들리는 것이 사람이 아니라 카메라를 든 손이기 때문입니다. 찾았다는 신호는 인식 결과 화면과 같은 초록으로 줍니다 — 같은 일을 두 화면이 다른 색으로 말하면 색이 뜻을 잃습니다. 이 화면에서 할 일은 인증을 여는 것 하나뿐이라, 바닥 바 대신 한가운데에 카드만 한 과녁을 둡니다 — 가는 띠로 받기에는 너무 자주 누르고, 장갑 낀 손으로 누릅니다. 탭은 흰 머리 카드에, 현장은 그 아래 목록 바로 위에 둡니다 — 탭은 화면을 가르고, 현장은 그 아래 내용이 어느 현장 것인지를 말합니다."
        data-steps="안면 출퇴근 메뉴에 들어와 출근 탭이 열린 상태 — 보내지 못한 인증이 있습니다"
        data-look="@{.cta__art} 안전모를 쓴 사람이 틀 언저리를 들락거립니다 — 한쪽으로 벗어났다 돌아와 섭니다. 다섯이 한 바퀴이고, 벗어나는 쪽도 돌아오는 품도 사람마다 다릅니다. 움직이는 동안은 흐리고, 한 번 지나쳤다가 되돌아와 서면 초점이 맞습니다. 서고 나서 눈을 두 번 깜빡이고, 입은 한 번 펴집니다|@{.scan__corner} 꺾쇠는 카메라를 든 손을 따라 함께 흔들립니다 — 사람과 달리 흐려지지는 않습니다. 빛은 숨 쉬듯 옅어졌다 짙어지다가, 얼굴이 틀 안에 돌아와 서면 초록으로 켜집니다. 꺼지고 나서 다음 사람으로 넘어갑니다. 움직임을 줄인 기기에서는 첫 사람만 남고 모두 멎습니다|@{.bds} 미전송·반영불가는 현장 카드 밖, 그 아래에 섭니다|@md @{.body} 태블릿에서는 좌우 여백만 넓어지고 안내 글은 가운데에 그대로 있습니다">출근 인증 대기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-out"
        data-why="출근과 퇴근은 색으로 가릅니다. 시안의 버튼 색에 주황이 없어, 둘째로 강한 색인 검정을 퇴근에 줍니다. 찍는 사람도 보는 자리도 출근과 같아 구성은 그대로 둡니다."
        data-steps="퇴근 탭을 연 상태 — 보내지 못한 인증은 없습니다"
        data-look="@{.cta--out} 퇴근 인증 시작은 검정입니다. 출근은 파랑입니다|@{.ctx} 보내지 못한 인증이 없으면 현장 이름 아래 뱃지 줄이 통째로 빠집니다">퇴근 인증 대기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam"
        data-why="앱(Flutter)이 직접 그리는 화면입니다. 웹 화면이 아니라 시안의 머리·바닥 셸을 쓰지 않고, 얼굴을 맞출 자리와 지금 무엇을 찍는지만 남깁니다. 바탕은 카메라가 비추는 화면 대신 사진 한 장입니다 — 회색 면으로 두니 카메라가 꺼진 화면처럼 보였고, 가이드 사각형이 무엇을 담으라는 틀인지도 드러나지 않았습니다. 사각형 바깥을 어둡게 덮고 바닥으로 갈수록 더 어둡게 하는 것은, 거기 앉는 글자와 버튼이 사진의 밝은 데(하늘·콘크리트)와 겹치면 먹히기 때문입니다. 몇을 찍었는지는 화면 어디에도 남지 않아 찍는 사람이 속으로 세고 있어야 했습니다 — 누르는 자리 바로 위에서 셉니다."
        data-steps="출근 인증 시작을 클릭해 카메라가 열린 상태"
        data-look="@{.cam__t} 안내는 '얼굴을 사각형 안에 맞춰주세요.' 입니다|@{.cam__tip} '출근 인증하기' 바로 위에서 지금까지 몇을 찍었는지 셉니다|@{.cam__go} 바닥의 '출근 인증하기' 가 지금 찍는 것이 출근인지 퇴근인지도 함께 말합니다|@{.cam__stop} 끝내는 쪽은 틀 바로 아래에, 면 없이 섭니다|@md @{.cam__box} 태블릿에서는 가이드 사각형이 좌우로 더 들어오고, 바탕 사진은 위아래가 잘려 얼굴이 더 크게 잡힙니다">카메라 인식</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-cam-ok"
        data-why="결과를 잠깐 띄우고 다음 사람으로 넘어갑니다. 한 번 열면 줄 선 사람을 이어서 찍기 때문에, 결과를 클릭해 닫게 하면 줄이 그때마다 멈춥니다."
        data-steps="홍길동의 얼굴이 인식된 상태"
        data-look="@{.cam__box--ok} 가이드 사각형이 초록으로 바뀌고, 결과 문구도 같은 초록입니다 — 테는 한 색이 아니라 짙고 옅은 데가 도는 그라데이션이고, 숨 쉬듯 옅어졌다 짙어집니다|@{.cam__t--ok} 이름이 먼저 크게, 무슨 일이 되었는지가 그 아래 한 단 작게 섭니다 — '홍길동님 / 출근 처리 완료!'|@{.cam__tip} 방금 한 사람이 끝나 센 수가 하나 올라갔습니다">인식 결과</button>

      <span class="proto-nav-group-label">현장소장 앱 · 근로자 관리</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-workers"
        data-why="얼굴을 등록한 근로자를 현장별로 봅니다. 카드에 사진을 함께 두는 것은 이 목록에서 얼굴 등록 여부가 갈리기 때문입니다. 거를 것이 직종 하나뿐이라 목록 머리줄의 '전체' 가 필터를 겸합니다. 고르는 체크박스와 거르는 필터는 왼쪽에 모읍니다. 거른 결과가 몇 명인지는 필터 옆의 수가 말합니다 — 거르개와 그 결과는 한 덩어리입니다. 반대쪽 끝은 고른 수가 생길 때만 씁니다."
        data-steps="근로자 관리 탭에서 현장을 고른 상태"
        data-look="@{.face--none} 얼굴을 등록하지 않은 근로자도 목록에 있습니다 — 사진 자리가 빈 상태입니다|@{.act__b--off} 아무도 고르지 않았으므로 삭제는 꺼져 있습니다|@{.card__k--foreign} 외국인은 주민번호 자리가 '여권번호' 로 바뀝니다|@{.list} 목록이 한 화면을 넘으면, 스크롤할 때 현장 밑으로 들어가는 카드가 옅어지며 사라집니다|@{.act} 아래로 읽어 내려가는 동안 바닥 버튼은 내려가 있다가, 멈추면 올라옵니다|@md @{.list} 태블릿에서는 카드가 두 단으로 놓입니다">현장 선택 시</button>

      <!-- 아래 둘은 이 목록에서 무엇을 고른 뒤의 모습이라, 한 단 들여 묶는다.
           이름표의 단계는 셸이 세어 적는다(--sub 이면 2단) -->
      <span class="proto-nav-group-label proto-nav-group-label--sub">목록에서 고르면</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-workers-job"
        data-why="거른 뒤에도 무엇으로 걸렀는지가 머리줄에 남습니다. 필터를 다시 열어 보지 않아도 지금 보고 있는 것이 무엇인지 머리줄 한 줄로 알 수 있습니다."
        data-steps="근로자 관리에서 직종을 '형틀목공' 으로 고른 상태"
        data-look="@{.sel--selected} 고르고 나면 필터의 글씨가 굵고 짙어집니다 — 고르기 전에는 '전체' 에 보통 굵기입니다. 테도 면도 없는 꼴이라 굵기가 고른 표입니다|@{.sel__n} 그 옆의 수도 걸러진 뒤의 수로 바뀝니다">직종을 고르면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-workers-pick"
        data-why="고른 사람이 있어야 지울 수 있습니다. 삭제를 꺼 두는 것은, 클릭할 수 있는 자리에 그냥 두면 고르지도 않고 클릭한 뒤에야 무엇이 빠졌는지 알게 되기 때문입니다. 켜질 때 검정을 쓰는 것은 되돌릴 수 없는 동작이기 때문입니다."
        data-steps="근로자 관리에서 홍길동과 김철수를 고른 상태"
        data-look="@{.chk--on} 고른 카드는 체크박스가 사진 위에서 파랗게 채워집니다|@{.lbar__n} 오른쪽 끝에 '선택 2명' 이 섭니다 — 고르기 전에는 그 자리가 비어 있습니다. 목록에 남은 수는 필터 옆에 따로 있습니다(둘이 세는 것이 다릅니다)|@{.act__b--dark} 삭제가 켜집니다">근로자를 선택하면</button>
      <span class="proto-nav-group-label">현장소장 앱 · 근로자 추가·수정</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-worker-new"
        data-why="얼굴 한 장과 기본 정보를 한 화면에서 받습니다. 사진이 맨 위인 것은 이 등록의 목적이 얼굴이기 때문입니다."
        data-steps="근로자 추가를 클릭해 열린 상태 — 아직 아무것도 채우지 않았습니다"
        data-look="@{.scan} 인증 줄이 얼굴 위를 위에서 아래로 훑어 내리고, 가운데에서 파장이 쉼 없이 바깥으로 번집니다. 움직임을 줄인 기기에서는 둘 다 멈추고 얼굴만 남습니다|@{.ask} 외국인인지는 '외국인 근로자인가요?' 한 줄로 묻고, 답은 그 옆 예·아니오 토글입니다|@{.step} 단가는 칸에 적어도 되고, ＋·－ 로 올리고 내려도 됩니다|@{.fld__l b} 필수 항목은 라벨 옆에 '(필수)' 가 붙습니다|@md @{.form} 태블릿에서는 폼이 늘어나지 않고 가운데로 모입니다">근로자 추가</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-worker-new-foreign"
        data-why="외국인은 주민번호가 없어 여권번호를 받습니다. 받는 값이 갈린다고 화면을 따로 두지 않고, 토글 하나로 그 칸만 바꿉니다 — 나머지 칸은 내국인과 같습니다."
        data-steps="근로자 추가에서 외국인 여부를 '예' 로 바꾼 상태"
        data-look="@{.fld__l--foreign} 주민번호 칸이 '여권번호' 로 바뀝니다|@{.tog .is-on} 토글이 '예' 쪽으로 넘어갑니다">외국인이면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-shot"
        data-why="찍은 얼굴로 등록할지 묻고 나서 저장합니다. 흐린 사진 한 장이 그 뒤의 출근 인증을 내내 막기 때문에, 다시 찍을 기회를 이 자리에서 줍니다."
        data-steps="얼굴 등록하기를 클릭해 한 장 찍은 상태"
        data-look="@{.confirm} 화면을 바꾸지 않고 띄운 창입니다 — 뒤에는 이 창을 띄운 '근로자 추가' 가 흐리게 남습니다|@{.confirm__t} 묻는 말은 카드 위에 큰 글씨로 섭니다|@{.confirm__card} 사진과 '얼굴 등록하기' 가 한 카드에 묶입니다|@{.confirm__re} 되돌리는 '다시 촬영하기' 는 카드 밖에, 면 없이 섭니다">등록 촬영 확인</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="m-worker"
        data-why="보던 자리에서 바로 고칩니다. 한 칸을 고치려고 화면을 한 번 더 여는 값은 고칠 데가 많든 적든 똑같이 치러야 하는데, 여기서 고치는 것은 대개 한두 칸입니다. 저장을 꺼 두는 것은, 고친 데가 없는데도 켜져 있으면 눌러야 하는 자리인지를 매번 가늠하게 되기 때문입니다. 사진을 맨 위에 크게 두는 것은 이름보다 사진이 먼저 확인되어야 하기 때문입니다."
        data-steps="근로자 관리에서 홍길동을 연 상태"

        data-steps="이력에서 홍길동 07:05:19 줄을 클릭한 상태"

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var APP='face-attendance-app.html';

  /* **새로고침이 틀 안까지 닿게 한다.** 화면은 iframe 안에 들어 있어, 바깥을
     강력 새로고침해도 안쪽 문서는 캐시에서 그대로 나온다 — 고친 것이 올라갔는데
     안 보인다는 말이 거기서 나온다. 한 번 열 때 정한 값을 주소에 실어, 페이지를
     새로 열면 안쪽도 새로 받게 한다.
     ⚠ 시나리오를 옮길 때마다 바꾸지는 않는다. 매번 바꾸면 화면과 자산을 통째로
       다시 받아, 목록을 훑는 동안 캐시가 한 번도 쓰이지 않는다 */
  var LOAD = Date.now();

  /* 시나리오 이름이 곧 화면 이름이다 — 화면 파일이 ?screen= 으로 한 장을 켠다.
     여기서 더 할 일(클릭·스크롤)이 없다: 앱 화면은 한 장이 통째로 한 상태라,
     열어 놓고 무언가를 눌러 만들 상태가 없다 */
  function open(name){
    var f=$('#screen iframe'); if(!f) return;
    f.src = APP + '?screen=' + encodeURIComponent(name) + '&r=' + LOAD;
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);

  var stamp=$('#protoStamp');
  if(stamp) stamp.textContent='이 페이지 '+document.lastModified;
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});

  /* 폭을 모바일·태블릿으로 내려 잡는다 — 이 프로토타입에만 해당한다.
     크롬은 lg 를 기본으로 열고 비교 모드에서 lg·md·sm 셋을 나란히 놓는데,
     이 화면들은 앱이라 lg 에서 잴 것이 없다. 크롬 파일은 고치지 않고
     크롬이 읽는 값만 켜기 전에 바꾼다 */
  if (window.ProtoChrome) window.ProtoChrome.COMPARE = ['md','sm'];
  try {
    var want = new URL(location.href).searchParams.get('proto-view');
    var kept = sessionStorage.getItem('protoView');
    /* 다른 프로토타입에서 lg 로 보다 넘어오면 그 폭이 이어진다 — 여기엔 그 버튼이 없다 */
    if (!want && !/^(md|sm|compare)$/.test(kept || '')) sessionStorage.setItem('protoView','sm');
  } catch (e) {}

  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
