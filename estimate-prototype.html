<!-- design-system: v1.0.0 -->
<!-- prototype: 견적받기 — 조건별 화면 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적받기 프로토타입</title>
<meta name="description" content="탭과 거르개에 따라 달라지는 견적받기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교)은 components.js 의
     initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(견적신청 프로토타입과 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">탭 세 가지</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="tb-첫진입"
        data-why="페이지를 열면 첫 탭입니다. 파는 것이 셋인데 셈법이 저마다 달라(프로그램은 사업장 단위, 단말기 둘은 현장 단위) 한 화면에 늘어놓으면 '월 얼마'가 세 뜻으로 읽힙니다. 탭이 그 셋을 가릅니다."
        data-steps="페이지를 엽니다 — 그 뒤로는 아무것도 누르지 않습니다"
        data-look="탭 셋이 머리글 바로 아래 섭니다|고른 탭만 파란 글씨와 밑줄을 갖습니다 — 밑줄 하나로는 흑백에서 구분이 약합니다|탭마다 작은 줄로 무엇인지 덧붙입니다(노무관리 프로그램 · 벽부형·이동형·휴대형 · Ubio X Face Pro)|주소에 ?type= 이 없으면 A 입니다">첫 진입 (A · 프로그램)</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-전자카드"
        data-why="퇴직공제 단말기 탭. 금액이 이 탭에만 적힙니다 — quote.html 의 요율표에서 그대로 가져온 값이라, 프로그램 쪽처럼 '맞춤 견적'이라 쓸 까닭이 없습니다."
        data-steps="주소에 ?type=B 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="기기 셋이 나란히 서고 저마다 다른 금액을 답니다(74,000 · 69,000 · 83,000원)|지워진 금액이 1개월 기준가입니다 — 기간이 길수록 싸진다는 말이 숫자로 보입니다|'13개월 이상'은 요율이 12개월에서 멈춘다고 밝힙니다|견적받기를 누르면 quote.html 로 넘어가 그 자리에서 계산됩니다">B · 퇴직공제 전자카드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-안면인식"
        data-why="안면인식 탭. 기기가 한 종뿐이라 카드를 고를 일이 없어, 대신 수량 구간표가 그 자리를 받습니다. 금액은 face-quote.html 의 상수를 그대로 옮긴 값입니다."
        data-steps="주소에 ?type=C 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="기기가 하나라 카드가 가로로 눕습니다 — 셋일 때와 짜임이 다릅니다|수량 구간 넷이 같은 크기로 서서 '구간'으로 읽힙니다|구간은 현장별이 아니라 신청 전체를 합산해 정해진다고 표 아래에 적습니다|설치비·연동비는 금액이 아니라 조건이라 카드가 아니라 줄로 답니다">C · 안면인식 출퇴근관리</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-바꾸기"
        data-why="비교표를 한참 내려다 탭을 바꾸는 자리. 스크롤 위치를 그대로 두면 새 탭의 한가운데로 떨어져, 무엇이 바뀐 건지 알 수 없습니다. 탭 줄까지 되감아 그 상품의 처음부터 보여 줍니다."
        data-steps="A 탭에서 기능 비교표 한가운데까지 내려갑니다|탭 줄의 '안면인식 출퇴근관리'를 누릅니다"
        data-look="누르는 순간 탭 줄이 화면 맨 위로 되감깁니다|주소의 ?type= 이 C 로 바뀝니다 — 뒤로가기가 쌓이지는 않습니다(replaceState)|탭 줄은 스크롤을 따라붙어, 한참 내려가도 돌아올 수 있습니다">탭을 바꾸면</button>

      <span class="proto-nav-group-label">A · 서비스 두 장</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-서비스"
        data-why="고를 것 둘을 나란히 세운 자리입니다. 금액은 사업장 수·근로자 규모·신고 건수로 갈려 한 숫자로 적으면 어느 현장에도 맞지 않으므로, 숫자 대신 '무엇으로 정해지는지'만 적고 견적신청으로 넘깁니다."
        data-steps="페이지를 열고 서비스 블록으로 내려갑니다"
        data-look="금액 자리에 '사업장 맞춤 견적'과 무엇으로 정해지는지 한 줄이 섭니다|두 카드가 같은 두 줄을 쓰므로 높이가 저절로 맞습니다|두 장의 버튼이 모두 '견적 신청하기' 입니다 — 지금은 어느 쪽을 골라도 다음 걸음이 같습니다|프리미엄 카드만 바탕·테두리·버튼 색이 달라, 추천 띠 하나에 기대지 않습니다|⚠ 누르면 견적신청 폼이 모달로 떠야 하는 자리입니다 — 3.0·프리미엄 폼이 아직 없어 href 는 자리표(#)입니다">서비스 두 장</button>

      <span class="proto-nav-group-label">A · 기능 비교표</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-전체"
        data-why="A 탭에만 있는 표입니다. 노션 「서비스별 기능 상세」의 33개 기능을 그대로 옮겼습니다. 열은 둘뿐입니다 — '김반장 도입 전'은 견적을 낼 대상이 아니라 메인에서 할 말이라, 여기서는 고를 수 있는 둘만 세웁니다."
        data-steps="페이지를 열고 기능 비교표로 내려갑니다 — 거르개는 건드리지 않습니다"
        data-look="6개 카테고리에 33줄, 카테고리마다 몇 개인지 적힙니다|프리미엄 열만 바탕이 들어가 띠처럼 세로로 이어집니다|프리미엄 전용 줄은 3.0 칸이 '—' 입니다|폭을 sm 으로 줄이면 열이 사라지고 줄마다 '3.0 ✓ / 프리미엄 ✓' 알약이 붙습니다|표 아래 '견적 신청하기' 둘도 열을 따라 서서, 어느 쪽을 보다 눌렀는지가 남습니다">전체 보기</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">거르개를 걸면</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-일용"
        data-why="일용직 현장은 연차·사규·급여 스케줄 같은 상용 기능을 쓰지 않습니다. 쓰지 않을 줄까지 읽게 두면 33줄이 모두 남의 이야기처럼 보입니다 — 고용형태로 거르는 까닭입니다."
        data-steps="주소에 ?emp=daily 를 붙여 엽니다|기능 비교표로 내려갑니다"
        data-look="[상용] 줄 5개가 접혀 28줄이 남습니다|표 위 한 줄이 '일용직 현장 — 전체 33개 중 28개'로 바뀝니다|카테고리 머리의 개수도 함께 줄어듭니다|[일용] 꼬리표는 그대로 남습니다 — 거르개가 무엇을 보고 걸렀는지 눈으로도 보이게">일용직 현장</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-상용"
        data-why="상용직 중심 사업장. 일용 쪽이 접히면 「근태·출퇴근 관리」에 연차·휴가 한 줄만 남아, 이 서비스가 상용에 무엇을 해주는지가 오히려 또렷해집니다."
        data-steps="주소에 ?emp=regular 를 붙여 엽니다|기능 비교표로 내려갑니다"
        data-look="[일용] 줄 7개가 접혀 26줄이 남습니다|「모바일 앱」은 근로자 앱이 빠져 현장소장 앱 한 줄만 남습니다|일용 쪽과 달리 접히는 수가 더 많습니다 — 김반장이 일용 현장에 더 두텁다는 사실이 표에 그대로 드러납니다">상용직 중심</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-차이"
        data-why="'그래서 돈을 더 내면 뭐가 달라지나'에 한 번에 답하는 자리입니다. 프리미엄 전용 9줄만 남기고, 같은 영역은 지우지 않고 '똑같습니다'라고 적습니다 — 사라지면 안 본 것인지 없는 것인지 알 수 없습니다."
        data-steps="주소에 ?only=1 을 붙여 엽니다|기능 비교표로 내려갑니다"
        data-look="프리미엄 전용 9줄만 남습니다|「근태·출퇴근」·「근로계약·급여」·「모바일 앱」 셋은 줄이 하나도 없어 '이 영역은 3.0과 프리미엄이 똑같습니다' 한 줄이 섭니다|남은 줄은 모두 3.0 칸이 '—' 입니다|체크가 켜지면 알약이 파랗게 찹니다">차이만 보기</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-겹침"
        data-why="거르개 둘을 겹쳐 건 자리. 둘이 서로를 모르고 각자 거르면 '상용직인데 프리미엄 전용'인 한 줄만 남는 카테고리가 생깁니다 — 비는 카테고리가 늘어나도 표가 무너지지 않는지 보는 자리입니다."
        data-steps="주소에 ?emp=regular&only=1 을 붙여 엽니다|기능 비교표로 내려갑니다"
        data-look="33줄 중 9줄만 남습니다|「근로자 등록·관리」에는 상용 전용인 '고용보험 기준 일괄 등록'이 남습니다|'똑같습니다' 줄에서는 프리미엄 열의 파란 띠가 끊깁니다 — 그 자리에 견줄 것이 없다는 뜻입니다|한 줄 요약이 '상용직 중심 · 프리미엄 전용'으로 두 조건을 모두 말합니다">둘을 겹쳐 걸면</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">길이가 만드는 자리</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-머리줄"
        data-why="33줄은 한 화면에 들어오지 않습니다. 머리줄이 같이 흘러가 버리면 지금 보는 ✓ 가 3.0 것인지 프리미엄 것인지 알 수 없어, 머리줄만 화면 위에 붙여 둡니다."
        data-steps="페이지를 열고 표 한가운데(「근로계약·급여·명세서」 언저리)까지 내려갑니다"
        data-look="열 이름 두 개가 화면 맨 위에 붙어 따라옵니다|머리줄 아래 짙은 선이 표와 나머지를 가릅니다|프리미엄 쪽은 머리줄에서도 바탕이 이어져 띠가 끊기지 않습니다|탭 줄 바로 아래에 붙습니다 — 둘 다 따라붙는 것이라 겹치지 않게 머리줄이 탭 높이만큼 내려가 섭니다|좁은 폭(sm)에서는 머리줄이 통째로 사라집니다 — 대신 줄마다 이름표가 붙기 때문입니다">표 머리가 따라붙는 자리</button>

      <span class="proto-nav-group-label">탭 밖 · 공통</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="fq-열림"
        data-why="신청 직전에 가장 많이 눌리는 자리입니다. 이 페이지를 보다 생기는 오해를 바로잡는 셋만 남겼습니다 — 근거 문서가 없어 지어낸 답이 되던 둘(요금 산정 기준·요금제 전환 정산)은 덜어냈습니다."
        data-steps="페이지를 열고 FAQ 로 내려갑니다|두 번째 질문을 눌러 폅니다"
        data-look="질문은 셋뿐입니다|첫 질문은 처음부터 펴져 있습니다|두 번째 질문을 펴면 첫 질문은 닫히지 않습니다 — 견주어 읽을 수 있게|화살표가 아래에서 위로 돕니다">FAQ · 두 번째 질문</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="cta-마지막"
        data-why="끝까지 읽고도 못 고른 사람에게 남기는 자리. 페이지 어디에도 금액이 없으므로 '현장 이야기부터 들려 달라'고만 하고, 폼을 채우기 싫은 사람을 위해 전화 한 줄을 나란히 둡니다."
        data-steps="페이지를 열고 맨 아래까지 내려갑니다"
        data-look="네이비 바닥에 버튼 둘 — 견적 신청과 전화|전화 버튼만 자리표가 아닌 실제 번호(tel:1588-3818)라 모바일에서 바로 걸립니다|메인(index.html)의 마지막 CTA 와 같은 꼴이되 영상은 없습니다|좁은 폭에서는 버튼이 세로로 쌓입니다">마지막 CTA</button>

    </nav>
  </aside>

  <main class="proto-content">
    <div id="screen"><iframe title="화면 미리보기"></iframe></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var ES='estimate.html';

  /* 시나리오 이름이 가리키는 자리를 열자마자 보여 준다. 내려가는 길을 적어 두고
     직접 밟게 하면, 그 자리를 보러 온 사람이 매번 같은 스크롤을 되풀이하게 된다.
     거르개 상태는 화면이 ?emp= · ?only= · ?price= 로 이미 받으므로 주소로 넘기고,
     여기서는 '어디를 보여 줄지'만 정한다 — 견적 화면에는 손대지 않는다 */
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* 화면 전체에 scroll-behavior:smooth 가 걸려 있다. 그대로 두면 열 때마다
     한참 미끄러져 내려가므로, 옮기는 동안만 끄고 되돌린다 */
  function jump(d,sel,off){
    var e=d.querySelector(sel); if(!e) return;
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    d.defaultView.scrollTo(0, e.getBoundingClientRect().top + d.defaultView.scrollY - (off||0));
    root.style.scrollBehavior=prev;
  }

  var S={
    /* 탭 — 주소의 ?type= 이 곧 탭이다 */
    'tb-첫진입'  :{url:ES},
    'tb-전자카드':{url:ES+'?type=B'},
    'tb-안면인식':{url:ES+'?type=C'},
    'tb-바꾸기'  :{url:ES, act:async function(d){
      jump(d,'.es-cat:nth-of-type(4)', 8); await wait(200);
      var c=d.querySelector('#tab-C'); if(c) c.click(); }},

    /* A 탭 — 서비스 두 장. 금액은 적지 않고 견적신청으로 넘긴다 */
    'pl-서비스':{url:ES, act:function(d){ jump(d,'#plans'); }},

    /* A 탭 — 기능 비교표. 거르개는 주소가 건다 */
    'ft-전체'  :{url:ES,                          act:function(d){ jump(d,'#features'); }},
    'ft-일용'  :{url:ES+'?emp=daily',             act:function(d){ jump(d,'#features'); }},
    'ft-상용'  :{url:ES+'?emp=regular',           act:function(d){ jump(d,'#features'); }},
    'ft-차이'  :{url:ES+'?only=1',                act:function(d){ jump(d,'#features'); }},
    'ft-겹침'  :{url:ES+'?emp=regular&only=1',    act:function(d){ jump(d,'#features'); }},

    /* 머리줄이 붙는 것은 표 한가운데로 들어가야 보인다 — 네 번째 카테고리에 세운다 */
    'ft-머리줄':{url:ES, act:function(d){ jump(d,'.es-cat:nth-of-type(4)', 8); }},

    /* 탭 밖 — 어느 탭에서나 같은 자리 */
    'fq-열림'  :{url:ES, act:async function(d){
      jump(d,'.es-faq'); await wait(60);
      var all=d.querySelectorAll('.faq details');
      if(all[1]){ all[1].open=true; } }},
    'cta-마지막':{url:ES, act:function(d){ jump(d,'.es-cta'); }}
  };

  function open(name){
    var s=S[name]; if(!s) return;
    var f=$('#screen iframe'); if(!f) return;
    f.onload=function(){
      if(!s.act) return;
      /* 그새 다른 시나리오로 옮겨 갔으면 손대지 않는다 */
      var now=document.querySelector('.proto-nav-btn.is-active');
      if(now && now.dataset.scenario!==name) return;
      try{ s.act(f.contentDocument); }catch(e){}
    };
    f.src=s.url+(s.url.indexOf('?')<0?'?':'&')+'_t='+Date.now();
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/components.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});
  /* components.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
