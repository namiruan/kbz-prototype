<!-- design-system: v1.0.0 -->
<!-- prototype: 견적받기 — 조건별 화면 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적받기 프로토타입</title>
<meta name="description" content="탭과 고른 것에 따라 달라지는 견적받기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     components.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(견적신청 프로토타입과 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">탭 세 가지</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">첫 진입</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="tb-첫진입"
        data-why="이 페이지는 세 가지 상품의 견적을 탭으로 나눠 받습니다 — 김반장 3.0·프리미엄(프로그램), 퇴직공제 전자카드 단말기, 안면인식 출퇴근관리 단말기. 금액을 세는 단위가 서로 다르기 때문입니다 — 프로그램은 사업장 하나를 기준으로, 단말기는 현장마다 몇 대인지로 매깁니다."
        data-steps="페이지를 연 직후, 아무것도 클릭하지 않은 상태"
        data-look="주소에 ?type= 이 없으면 프로그램 탭이 열립니다. 탭별 값은 program · ecard · face 입니다">프로그램</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-전자카드"
        data-why="이 탭에는 따로 만든 화면이 없습니다. 퇴직공제 전자카드 단말기에는 이미 견적 페이지가 있어, 그 페이지를 iframe으로 끼웠습니다."
        data-steps="퇴직공제 전자카드 단말기 탭을 연 상태 — 주소에 ?type=ecard 를 붙여도 같습니다"
        data-look="탭 아래가 통째로 견적 화면입니다. 끼운 화면의 헤더는 접히고 탭이 그 이름을 대신합니다|스크롤바가 하나뿐입니다 — 바깥 페이지가 안쪽 높이를 재서 iframe을 늘립니다">퇴직공제 전자카드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-안면인식"
        data-why="안면인식 출퇴근관리 단말기 탭도 같은 방식으로, 따로 만들어 둔 견적 페이지를 iframe으로 끼웁니다. 두 단말기 화면은 앞쪽 섹션 구성이 다릅니다 — 퇴직공제 전자카드는 '단말기 선택'과 '견적 조건'이 나뉘고, 안면인식은 '현장별 견적 조건' 하나입니다. '신청자 정보'부터 뒤는 같습니다."
        data-steps="안면인식 출퇴근관리 단말기 탭을 연 상태 — 주소에 ?type=face 를 붙여도 같습니다"
        data-look="'김반장 이용 중이신가요?'는 이 화면에만 있습니다">안면인식 출퇴근관리</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">끼운 틀의 높이</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-늘어남"
        data-why="iframe 높이가 안쪽 내용을 계속 따라가는지 봅니다. 현장을 더해 가는 필드는 안면인식 쪽에만 있어 이 탭에서 봅니다."
        data-steps="안면인식 출퇴근관리 단말기 탭에서 '현장 추가'를 두 번 클릭한 상태"
        data-look="현장이 늘어난 만큼 iframe도 같이 길어집니다|iframe 안에 스크롤바가 생기지 않습니다. 페이지 스크롤 하나로 끝까지 내려갑니다">현장을 더하면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-완료"
        data-why="높이는 줄어들 때도 맞아야 합니다. 신청을 보내고 나면 폼이 사라지고 안내만 남습니다. 완료 화면은 어느 탭에나 있고 같은 일이 벌어집니다 — 여기서는 안면인식 탭에서 봅니다."
        data-steps="안면인식 출퇴근관리 단말기 탭에서 신청을 보낸 상태 — 채우고 클릭하는 길은 건너뛰고 끼운 화면만 완료로 열었습니다"
        data-look="iframe이 내용에 맞게 줄어듭니다|@{.es-faq} 탭 바와 궁금한 점 사이에 빈 자리가 남지 않습니다|완료 카드에는 '다시 신청하기'만 남습니다. 혼자 열린 화면에 있는 '메인으로'는 탭 안에서 숨깁니다">완료 화면이 되면</button>

      <span class="proto-nav-group-label">프로그램 · 내 상황엔 어떤 서비스가 맞을까?</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-고르기전"
        data-why="김반장 3.0과 김반장 프리미엄 중 사업장에게 적합한 서비스를 고를 수 있도록 만든 체크리스트입니다. 항목은 두 상품이 하는 일을 사업장이 겪는 일로 바꿔 적은 것으로, 앞쪽은 3.0 이 하는 일, 뒤쪽은 프리미엄에만 있는 일입니다."
        data-steps="'항목 체크하기'로 목록을 편 뒤 아무것도 고르지 않은 상태"
        data-look="@{.es-pick-list} 항목이 전폭 2단으로 놓이고, 답은 마지막 항목 아래 가로 바입니다|@{.es-pick-out} 고르기 전에는 추천 뱃지도 화살표 링크도 없고, '해당하는 것을 골라 보세요'가 적힙니다|'아무것도 해당 없음'과 '아직 안 봤음'은 다른 상태입니다. 한 번이라도 손대야 답이 나옵니다">고르기 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-프리미엄"
        data-why="프리미엄 항목이 하나라도 끼면 답은 프리미엄입니다. 3.0 항목을 함께 골랐어도 마찬가지입니다. 3.0 이 하는 일은 프리미엄도 그대로 하기 때문에, 둘을 함께 고른 사람에게는 프리미엄 하나로 둘 다 됩니다."
        data-steps="3.0 항목('며칠씩 걸리던 급여 계산, 자동화가 필요합니다')과 프리미엄 항목('매달 조마조마한 4대보험·퇴직공제 신고, 전문적인 도움이 필요합니다')을 함께 고른 상태"
        data-look="@{#esPickSeal} '추천!' 뱃지가 붙습니다|@{#esPickRec} 제목이 '김반장 프리미엄 추천'으로 바뀝니다|@{#esPickWhy} 답 줄은 고른 항목의 사정을 그 일을 맡는 기능 이름으로 바꿔 부릅니다 — '근로자 신고 대행은 이제 김반장 프리미엄에 맡기세요'|@{.es-pick-out} 클릭 영역은 바 전체입니다. 오른쪽 끝 화살표만이 아닙니다|@sm @md @{.es-pick-out} 답 바가 화면 아래에 붙어 따라다니고, 목록 끝까지 내려가면 제자리에 내려앉습니다 — 화면 폭 820px 아래에서만 그럽니다|클릭하면 위 폼으로 올라가면서 계약 유형까지 프리미엄으로 맞춰집니다">프리미엄이 나오는 자리</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-30"
        data-why="고른 것이 전부 3.0 이 하는 일이면 답은 3.0 입니다. 추천일 뿐이라 위 폼의 계약 유형은 손으로 바꿀 수 있습니다."
        data-steps="3.0 항목을 모두 고른 상태"
        data-look="@{#esPickRec} 제목이 '김반장 3.0 추천'으로 바뀝니다|@{#esPickWhy} 답 줄은 고른 항목을 모두 부르고 '이제 김반장 3.0으로 자동화 하세요'로 끝납니다">3.0 이 나오는 자리</button>

      <span class="proto-nav-group-label">프로그램 · 견적신청 폼</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-기본"
        data-why="계약 유형 기본값은 프리미엄입니다. 프리미엄 신청을 기본으로 유도하려는 의도입니다."
        data-steps="페이지를 연 직후, 아무것도 고르지 않은 상태"
        data-look="@{.pq-types} 계약 유형은 '김반장 프리미엄'이 기본입니다|@lg @md @sm @{.pq-help} 유형 카드에는 이름만 적히고, 설명은 이름 옆 물음표에 들어갑니다 — 넓은 폭은 호버하면 툴팁으로 뜨고, 모바일은 클릭해야 카드 안에서 펼쳐집니다|사업장 규모는 입력 필드(연 매출액·연 노무비·연 현장 수·월평균 현장 수·현장당 인원 수)와 라디오 버튼(종합면허·키스콘·상용근로자)으로 이뤄집니다. 연 매출액을 뺀 나머지는 프리미엄에서만 묻습니다 — 금액에는 들어가지 않고 폼과 함께 보냅니다|사업장 규모에서 (필수)는 '연 매출액'과 '연 현장 수'에만 붙습니다. 화면의 금액은 연 매출액 하나로 정해집니다|@{.q-sum-total} 요약은 '총 예상 견적'이고, 매출액을 넣기 전에는 '0원'입니다">프리미엄으로 열린 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-3.0으로"
        data-why="계약 유형에 따라 묻는 것이 달라집니다. 사업장 규모에서 3.0 이 묻는 것은 연 매출액뿐이고, 프리미엄 전용 필드는 숨으면서 필수 표시도 함께 풀립니다."
        data-steps="항목 체크에서 3.0 항목 하나('며칠씩 걸리던 급여 계산, 자동화가 필요합니다')만 고른 상태"
        data-look="@{.pq-types} 계약 유형이 '김반장 3.0' 으로 옮겨 가 있습니다|묻는 필드가 연 매출액 하나만 남습니다|iframe도 그만큼 짧아집니다">3.0 으로 바뀐 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-금액"
        data-why="연 매출액 필드가 요금 구간을 정하고, 그 구간이 금액을 정합니다. 다만 화면에서는 끝까지 계산하지 않고 최소 얼마부터인지만 적습니다. 실제 청구에는 계약 조건과 그때의 정책이 더 붙어서, 여기서 한 숫자로 못 박으면 받아 본 견적서와 어긋나기 때문입니다. ⚠ 받은 요금표의 4구간 할인가(117만원)는 나머지 구간이 따르는 규칙으로는 171만원입니다 — 월정액을 원본으로 삼아 계산했습니다."
        data-steps="연 매출액 70억(700,000만원)을 넣고 요약의 총액 행을 편 상태"
        data-look="@{.q-sum-total} 총액 자리는 '월 150,000원~'입니다|필드는 만 원 단위로 받고, 넣는 동안 아래에 '70억 원'으로 되읽어 줍니다|@{.q-sum-mid-body} 펼친 내역은 무엇 · 어떻게 나온 금액인지 · 얼마로 나뉩니다|프리미엄에서만 붙는 것 — 첫 줄 '프리미엄 이용료', 그 아래 '김반장 3.0 이용료' 줄(금액 자리가 '무료'), 총액 아래 '김반장 3.0 이용료 포함'">총 예상 견적</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-연납"
        data-why="연납을 고르면 5% 가 깎입니다. 그런데 비율만 적어 두면 얼마가 깎이는 것인지 보는 사람이 머릿속에서 한 번 더 계산해야 합니다. 그래서 고르기 전에 깎이는 몫을 돈으로 옮겨 툴팁에 적어 둡니다. 고르고 난 뒤에 알려 주면 이미 고른 사람에게 하는 말이라 늦습니다."
        data-steps="연 매출액 70억(700,000만원)을 넣고 월납에서 연납으로 바꾼 상태"
        data-look="@{.pq-save} 월납일 때만 '연납 시 90,000원 절약!' 툴팁이 뜹니다. 오른쪽에 붙고 꼬리가 연납 쪽을 가리킵니다|@{.q-sum-disc} 연납을 클릭하면 툴팁이 사라지고 그 자리를 할인 블록이 채웁니다|@{.q-sum-disc} 할인 블록에는 비율만 적습니다. 돈으로 옮긴 말은 툴팁 한 곳에서만 합니다|@{.q-sum-total} 총액 단위가 '월'에서 '연'으로 바뀌고, 위에 '할인 전' 금액이 취소선으로 붙습니다">연납으로 바꾸면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-막힘"
        data-why="비어 있는 필수 필드가 있으면 신청 버튼이 막히고, 무엇이 비었는지 버튼 자리에 적습니다. 다만 그때 세는 것은 지금 화면에 보이는 필드뿐입니다. 계약 유형을 3.0 으로 두면 프리미엄에서만 묻는 필드가 숨는데, 숨은 필드까지 세어 막아 버리면 보이지도 않는 필드 때문에 막힌 사람이 고칠 데를 찾을 수 없습니다."
        data-steps="계약 유형을 '김반장 3.0' 으로 바꾸고 연 매출액만 채운 채 견적신청하기를 클릭한 상태"
        data-look="@{.q-sum-submit} 연 매출액이 비어 있으면 버튼이 '연 매출액을 입력해 주세요'로 막힙니다|신청자 정보는 필드 아래에 한 줄씩 막는 말이 붙습니다|'연 현장 수'는 끼지 않습니다. 3.0 에서는 숨은 필드입니다|화면이 첫 빈 필드로 내려갑니다">신청이 막힐 때</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-완료"
        data-why="신청을 보내고 난 화면입니다. 단말기 두 탭의 완료 화면과 같은 모습이고, 남는 내용이 줄어든 만큼 iframe 높이도 함께 줄어듭니다."
        data-steps="프로그램 탭에서 신청을 보낸 상태 — 채우고 클릭하는 길은 건너뛰고 폼을 완료로 열었습니다"
        data-look="@{.q-done} 폼과 요약이 사라지고 안내만 남습니다|끼운 화면의 헤더는 접힙니다. 보냈다는 말은 완료 카드가 합니다|iframe이 내용에 맞게 줄어듭니다|완료 카드에는 '다시 신청하기'만 남습니다. 혼자 열린 화면에 있는 '메인으로'는 탭 안에서 숨깁니다|'다시 신청하기'를 클릭하면 폼으로 되돌아가고 iframe도 도로 커집니다">신청을 보낸 뒤</button>

      <span class="proto-nav-group-label">프로그램 · 상세 기능</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-전체"
        data-why="견적을 신청할 수 있는 두 선택지의 상세 기능을 보여 줍니다. 기능을 섹션으로 나눈 아코디언이고, 섹션마다 기능 행이 있습니다."
        data-steps="상세 기능까지 내려온 상태"
        data-look="표 전체 ▸ 아코디언 섹션은 펴진 채로 있는 게 기본값입니다|표 전체 ▸ @sm @{.es-why} 행 설명이 이름 옆 물음표로 접힙니다 — 클릭해서 폅니다|섹션과 행 ▸ @{.es-cat-h} 섹션 헤더 전체가 여닫기 토글입니다|섹션과 행 ▸ @{.es-cat} 섹션 안에서 행은 공통 → 일용직 → 상용직 순으로 놓입니다|태그 ▸ @{.es-tag} [일용직]·[상용직] 태그는 그 행이 어느 현장 것인지 적는 표시입니다. 거르는 필터가 아닙니다|프리미엄 열 ▸ @{.es-row[data-tier='prem']} 프리미엄 전용 행은 3.0 셀이 '—'입니다|프리미엄 열 ▸ @{.es-fee} 별도 요금 행은 프리미엄 셀의 ✓를 테두리만 남기고 그 아래 '별도 요금'을 적습니다">전체 보기</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">표가 길 때</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-접기"
              data-why="섹션을 모두 접었을 때 표가 어떤 모습이 되는지 봅니다. 필요한 섹션만 남기고 나머지는 접을 수 있습니다."
              data-steps="섹션을 모두 닫은 상태"
              data-look="@{.es-cat-h} 접힌 섹션은 헤더 한 줄로 남습니다|@{.es-cmp} 모두 접으면 표가 섹션 이름만 남은 목차가 됩니다|접힌 섹션에는 선 하나를 긋습니다">섹션을 접으면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-머리줄"
        data-why="표는 한 화면에 들어오지 않습니다. 열 이름이 적힌 테이블 헤더까지 같이 흘러가 버리면, 표 한가운데서 보고 있는 체크가 3.0 것인지 프리미엄 것인지 알 수 없습니다. 그래서 테이블 헤더만 화면 위에 붙여 둡니다. 헤더가 붙어 있는 동안에는 탭 바가 비켜 줍니다. 둘이 같이 붙으면 화면 위쪽을 둘이 차지해 표가 보이는 자리가 줄어들기 때문입니다. 다만 표를 벗어난 자리에서는 탭 바를 건드리지 않습니다. 표 밖에서까지 탭이 사라지면 어느 상품을 보고 있는지 알 길이 없습니다."
        data-steps="표 안쪽(마지막 섹션 「프리미엄 전용 창구」 언저리)까지 내려온 상태"
        data-look="@{.es-cmp-head} 열 이름이 화면 맨 위에 붙어 따라옵니다|@{.es-cmp-head} ‘기능’ 옆에 지금 보고 있는 섹션 이름이 뜹니다|@sm ‘기능’을 접고 섹션 이름만 남깁니다|@{.es-cmp-head} 3.0·프리미엄 헤더 셀에 '견적 신청하기'가 들어갑니다|@{.es-cmp-head} 탭 바로 아래에 붙습니다 — 탭 높이만큼 내려갑니다|@sm 고정 헤더가 그대로 따라붙고, '김반장'을 떼고 '3.0'·'프리미엄'만 남깁니다. 신청 버튼은 숨습니다">테이블 헤더 고정</button>

      <span class="proto-nav-group-label">탭 밖 · 공통</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="fq-열림"
        data-why="신청 직전에 가장 많이 눌립니다. 이 페이지를 보다 생기는 오해를 바로잡는 물음만 남겼습니다. 구역은 탭 밖에 있어 어느 탭에서나 같은 자리에 서지만, 묻는 사람은 탭마다 다릅니다. 단말기 견적을 재러 온 사람에게 '프리미엄을 쓰면 3.0 이용료가 따로 붙나요'는 상관없는 물음입니다. 그래서 항목마다 어느 탭의 물음인지 적어 두고 그 탭에서만 보여 줍니다."
        data-steps="궁금한 점까지 내려와 두 번째 질문을 편 상태"
        data-look="@{.es-faq} 탭마다 그 탭에서 걸리는 항목만 남습니다|첫 항목은 처음부터 펴져 있습니다. 펴 두는 항목도 탭마다 다시 고릅니다|이미 펴 본 항목이 그 탭에도 있으면 그대로 둡니다|두 번째 질문을 펴도 첫 질문은 닫히지 않습니다">두 번째 질문을 펴면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="cta-마지막"
        data-why="끝까지 읽고도 고르지 못한 사람에게 남깁니다. 전화 버튼만으로는 지금 사람에게 말을 걸고 싶지 않은 사람이 할 수 있는 것이 없어, 전화와 소개서 두 길로 나눴습니다."
        data-steps="맨 아래까지 내려온 상태 — 탭을 바꿔 가며 소개서 카드를 봅니다"
        data-look="@{.es-cta} 카드는 '전화 문의하기'와 '서비스 소개서'입니다|소개서 카드는 통째로 클릭되지 않고, 소개서 항목을 하나씩 따로 클릭합니다|탭을 따라 소개서 목록이 바뀝니다 — 프로그램 탭은 3.0과 프리미엄, 단말기 탭은 그 단말기 것|신청이 아니라 다운로드라 내려받는 화살표(↓)를 답니다|@{.es-help} 이름 자리에 무엇을 하는지, 아래 줄에 어디로 가는지가 적힙니다 — '전화 문의하기 / 1588-3818'|전화는 실제 번호입니다(tel:15883818)|⚠ 받는 주소는 아직 없습니다. 그때까지 제자리(#help)를 가리켜 둡니다">맨 아래 다른 도움</button>

    </nav>
  </aside>

  <main class="proto-content">
    <div id="screen"><iframe title="화면 미리보기"></iframe></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var ES='estimate.html';

  /* 시나리오 이름이 가리키는 자리를 열자마자 보여 준다. 내려가는 길을 적어 두고
     직접 밟게 하면, 그 자리를 보러 온 사람이 매번 같은 스크롤을 되풀이하게 된다.
     화면이 주소로 받는 상태(?type= · ?plan= · ?price= 따위)는 주소로 넘기고,
     여기서는 '어디를 보여 줄지'만 정한다 — 견적 화면에는 손대지 않는다 */
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* 화면 전체에 scroll-behavior:smooth 가 걸려 있다. 그대로 두면 열 때마다
     한참 미끄러져 내려가므로, 옮기는 동안만 끄고 되돌린다 */
  function hit(el){ if(el) el.click(); }
  function put(el,v){ if(!el) return; el.value=v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true})); }

  /* 끼운 화면이 다 뜰 때까지 기다린다 — 고정 시간으로 짐작하면 느린 날에 빈손이다.
     ok 를 주면 그 조건까지 기다린다(완료 화면은 전송 흉내를 거쳐 2초쯤 걸린다) */
  async function inner(d,sel,ok){
    for(var i=0;i<60;i++){
      var fr=d.querySelector(sel), q=fr && fr.contentDocument;
      if(q && q.readyState==='complete' && q.body && q.body.children.length && (!ok || ok(q))) return q;
      await wait(100);
    }
    return null;
  }

  /* ⚠ 패널 id(panel-program · panel-ecard · panel-face)를 시나리오가 직접
        적어 두면, 그 이름을 바꾸는 날 여기도 같이 고쳐야 한다. 한쪽만 고쳐진
        채로 캐시가 섞이면 querySelector 가 빈손으로 돌아오고, 시나리오는
        아무 말 없이 멈춘다 — 화면은 떴는데 아무 일도 안 일어난 것처럼 보인다.
        지금 열려 있는 탭의 패널은 hidden 이 아닌 것 하나뿐이라, 이름 대신
        그 사실로 가리킨다. 탭이 더 늘어도, 이름이 또 바뀌어도 따라온다 */
  var PANEL = '.es-panel:not([hidden])';
  var FRAME = PANEL + ' .es-frame';

  function jump(d,sel,off){
    var e=d.querySelector(sel); if(!e) return;
    var w=d.defaultView; if(!w) return;   /* 그새 틀이 갈려 나갔으면 잴 것이 없다 */
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    w.scrollTo(0, e.getBoundingClientRect().top + w.scrollY - (off||0));
    root.style.scrollBehavior=prev;
  }

  var S={
    /* 탭 — 주소의 ?type= 이 곧 탭이다(program · ecard · face) */
    'tb-첫진입'  :{url:ES},
    'tb-전자카드':{url:ES+'?type=ecard'},
    'tb-안면인식':{url:ES+'?type=face'},

    /* 끼운 틀이 안쪽을 따라 움직이는지 — 이 구조에서 제일 깨지기 쉬운 자리다 */
    'tb-늘어남'  :{url:ES+'?type=face', act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      hit(q.querySelector('#btnAddSite')); await wait(150);
      hit(q.querySelector('#btnAddSite')); await wait(400);
      jump(d,PANEL); }},
    'tb-완료'    :{url:ES+'?type=face', act:async function(d){
      var fr=d.querySelector(FRAME); if(!fr) return;
      await inner(d,FRAME);
      /* 폼을 끝까지 채워 보내는 길은 견적 프로토타입이 이미 보여 준다.
         여기서 볼 것은 '틀이 줄어드는가' 하나라, 그 화면이 아는 지름길을 쓴다 */
      fr.setAttribute('src','face-quote.html?done=1&_t='+Date.now());
      /* 완료 화면은 전송 흉내를 거쳐 뜬다 — 그 자리까지 기다려야 틀이 줄어든 꼴을 본다 */
      await inner(d,FRAME, function(q){ return q.body.classList.contains('is-done'); });
      await wait(300); jump(d,PANEL); }},
    /* 프로그램 탭 — 고르면 답이 나오는 항목 체크. 금액은 적지 않고 견적신청으로 넘긴다 */
    /* 열 줄은 접은 채로 서므로, 고르는 자리를 보여 주려면 먼저 펴야 한다 */
    'pl-고르기전':{url:ES, act:function(d){ hit($('#esPickToggle',d)); jump(d,'#plans'); }},
    'pl-프리미엄':{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      var box=d.querySelectorAll('.es-pick-item input');
      /* 3.0 줄(0) 을 먼저 고르고 프리미엄 줄(4) 을 더한다 — 답이 뒤집히는 자리다 */
      hit(box[0]); await wait(400); hit(box[4]); await wait(250);
      jump(d,'#plans'); }},
    'pl-30'    :{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      /* 3.0 줄 넷만 고른다 — 이제 3.0 은 미응답이 아니라 골라서 나오는 답이다 */
      var box=d.querySelectorAll('.es-pick-item input');
      hit(box[0]); hit(box[1]); hit(box[2]); hit(box[3]); await wait(250);
      jump(d,'#plans'); }},

    /* 프로그램 탭 — 상세 기능 */
    'ft-전체'  :{url:ES,                          act:function(d){ jump(d,'#features'); }},

    /* 섹션을 접은 자리 — 기본은 펼침이라 여기서는 넷을 모두 눌러 접는다 */
    'ft-접기'  :{url:ES, act:function(d){
      d.querySelectorAll('.es-cat-t').forEach(function(t){ t.click(); });
      jump(d,'#features'); }},

    /* 고정 헤더가 붙는 것은 표 한가운데로 들어가야 보인다 — 네 번째 섹션에 세운다 */
    'ft-머리줄':{url:ES, act:function(d){ jump(d,'.es-cat:nth-of-type(4)', 8); }},

    /* 프로그램 탭 — 끼워 둔 견적신청 폼. 항목 체크가 그 토글을 돌린다 */
    'ap-기본'   :{url:ES, act:async function(d){
      await inner(d,FRAME); jump(d,'#apply',8); }},
    'ap-3.0으로' :{url:ES, act:async function(d){
      await inner(d,FRAME);
      /* 3.0 줄 하나면 답이 3.0 으로 서고, 그 답이 위 폼의 계약 유형까지 내린다 */
      hit(d.querySelectorAll('.es-pick-item input')[0]); await wait(400);
      jump(d,'#apply',8); }},
    'ap-금액'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(200);
      var t=q.querySelector('#sumMid'); if(t) t.open=true; await wait(150);
      jump(d,'#apply',8); }},
    'ap-연납'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(250);
      hit(q.querySelector('.pq-cycle input[value=year]')); await wait(250);
      jump(d,'#apply',8); }},
    'ap-막힘'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      /* 숨은 칸 이야기라 3.0 으로 내려 두고 눌러야 뜻이 선다 */
      hit(q.querySelector('.pq-type input[value=c30]')); await wait(250);
      /* 매출액은 채운다 — 비어 있으면 버튼이 막혀 눌러도 아무 일이 없다.
         막는 말을 보려면 먼저 누를 수 있어야 한다 */
      var sales=q.querySelector('#q-sales');
      sales.value='300000'; sales.dispatchEvent(new Event('input',{bubbles:true}));
      await wait(250);
      hit(q.querySelector('#agree')); await wait(100);
      hit(q.querySelector('#btnSubmit')); await wait(400);
      jump(d,'#apply',8); }},
    'ap-완료'   :{url:ES, act:async function(d){
      var fr=d.querySelector(FRAME); if(!fr) return;
      await inner(d,FRAME);
      fr.setAttribute('src','plan-quote.html?plan=prem&done=1&_t='+Date.now());
      await inner(d,FRAME, function(q){ return q.body.classList.contains('is-done'); });
      await wait(400); jump(d,'#apply',8); }},

    /* 탭 밖 — 어느 탭에서나 같은 자리 */
    'fq-열림'  :{url:ES, act:async function(d){
      jump(d,'.es-faq'); await wait(60);
      var all=d.querySelectorAll('.faq details');
      if(all[1]){ all[1].open=true; } }},
    'cta-마지막':{url:ES, act:function(d){ jump(d,'.es-cta'); }}
  };

  /* 몇 번째로 연 시나리오인지 우리가 센다.
     ⚠ 전에는 '.proto-nav-btn.is-active' 를 읽어 그새 다른 시나리오로 옮겨 갔는지
        판정했다. 그 클래스는 우리만 쓰는 것이 아니다 — 크롬도 markNav() 로 같은
        버튼들을 켜고 끈다. 우리가 틀을 싣고 load 를 기다리는 사이에 크롬이 한 번
        더 손대면, 우리가 연 시나리오인데도 '다른 것으로 옮겨 갔다'로 읽혀 act 가
        그대로 return 한다. 화면은 떴는데 눌러야 할 것을 아무도 누르지 않은 꼴이
        되고, 콘솔에는 한 줄도 남지 않는다.
        남의 DOM 을 읽어 판정하지 않는다. 우리가 센 번호가 아직 최신인지만 본다 */
  var seq = 0;

  function open(name){
    var s=S[name]; if(!s) return;
    var f=$('#screen iframe'); if(!f) return;
    var mine = ++seq;
    f.onload=function(){
      if(mine !== seq) return;      /* 그새 다른 시나리오를 열었다 */
      if(!s.act) return;
      /* ⚠ 삼키지 않는다. 시나리오가 못 찾는 것이 생기면 조용히 아무 일도
            일어나지 않아, 고장인지 원래 그런지조차 가릴 수 없었다 */
      try{ s.act(f.contentDocument); }
      catch(e){ console.error('[시나리오] ' + name + ' 를 그리다 멈췄습니다', e); }
    };
    f.src=s.url+(s.url.indexOf('?')<0?'?':'&')+'_t='+Date.now();
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/components.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});
  /* components.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
