<!-- design-system: v1.0.0 -->
<!-- prototype: 견적받기 — 조건별 화면 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적받기 프로토타입</title>
<meta name="description" content="탭과 고른 것에 따라 달라지는 견적받기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교·링크 복사·원본 링크)은
     proto-chrome.js 의 initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(견적신청 프로토타입과 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>

  <!-- **다음 겹을 미리 당겨 둔다.** 미리보기는 문서가 넷(바깥 → 틀 → 화면 → 끼운 화면)
       겹으로 **차례차례** 선다 — 부모가 다 받고 JS 를 돌린 뒤에야 자식이 요청을 시작한다.
       그 직렬 왕복이 흰 화면의 길이였다. 1겹에서 미리 받아 두면 3·4겹은 캐시에서 꺼낸다.
       prefetch 라 지금 화면의 렌더를 막지 않는다. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- ⚠ 주소는 화면이 실제로 부르는 것과 글자까지 같아야 한다. ?v= 를 빼고
       적어 두면 받아는 두되 아무도 그 주소를 찾지 않아 통째로 헛걸음이다.
       화면(.html)은 여기서 받아 두지 않는다 — 틀에 끼울 때 _t 가 붙어
       주소가 달라지므로 무엇을 적어도 맞지 않는다 -->
  <link rel="prefetch" href="assets/base.css?v=1" as="style">
  <link rel="prefetch" href="assets/estimate.css?v=2" as="style">
  <link rel="prefetch" href="assets/select.css?v=1" as="style">
  <link rel="prefetch" href="assets/quote-common.css?v=2" as="style">
  <link rel="prefetch" href="assets/plan-quote.css?v=26" as="style">
  <link rel="prefetch" href="assets/kbd.css?v=1" as="style">
  <link rel="prefetch" href="assets/quote.css?v=1" as="style">
  <link rel="prefetch" href="assets/face-quote.css?v=1" as="style">
  <link rel="prefetch" href="assets/estimate.js?v=2" as="script">
  <link rel="prefetch" href="assets/format.js?v=1" as="script">
  <link rel="prefetch" href="assets/select.js?v=1" as="script">
  <link rel="prefetch" href="assets/kbd.js?v=1" as="script">
  <link rel="prefetch" href="assets/plan-quote.js?v=17" as="script">
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">탭 세 가지</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">첫 진입</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="tb-첫진입"
        data-why="김반장 3.0·프리미엄, 퇴직공제 전자카드 단말기, 안면인식 출퇴근관리 단말기를 탭으로 갈라 견적을 받는 화면입니다."
        data-steps="페이지를 연 직후, 아무것도 클릭하지 않은 상태"
        data-look="
          |주소에 ?type= 이 없으면 프로그램 탭이 열립니다
          |?type= 값은 program · ecard · face 입니다">프로그램</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-전자카드"
        data-why="퇴직공제 전자카드 단말기 견적 화면을 iframe으로 끼운 탭입니다."
        data-steps="퇴직공제 전자카드 단말기 탭을 연 상태"
        data-look="
          |iframe 안 페이지의 헤더는 접힙니다
          |스크롤바가 하나뿐입니다">퇴직공제 전자카드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-안면인식"
        data-why="안면인식 출퇴근관리 단말기 견적 화면을 iframe으로 끼운 탭입니다."
        data-steps="안면인식 출퇴근관리 단말기 탭을 연 상태"
        data-look="
          |견적 조건은 '현장별 견적 조건' 섹션 하나입니다
          |'김반장 이용 중이신가요?'는 이 탭에만 있습니다">안면인식 출퇴근관리</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">끼운 틀의 높이</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-늘어남"
        data-why="현장을 더해 iframe 높이가 따라 늘어난 화면입니다."
        data-steps="안면인식 출퇴근관리 단말기 탭에서 '현장 추가'를 두 번 클릭한 상태"
        data-look="
          |현장이 늘어난 만큼 iframe도 같이 길어집니다
          |페이지 스크롤 하나로 끝까지 내려갑니다">현장을 더하면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-완료"
        data-why="신청을 보내 폼이 사라지고 안내만 남은 화면입니다."
        data-steps="안면인식 출퇴근관리 단말기 탭에서 신청을 보낸 상태"
        data-look="
          |iframe이 내용에 맞게 줄어듭니다
          |@{.es-faq} 탭 바와 궁금한 점 사이에 빈 자리가 남지 않습니다">완료 화면이 되면</button>

      <span class="proto-nav-group-label">프로그램 · 견적신청 폼</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-기본"
        data-why="계약 유형이 '김반장 프리미엄'으로 열린 견적신청 폼 화면입니다."
        data-steps="페이지를 연 직후, 아무것도 고르지 않은 상태"
        data-look="
          |@{.pq-types} 계약 유형은 '김반장 프리미엄'이 기본입니다
          |@sm @md @lg @{.pq-help} 유형 카드에는 이름만 적히고, 설명은 디바이스 사이즈마다 모바일은 물음표를 클릭해 카드 안에서, 태블릿·데스크톱은 호버 툴팁으로 노출됩니다
          |사업장 규모는 연 매출액·연 노무비·연 현장 수·월평균 현장 수·현장당 인원 수 입력폼과 면허 종류 세그먼트로 이뤄집니다
          |@{#scopeCard} 업무범위는 고르는 자리와 보는 자리가 한 표이고, 아무것도 체크되지 않은 채 열립니다
          |@{.pq-scope-tbl tr.opt .hd} 체크는 갈래 칸 안에, 그 업무가 들어갈 줄에 있습니다
          |연 매출액을 뺀 나머지는 프리미엄에서만 묻고 금액에는 들어가지 않습니다
          |사업장 규모에서 (필수)는 '연 매출액'과 '연 현장 수'에만 붙습니다
          |@{.q-sum-total} 요약은 '이용요금(예상)'이고, 매출액을 넣기 전에는 '0원'입니다">프리미엄으로 열린 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="sc-포함전"
        data-why="대행업무의 범위를 기본 업무에 더하는 섹션입니다."
        data-steps="프리미엄 폼의 업무범위까지 내려온 상태"
        data-look="
          |@{.pq-scope-tbl} 업무범위는 '갈래'와 '업무' 두 칸짜리 표 하나입니다
          |@{.pq-scope-tbl tbody th} 갈래 이름은 '사업장'·'일용근로자'·'상용근로자'·'퇴직공제'·'증명서' 다섯이 섭니다
          |@{.pq-scope-tbl tr.opt[data-pick='kiscon'] th} 늘 들어가는 업무가 없는 갈래는 이름 줄 없이 체크 줄만 섭니다
          |@{.pq-scope-tbl tbody th} 갈래 칸에는 갈래 이름이 서고, 고를 수 있는 줄에만 체크박스가 더 섭니다
          |@{.pq-scope-tbl tr.opt .tx} 체크박스 옆에는 갈래 이름을 뺀 '건강·연금 추가' 가 섭니다
          |@{.pq-scope-tbl tr.opt:not(.is-on) td} 아직 체크하지 않은 줄은 바탕이 회색입니다
          |@{.pq-scope-tbl tr.opt .ws} 체크하기 전에도 그 체크로 들어올 업무가 적혀 있습니다
          |@{.pq-scope-tbl .w} 한 줄 안의 업무는 가로로 이어지고 사이를 실선 하나가 가릅니다">업무범위 — 포함 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="sc-포함뒤"
        data-why="선택 업무를 포함한 업무범위 화면입니다."
        data-steps="업무범위에서 '건강·연금 추가'와 '근로내역 추가'를 체크한 상태"
        data-look="
          |@{.pq-scope-tbl tr.opt.is-on .bx} 고른 체크박스는 브랜드 컬러로 채워집니다
          |@{.pq-scope-tbl tr.opt.is-on td} 체크한 줄은 회색 바탕이 걷히고 흰 바탕이 됩니다
          |@{.pq-scope-tbl tr.opt.is-on .ws} 같은 줄의 업무가 강조색으로 바뀝니다
          |@{.pq-scope-tbl tr.opt.is-on .nm} 그 선택 업무 이름도 강조색으로 바뀝니다
          |@{.pq-scope-tbl tbody tr} 표의 줄 수는 고르기 전과 같습니다">업무범위 — 포함한 뒤</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-3.0으로"
        data-why="계약 유형이 '김반장 3.0'으로 바뀐 견적신청 폼 화면입니다."
        data-steps="비교표 머리줄의 '김반장 3.0' 쪽 '견적 신청하기'를 클릭한 상태"
        data-look="
          |@{.pq-types} 계약 유형이 '김반장 3.0' 으로 옮겨 가 있습니다
          |사업장 규모에 연 매출액만 남고, 프리미엄 전용 입력폼은 (필수) 표시까지 함께 사라집니다
          |iframe도 그만큼 짧아집니다">3.0 으로 바뀐 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-금액"
        data-why="연 매출액을 넣어 이용요금이 선 화면입니다."
        data-steps="연 매출액 70억(700,000만원)을 넣고 요약의 총액 행을 편 상태"
        data-look="
          |@{.q-sum-total} 총액 자리는 '월 150,000원~'입니다
          |@{.pq-save} 월납이라 '연납 시 90,000원 절약!' 툴팁이 떠 있습니다
          |연 매출액은 만 원 단위로 받고, 넣는 동안 아래에 '70억 원'으로 되읽어 줍니다
          |@{.q-sum-mid-body} 프리미엄이면 '김반장 3.0 이용료' 행이 하나 더 붙고 금액 자리가 '무료'입니다">이용요금(예상)</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-연납"
        data-why="납부 주기를 연납으로 바꾼 화면입니다."
        data-steps="연 매출액 70억(700,000만원)을 넣고 월납에서 연납으로 바꾼 상태"
        data-look="
          |@{.q-sum-disc} 툴팁이 사라진 자리를 할인 블록이 채웁니다
          |@{#sumWasRow} '할인 전' 금액이 취소선으로 붙습니다
          |@{.q-sum-total} 총액 단위가 '월'에서 '연'으로 바뀝니다">연납으로 바꾸면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-막힘"
        data-why="필수 입력폼을 비운 채 신청해 오류가 난 화면입니다."
        data-steps="계약 유형을 '김반장 3.0' 으로 바꾸고 연 매출액만 채운 채 '견적신청하기'를 클릭한 상태"
        data-look="
          |@{.f-msg} 신청자 정보 입력폼마다 아래에 에러 메시지가 붙습니다
          |화면이 에러가 난 첫 입력폼으로 내려갑니다
          |숨은 입력폼은 에러 메시지에 끼지 않습니다">신청이 막힐 때</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-완료"
        data-why="신청을 보내고 난 화면입니다."
        data-steps="프로그램 탭에서 신청을 보낸 상태"
        data-look="
          |@{.q-done} 폼과 요약이 사라지고 안내만 남습니다
          |완료 화면에서도 iframe 안 헤더는 접힌 채입니다
          |완료 카드에는 '다시 신청하기'만 남습니다
          |'메인으로'는 탭 안에서 숨습니다
          |'다시 신청하기'를 클릭하면 폼이 도로 나오고 iframe이 커집니다">신청을 보낸 뒤</button>

      <span class="proto-nav-group-label">프로그램 · 상세 기능</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-전체"
        data-why="김반장 3.0과 프리미엄이 각각 무엇을 하는지 견주는 비교표 화면입니다."
        data-steps="상세 기능까지 내려온 상태"
        data-look="
          |섹션은 모두 펴진 채로 열립니다
          |@sm @{.es-why} 행 설명은 이름 옆 물음표를 클릭해야 펴집니다
          |@{.es-cat-t} 섹션 제목 줄 전체가 여닫기 버튼입니다
          |@{.es-cat} 섹션 안에서 행은 공통 → 일용직 → 상용직 순으로 놓입니다
          |@{.es-tag} [일용직]·[상용직] 태그는 거르는 필터가 아니라 그 기능이 어느 고용형태에 걸리는지 적는 표시입니다
          |@{.es-mark.off} 프리미엄 전용 행의 3.0 셀은 체크 대신 가로줄 하나로 표기합니다
          |@{.es-fee} 별도 요금 행은 프리미엄 셀의 ✓를 테두리만 남기고 그 아래 '별도 요금'을 적습니다">전체 보기</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">표가 길 때</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-접기"
        data-why="섹션을 모두 접어 제목만 남은 비교표 화면입니다."
        data-steps="섹션을 모두 닫은 상태"
        data-look="
          |@{.es-cat-h} 접힌 섹션은 제목 한 줄로 남고, 그 아래에 선이 하나 그어집니다">섹션을 접으면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ft-머리줄"
        data-why="비교표 머리줄이 탭 바 아래에 붙어 따라오는 화면입니다."
        data-steps="표 안쪽(마지막 섹션 「4대보험 전담팀 지원」 언저리)까지 내려온 상태"
        data-look="
          |@{.es-cmp-head} 열 이름이 탭 바 바로 아래에 붙어 따라옵니다
          |@{.es-cmp-head .now} 지금 보고 있는 섹션 이름이 뜹니다
          |@{.es-tabs} 탭 바는 아래로 스크롤하는 동안 숨고 위로 스크롤하면 돌아옵니다
          |@sm @{.es-cmp-head} 좁은 폭에서는 '제공 서비스'를 접고 '김반장'을 떼어 '3.0'·'프리미엄'만 적습니다
          |@sm @{.es-cmp-head} '견적 신청하기'는 숨습니다">테이블 헤더 고정</button>

      <span class="proto-nav-group-label">탭 밖 · 공통</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="fq-탭별"
        data-why="탭마다 다른 질문이 뜨는 궁금한 점 섹션입니다."
        data-steps="궁금한 점까지 내려와 두 번째 질문을 편 상태"
        data-look="
          |@{.faq} 처음 열면 그 탭의 첫 항목이 펴져 있습니다
          |@{.faq} 탭을 바꿔도 펴 둔 항목이 새 탭에 있으면 그대로 둡니다
          |두 번째 질문을 펴도 첫 질문이 열린 채 남습니다">탭마다 다른 질문</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="cta-마지막"
        data-why="전화와 서비스 소개서로 도움을 받는 맨 아래 섹션입니다."
        data-steps="맨 아래까지 내려온 상태"
        data-look="
          |@{.es-help} '전화 문의하기'는 카드 전체가 클릭 영역입니다
          |@{.es-help} '서비스 소개서'는 줄마다 따로 클릭합니다
          |탭을 바꾸면 소개서 목록이 그 탭의 상품 것으로 바뀝니다
          |전화는 실제 번호입니다(tel:15883818)
          |⚠ 받는 주소는 아직 없습니다. 그때까지 제자리(#help)를 가리켜 둡니다">맨 아래 다른 도움</button>

    </nav>
  </aside>

  <main class="proto-content">
    <div id="screen"><iframe title="화면 미리보기"></iframe></div>
  </main>
</div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var ES='estimate.html';

  /* 시나리오 이름이 가리키는 자리를 열자마자 보여 준다. 내려가는 길을 적어 두고
     직접 밟게 하면, 그 자리를 보러 온 사람이 매번 같은 스크롤을 되풀이하게 된다.
     화면이 주소로 받는 상태(?type= · ?plan= · ?price= 따위)는 주소로 넘기고,
     여기서는 '어디를 보여 줄지'만 정한다 — 견적 화면에는 손대지 않는다 */
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* 화면 전체에 scroll-behavior:smooth 가 걸려 있다. 그대로 두면 열 때마다
     한참 미끄러져 내려가므로, 옮기는 동안만 끄고 되돌린다 */
  function hit(el){ if(el) el.click(); }
  function put(el,v){ if(!el) return; el.value=v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true})); }

  /* 끼운 화면이 다 뜰 때까지 기다린다 — 고정 시간으로 짐작하면 느린 날에 빈손이다.
     ok 를 주면 그 조건까지 기다린다(완료 화면은 전송 흉내를 거쳐 2초쯤 걸린다) */
  async function inner(d,sel,ok){
    for(var i=0;i<60;i++){
      var fr=d.querySelector(sel), q=fr && fr.contentDocument;
      if(q && q.readyState==='complete' && q.body && q.body.children.length && (!ok || ok(q))) return q;
      await wait(100);
    }
    return null;
  }

  /* ⚠ 패널 id(panel-program · panel-ecard · panel-face)를 시나리오가 직접
        적어 두면, 그 이름을 바꾸는 날 여기도 같이 고쳐야 한다. 한쪽만 고쳐진
        채로 캐시가 섞이면 querySelector 가 빈손으로 돌아오고, 시나리오는
        아무 말 없이 멈춘다 — 화면은 떴는데 아무 일도 안 일어난 것처럼 보인다.
        지금 열려 있는 탭의 패널은 hidden 이 아닌 것 하나뿐이라, 이름 대신
        그 사실로 가리킨다. 탭이 더 늘어도, 이름이 또 바뀌어도 따라온다 */
  var PANEL = '.es-panel:not([hidden])';
  var FRAME = PANEL + ' .es-frame';

  /* 끼운 견적 화면 안의 요소로 내려간다. jump 은 바깥 문서만 재는데, 폼은
     한 겹 더 안에 있다. 틀이 내용 높이만큼 늘어나 있어 안쪽에는 구를 창이
     없으므로, 두 좌표를 더해 바깥을 굴리면 그 자리가 화면에 선다 */
  function jumpInner(d,sel,off){
    var fr=d.querySelector(FRAME); if(!fr) return;
    var q=fr.contentDocument, e=q && q.querySelector(sel); if(!e) return;
    var w=d.defaultView; if(!w) return;
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    w.scrollTo(0, fr.getBoundingClientRect().top + w.scrollY
                + e.getBoundingClientRect().top - (off||0));
    root.style.scrollBehavior=prev;
  }

  function jump(d,sel,off){
    var e=d.querySelector(sel); if(!e) return;
    var w=d.defaultView; if(!w) return;   /* 그새 틀이 갈려 나갔으면 잴 것이 없다 */
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    w.scrollTo(0, e.getBoundingClientRect().top + w.scrollY - (off||0));
    root.style.scrollBehavior=prev;
  }

  var S={
    /* 탭 — 주소의 ?type= 이 곧 탭이다(program · ecard · face) */
    'tb-첫진입'  :{url:ES},
    'tb-전자카드':{url:ES+'?type=ecard'},
    'tb-안면인식':{url:ES+'?type=face'},

    /* 끼운 틀이 안쪽을 따라 움직이는지 — 이 구조에서 제일 깨지기 쉬운 자리다 */
    'tb-늘어남'  :{url:ES+'?type=face', act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      hit(q.querySelector('#btnAddSite')); await wait(150);
      hit(q.querySelector('#btnAddSite')); await wait(400);
      jump(d,PANEL); }},
    'tb-완료'    :{url:ES+'?type=face', act:async function(d){
      var fr=d.querySelector(FRAME); if(!fr) return;
      await inner(d,FRAME);
      /* 폼을 끝까지 채워 보내는 길은 견적 프로토타입이 이미 보여 준다.
         여기서 볼 것은 '틀이 줄어드는가' 하나라, 그 화면이 아는 지름길을 쓴다 */
      fr.setAttribute('src','face-quote.html?done=1&_t='+Date.now());
      /* 완료 화면은 전송 흉내를 거쳐 뜬다 — 그 자리까지 기다려야 틀이 줄어든 꼴을 본다 */
      await inner(d,FRAME, function(q){ return q.body.classList.contains('is-done'); });
      await wait(300); jump(d,PANEL); }},
    /* 프로그램 탭 — 상세 기능 */
    'ft-전체'  :{url:ES,                          act:function(d){ jump(d,'#features'); }},

    /* 섹션을 접은 자리 — 기본은 펼침이라 여기서는 넷을 모두 눌러 접는다 */
    'ft-접기'  :{url:ES, act:function(d){
      d.querySelectorAll('.es-cat-t').forEach(function(t){ t.click(); });
      jump(d,'#features'); }},

    /* 고정 헤더가 붙는 것은 표 한가운데로 들어가야 보인다 — 네 번째 섹션에 세운다 */
    'ft-머리줄':{url:ES, act:function(d){ jump(d,'.es-cat:nth-of-type(4)', 8); }},

    /* 프로그램 탭 — 끼워 둔 견적신청 폼. 비교표 머리줄의 신청 버튼이 그 토글을 돌린다 */
    'ap-기본'   :{url:ES, act:async function(d){
      await inner(d,FRAME); jump(d,'#apply',8); }},
    /* 업무범위 — 폼 한 겹 안이라 jumpInner 로 내려간다 */
    'sc-포함전' :{url:ES, act:async function(d){
      await inner(d,FRAME); await wait(250); jumpInner(d,'#scopeCard',16); }},
    'sc-포함뒤' :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      ['daily_hp','retire'].forEach(function(id){
        hit(q.querySelector('tr.opt[data-pick="'+id+'"] .hd')); });
      await wait(350); jumpInner(d,'#scopeCard',16); }},
    'ap-3.0으로' :{url:ES, act:async function(d){
      await inner(d,FRAME);
      /* 머리줄의 3.0 쪽 신청 버튼이 폼의 계약 유형까지 내린다(esSetPlan) */
      hit(d.querySelector('.es-cmp-head a[data-plan="c30"]')); await wait(400);
      jump(d,'#apply',8); }},
    'ap-금액'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(200);
      var t=q.querySelector('#sumMid'); if(t) t.open=true; await wait(150);
      jump(d,'#apply',8); }},
    'ap-연납'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(250);
      hit(q.querySelector('.pq-cycle input[value=year]')); await wait(250);
      jump(d,'#apply',8); }},
    'ap-막힘'   :{url:ES, act:async function(d){
      var q=await inner(d,FRAME); if(!q) return;
      /* 숨은 칸 이야기라 3.0 으로 내려 두고 눌러야 뜻이 선다 */
      hit(q.querySelector('.pq-type input[value=c30]')); await wait(250);
      /* 매출액은 채운다 — 비어 있으면 버튼이 막혀 눌러도 아무 일이 없다.
         막는 말을 보려면 먼저 누를 수 있어야 한다 */
      var sales=q.querySelector('#q-sales');
      sales.value='300000'; sales.dispatchEvent(new Event('input',{bubbles:true}));
      await wait(250);
      hit(q.querySelector('#agree')); await wait(100);
      hit(q.querySelector('#btnSubmit')); await wait(400);
      jump(d,'#apply',8); }},
    'ap-완료'   :{url:ES, act:async function(d){
      var fr=d.querySelector(FRAME); if(!fr) return;
      await inner(d,FRAME);
      fr.setAttribute('src','plan-quote.html?plan=prem&done=1&_t='+Date.now());
      await inner(d,FRAME, function(q){ return q.body.classList.contains('is-done'); });
      await wait(400); jump(d,'#apply',8); }},

    /* 탭 밖 — 어느 탭에서나 같은 자리 */
    'fq-탭별'  :{url:ES, act:async function(d){
      jump(d,'.es-faq'); await wait(60);
      var all=d.querySelectorAll('.faq details');
      if(all[1]){ all[1].open=true; } }},
    'cta-마지막':{url:ES, act:function(d){ jump(d,'.es-cta'); }}
  };

  /* 몇 번째로 연 시나리오인지 우리가 센다.
     ⚠ 전에는 '.proto-nav-btn.is-active' 를 읽어 그새 다른 시나리오로 옮겨 갔는지
        판정했다. 그 클래스는 우리만 쓰는 것이 아니다 — 크롬도 markNav() 로 같은
        버튼들을 켜고 끈다. 우리가 틀을 싣고 load 를 기다리는 사이에 크롬이 한 번
        더 손대면, 우리가 연 시나리오인데도 '다른 것으로 옮겨 갔다'로 읽혀 act 가
        그대로 return 한다. 화면은 떴는데 눌러야 할 것을 아무도 누르지 않은 꼴이
        되고, 콘솔에는 한 줄도 남지 않는다.
        남의 DOM 을 읽어 판정하지 않는다. 우리가 센 번호가 아직 최신인지만 본다 */
  var seq = 0;

  /* 틀 안 화면은 HTML 이라 ?v= 를 달 수 없다. GitHub Pages 가 HTML 에
     max-age=600 을 주므로, 바깥을 새로고침해도 틀 안은 최대 10분 동안
     옛 화면이 그대로 나온다 — 글자는 바뀌었는데 새 섹션이 통째로 없는,
     콘솔에 한 줄도 안 남는 꼴이 된다.
     페이지를 열 때 토큰을 한 번만 만들어 주소에 붙인다. 시나리오를 오가는
     동안은 같은 주소라 받아 둔 것을 그대로 쓰고, 새로고침하면 새 토큰이라
     반드시 새로 받는다. estimate.js 의 fresh() 가 이 _t 를 받아 그 안에
     끼우는 견적 화면까지 이어 준다 */
  var BOOT = Date.now();
  function fresh(u){ return u + (u.indexOf('?') < 0 ? '?' : '&') + '_t=' + BOOT; }

  function open(name){
    var s=S[name]; if(!s) return;
    var f=$('#screen iframe'); if(!f) return;
    var mine = ++seq, phase = 0;   /* phase 0 = 비우는 중 · 1 = 화면 */
    f.onload=function(){
      if(mine !== seq) return;      /* 그새 다른 시나리오를 열었다 */
      if(phase === 0){ phase = 1; f.src = fresh(s.url); return; }
      if(!s.act) return;
      /* ⚠ 삼키지 않는다. 시나리오가 못 찾는 것이 생기면 조용히 아무 일도
            일어나지 않아, 고장인지 원래 그런지조차 가릴 수 없었다 */
      try{ s.act(f.contentDocument); }
      catch(e){ console.error('[시나리오] ' + name + ' 를 그리다 멈췄습니다', e); }
    };
    /* **비웠다가 넣는다.** 주소 끝에 `_t=` 를 붙여 매번 다르게 만들면 깨끗한 상태는
       얻지만 브라우저가 캐시를 한 번도 쓰지 못해, 시나리오를 옮길 때마다 화면과 그
       자산을 통째로 다시 받았다. about:blank 를 거치면 문서는 똑같이 새로 서면서
       받아 둔 것은 그대로 쓴다. 빈 문서에서도 load 가 한 번 오므로 단계를 나눠 둔다 — */
    if(f.src && f.src.indexOf('about:blank') < 0) f.src = 'about:blank';
    else { phase = 1; f.src = fresh(s.url); }
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/proto-chrome.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});
  /* proto-chrome.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
