<!-- design-system: v1.0.0 -->
<!-- prototype: 견적받기 — 조건별 화면 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적받기 프로토타입</title>
<meta name="description" content="탭과 고른 것에 따라 달라지는 견적받기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교)은 components.js 의
     initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(견적신청 프로토타입과 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
/* 원본 링크 버튼은 크롬의 「링크 복사」 바로 옆에 선다. .proto-share 는
   margin-left:auto 로 오른쪽 끝에 붙는데, 둘이 다 그러면 남는 자리를 나눠 가져
   하나는 툴바 한가운데로 밀려난다 — 같은 일(가져가기)을 하는 짝이라 붙어 있어야
   고르는 것으로 읽힌다 */
.proto-toolbar .proto-share + .proto-share{margin-left:0}
</style>
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">탭 세 가지</span>
      <span class="proto-nav-group-label proto-nav-group-label--sub">첫 진입</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="tb-첫진입"
        data-why="이 페이지는 세 가지 상품의 견적을 한곳에서 받습니다 — 김반장 3.0·프리미엄(프로그램), 퇴직공제 전자카드 단말기, 안면인식 출퇴근관리 단말기. 그런데 금액을 세는 단위가 서로 다릅니다. 프로그램은 사업장 하나를 기준으로, 단말기 둘은 현장마다 몇 대인지로 매깁니다. 그래서 탭으로 갈라 한 번에 하나만 보게 했습니다."
        data-steps="페이지를 엽니다 — 그 뒤로는 아무것도 누르지 않습니다"
        data-look="탭 셋이 머리글 바로 아래 섭니다|고른 탭만 파란 글씨와 밑줄을 갖습니다|탭은 상품 이름 한 줄뿐입니다|주소에 ?type= 이 없으면 A 입니다">A · 프로그램</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-전자카드"
        data-why="이 탭에는 따로 만든 화면이 없습니다. 퇴직공제 전자카드 단말기에는 이미 견적 페이지가 따로 있어서, 그 페이지를 통째로 탭 안에 끼워 넣었습니다. 기기 소개도 금액 계산도 그쪽 페이지가 하고 있으니, 여기에 요약을 다시 적으면 같은 내용을 두 벌로 관리하게 됩니다. 한쪽만 고치는 날 두 곳의 말이 어긋납니다."
        data-steps="주소에 ?type=B 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="탭 아래가 통째로 견적 화면입니다. 그 화면의 머리('퇴직공제 전자카드 단말기 / 임대 견적을 바로 받아보세요')는 접혀 있고, 탭이 그 이름을 대신 들고 있습니다|스크롤바가 하나뿐입니다. 부모가 안쪽 높이를 재서 틀을 늘려 둡니다">B · 퇴직공제 전자카드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-안면인식"
        data-why="안면인식 출퇴근관리 단말기 탭도 퇴직공제 쪽과 같은 방식입니다. 따로 만들어 둔 견적 페이지를 그대로 끼웁니다. 두 단말기 화면은 걸음이 같고 묻는 칸만 다르기 때문에, 탭을 오가며 어디가 같고 어디가 다른지 견주어 보기 좋은 자리입니다."
        data-steps="주소에 ?type=C 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="현장별로 기간·수량을 받는 칸이 섭니다 — 퇴직공제는 기기별로 받던 자리입니다|'김반장 이용 중이신가요?'는 이 화면에만 있습니다|여기도 스크롤바는 하나뿐입니다">C · 안면인식 출퇴근관리</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">누른 뒤에 벌어지는 일</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-늘어남"
        data-why="탭 안에 끼운 견적 페이지는 가만히 있지 않습니다. 현장을 하나 더하면 그 안의 내용이 길어집니다. 끼우는 틀의 높이를 처음 한 번만 재고 두면 늘어난 만큼이 아래에서 잘리거나, 페이지 스크롤과 따로 틀 안에 스크롤바가 하나 더 생깁니다. 바깥 페이지가 안쪽 높이를 계속 따라가는지 보는 자리입니다."
        data-steps="?type=C 로 열고 '현장 추가'를 두 번 누릅니다"
        data-look="현장이 늘어난 만큼 틀도 같이 길어집니다|틀 안에 스크롤바가 생기지 않습니다 — 페이지 스크롤 하나로 끝까지 내려갑니다|요약의 부제가 '단말기 N대 · 현장 3곳'으로 바뀝니다">현장을 더하면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-완료"
        data-why="높이는 늘어날 때만이 아니라 줄어들 때도 맞아야 합니다. 신청을 보내고 나면 그 자리에는 안내 두 줄만 남는데, 틀이 폼을 담던 높이 그대로 있으면 아래가 텅 빈 상자로 남습니다."
        data-steps="?type=C 로 열고, 끼운 화면을 완료 상태(?done=1)로 바꿉니다"
        data-look="틀이 내용에 맞게 확 줄어듭니다|탭 줄과 FAQ 사이에 빈 자리가 남지 않습니다|완료 카드에는 '다시 신청하기'만 남습니다. 혼자 열린 화면에는 그 옆에 '메인으로'가 하나 더 있는데, 탭 안에서는 이 페이지를 떠날 일이 없어 숨깁니다">완료 화면이 되면</button>

      <span class="proto-nav-group-label">A · 내 상황엔 어떤 서비스가 맞을까?</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-고르기전"
        data-why="프로그램은 김반장 3.0 과 김반장 프리미엄 둘 중 하나를 고르는 것인데, 두 상품의 설명을 나란히 놓고 견주게 하면 읽는 일이 먼저가 됩니다. 그래서 설명 대신 열 줄짜리 체크리스트를 둡니다. 열 줄은 두 상품이 하는 일을 '지금 겪는 일, 그래서 무엇이 필요한지' 한 문장으로 옮긴 것으로, 앞의 넷은 3.0 이 하는 일이고 뒤의 여섯은 프리미엄에만 있는 일입니다. 고른 줄을 세어 점수를 매기지는 않습니다. 프리미엄 줄이 하나라도 끼면 답은 프리미엄인데, 그 일을 3.0 은 아예 하지 않기 때문입니다."
        data-steps="페이지를 열고 서비스 블록으로 내려갑니다 — 아무것도 고르지 않습니다"
        data-look="열 줄이 전폭 두 칸에 서고, 답은 마지막 줄 바로 아래 가로 바입니다. 처음에는 접혀 있어 '항목 체크하기' 알약 하나만 보이는데, 여기서는 펴 둔 모습입니다|답 바에는 추천 도장도 '견적 받기' 화살표도 없습니다. 대신 '해당하는 것을 골라 보세요'와 '한 줄만 체크하면 … 바로 알려 드립니다'가 서서, 한 줄만 손대면 된다고 말합니다|'아무것도 해당 없음'과 '아직 안 봤음'은 다른 상태라, 한 번이라도 손을 대야 답이 섭니다|구역 바탕이 연한 파랑이고 그 위에 서는 것들은 흰 카드입니다">고르기 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-프리미엄"
        data-why="프리미엄 줄이 하나라도 끼면 답은 프리미엄입니다. 3.0 줄을 함께 골랐어도 마찬가지입니다. 3.0 이 하는 일은 프리미엄도 그대로 하기 때문에, 둘을 함께 고른 사람에게는 프리미엄 하나로 둘 다 됩니다. 왜 그 답이 나왔는지는 답 줄이 바로 밝힙니다. 답을 가른 프리미엄 줄만 세고, 그 일을 맡는 기능 이름을 불러 줍니다."
        data-steps="3.0 줄 하나('며칠씩 걸리던 급여 계산, 자동화가 필요합니다')를 먼저 고릅니다 — 아직 3.0 추천입니다|프리미엄 줄('매달 조마조마한 4대보험·퇴직공제 신고, 전문적인 도움이 필요합니다')을 더 고릅니다"
        data-look="'추천!' 도장이 서고, 그 옆에 '김반장 프리미엄 추천'이 제목으로 · 까닭이 한 단 아래로 섭니다 — 메인(partition-8)의 도장 그대로입니다|답 줄은 고른 줄의 사정을 그 일을 맡는 기능 이름으로 바꿔 부릅니다 — '근로자 신고 대행은 이제 김반장 프리미엄에 맡기세요'|3.0 과는 색조가 아니라 채움으로 갈립니다 — 프리미엄은 짙은 파랑으로 꽉 채운 카드에 흰 글, 3.0 은 흰 카드에 네이비 테두리. 채운 카드 위에서는 화살표도 흰 동그라미로 뒤집힙니다|오른쪽 끝에 화살표 하나뿐이지만 눌리는 자리는 바 전체입니다 — 도장이든 글자든 어디를 눌러도 같은 곳으로 갑니다|누르면 위 폼으로 올라가면서 계약 유형까지 프리미엄으로 맞춰집니다">프리미엄이 나오는 자리</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-30"
        data-why="고른 것이 전부 3.0 이 하는 일이면 답은 3.0 입니다. 전에는 아무것도 고르지 않았을 때만 3.0 이 나왔습니다. 그때의 3.0 은 고른 끝에 나온 답이 아니라 아직 고르지 않았다는 표시에 가까웠습니다. 지금은 골라서 나오는 답입니다."
        data-steps="3.0 줄 넷을 고릅니다 — 급여 계산 · 근로계약서 · 임금명세서 · 서류 관리"
        data-look="카드가 흰 바탕으로 돌아오고 네이비 테두리만 두릅니다 — 프리미엄의 채운 카드와 한눈에 갈립니다|'김반장 3.0 추천'이 네이비로 서고, 화살표도 채운 흰 동그라미에서 네이비 테두리만 남은 동그라미로 바뀝니다|프리미엄을 고를 수 없게 되는 것은 아닙니다 — 위 폼의 계약 유형은 손으로도 바꿀 수 있습니다">3.0 이 나오는 자리</button>

      <span class="proto-nav-group-label">A · 견적신청 폼</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-기본"
        data-why="탭을 누르면 곧장 신청 폼입니다. 단말기 두 탭도 같은 차례라, 체크리스트와 기능 비교표는 그 뒤로 물러나 어느 쪽인지 모르겠는 사람이 들르는 자리가 됩니다. 아무것도 고르지 않았는데 계약 유형이 프리미엄에 서 있는 것은 프리미엄 신청을 받으려는 영업 쪽 판단입니다. 손대지 않고 그대로 보내면 프리미엄으로 접수됩니다. 다만 아래 체크리스트가 3.0 이라고 답하면 그 답이 이 자리를 3.0 으로 돌려놓습니다. 먼저 세워 두기는 하되 고른 사람의 답을 덮지는 않습니다."
        data-steps="페이지를 엽니다 — 탭 바로 아래가 신청 폼입니다(아무것도 고르지 않은 상태)"
        data-look="계약 유형은 '김반장 프리미엄'으로 선택되어 있습니다. 아래 체크리스트를 건드리지 않으면 이쪽이 기본입니다|두 카드에는 이름만 적혀 있습니다. 설명은 이름 옆 물음표로 들어가 있어, 모르겠을 때만 눌러서 봅니다. 좁은 폭에서는 말풍선을 띄우지 않고 그 자리에서 펼칩니다|사업장 규모에서는 여덟 가지를 묻습니다. 적는 칸이 다섯(연 매출액·노무비·연 현장 수·월평균 현장 수·현장당 인원), 고르는 줄이 셋(종합면허·키스콘·상용근로자)입니다. 프리미엄 금액은 이 값으로 계산합니다|그 가운데 '연 매출액'과 '연 현장 수'에만 (필수)가 붙습니다. 매출액으로 구간을 정하고, 현장 수로 그 구간 안에서 금액을 가릅니다|요약에는 '총 예상 견적'이라고 적혀 있고, 매출액을 넣기 전에는 '0원'입니다. 단말기 두 화면과 같은 이름입니다">프리미엄으로 열린 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-3.0으로"
        data-why="체크리스트에서 나온 답이 위 신청 폼의 계약 유형까지 바꿔 놓습니다. 같은 것을 두 번 고르게 하지 않으려는 것입니다. 아래에서 3.0 이라는 답을 받았는데 위 폼은 프리미엄에 서 있으면, 고른 사람이 그 자리에서 또 한 번 3.0 으로 옮겨 놓아야 합니다. 폼의 기본이 프리미엄이라 눈에 띄는 쪽은 프리미엄에서 3.0 으로 바뀌는 이 방향입니다."
        data-steps="체크리스트에서 3.0 줄 하나를 고릅니다 — '며칠씩 걸리던 급여 계산, 자동화가 필요합니다'|위 신청 폼을 봅니다"
        data-look="계약 유형이 '김반장 3.0' 으로 옮겨 가 있습니다|묻는 칸이 다섯 개 줄어 연 매출액 하나만 남습니다 — 3.0 금액에 쓰이지 않는 값은 아예 묻지 않습니다|틀도 그만큼 짧아집니다">3.0 으로 바뀐 폼</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="ap-금액"

        data-look="A 탭에 셋, B 탭에 넷, C 탭에 둘이 섭니다 — 아홉 줄 가운데 그 탭에서 걸리는 것만 남습니다|첫 줄은 처음부터 펴져 있습니다. 펴 두는 줄도 탭마다 다시 고릅니다|이미 펴 본 줄이 그 탭에도 있으면 그대로 둡니다 — 탭을 다녀왔다고 읽던 자리를 접지 않습니다|두 번째 질문을 펴도 첫 질문은 닫히지 않습니다 — 견주어 읽을 수 있게|화살표가 아래에서 위로 돕니다">FAQ · 두 번째 질문</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="cta-마지막"
        data-why="끝까지 읽고도 고르지 못한 사람에게 남기는 자리입니다. 전화 버튼 하나만 두었더니, 아직 사람에게 말을 걸고 싶지 않은 사람은 갈 데가 없었습니다. 그래서 묻는 방법을 둘로 벌렸습니다. 지금 바로 사람에게 묻거나, 소개서를 받아 혼자 읽어 보거나."
        data-steps="페이지를 열고 맨 아래까지 내려갑니다. 탭을 바꿔 가며 소개서 칸을 봅니다"
        data-look="카드 둘이 섭니다 — 전화 문의하기 · 서비스 소개서. 폭을 720px 로 묶어 가운데에 세웁니다|소개서 칸만 통째로 눌리지 않습니다. 받을 것이 둘이면 상자 하나를 누르게 둘 수 없어, 줄마다 저를 누릅니다|탭을 따라 받을 거리가 바뀝니다 — A 는 '김반장 3.0 소개서'와 '김반장 프리미엄 소개서' 둘, B 는 퇴직공제 전자카드 단말기, C 는 안면인식 출퇴근관리|신청이 아니라 다운로드입니다 — 꺾쇠(↗)가 아니라 내려받는 화살표(↓)를 답니다|구역 바탕은 연한 파랑, 카드는 흰색입니다 — 체크리스트 구역이 쓰는 짝 그대로입니다|이름 자리에는 무엇을 하는지가, 그 아래 줄에는 어디로 가는지가 섭니다 — '전화 문의하기 / 1588-3818'. 옆 칸과 같은 차례입니다|전화는 자리표가 아닌 실제 번호입니다(tel:1588-3818), 모바일에서 바로 걸립니다|⚠ 받는 주소는 아직 없습니다. 그때까지 제자리(#help)를 가리켜 둡니다">마지막 CTA</button>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var ES='estimate.html';

  /* 시나리오 이름이 가리키는 자리를 열자마자 보여 준다. 내려가는 길을 적어 두고
     직접 밟게 하면, 그 자리를 보러 온 사람이 매번 같은 스크롤을 되풀이하게 된다.
     화면이 주소로 받는 상태(?type= · ?plan= · ?price= 따위)는 주소로 넘기고,
     여기서는 '어디를 보여 줄지'만 정한다 — 견적 화면에는 손대지 않는다 */
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }

  /* 화면 전체에 scroll-behavior:smooth 가 걸려 있다. 그대로 두면 열 때마다
     한참 미끄러져 내려가므로, 옮기는 동안만 끄고 되돌린다 */
  function hit(el){ if(el) el.click(); }
  function put(el,v){ if(!el) return; el.value=v;
    el.dispatchEvent(new Event('input',{bubbles:true}));
    el.dispatchEvent(new Event('change',{bubbles:true})); }

  /* 끼운 화면이 다 뜰 때까지 기다린다 — 고정 시간으로 짐작하면 느린 날에 빈손이다.
     ok 를 주면 그 조건까지 기다린다(완료 화면은 전송 흉내를 거쳐 2초쯤 걸린다) */
  async function inner(d,sel,ok){
    for(var i=0;i<60;i++){
      var fr=d.querySelector(sel), q=fr && fr.contentDocument;
      if(q && q.readyState==='complete' && q.body && q.body.children.length && (!ok || ok(q))) return q;
      await wait(100);
    }
    return null;
  }

  function jump(d,sel,off){
    var e=d.querySelector(sel); if(!e) return;
    var w=d.defaultView; if(!w) return;   /* 그새 틀이 갈려 나갔으면 잴 것이 없다 */
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    w.scrollTo(0, e.getBoundingClientRect().top + w.scrollY - (off||0));
    root.style.scrollBehavior=prev;
  }

  var S={
    /* 탭 — 주소의 ?type= 이 곧 탭이다 */
    'tb-첫진입'  :{url:ES},
    'tb-전자카드':{url:ES+'?type=B'},
    'tb-안면인식':{url:ES+'?type=C'},

    /* 끼운 틀이 안쪽을 따라 움직이는지 — 이 구조에서 제일 깨지기 쉬운 자리다 */
    'tb-늘어남'  :{url:ES+'?type=C', act:async function(d){
      var q=await inner(d,'#panel-C .es-frame'); if(!q) return;
      hit(q.querySelector('#btnAddSite')); await wait(150);
      hit(q.querySelector('#btnAddSite')); await wait(400);
      jump(d,'#panel-C'); }},
    'tb-완료'    :{url:ES+'?type=C', act:async function(d){
      var fr=d.querySelector('#panel-C .es-frame'); if(!fr) return;
      await inner(d,'#panel-C .es-frame');
      /* 폼을 끝까지 채워 보내는 길은 견적 프로토타입이 이미 보여 준다.
         여기서 볼 것은 '틀이 줄어드는가' 하나라, 그 화면이 아는 지름길을 쓴다 */
      fr.setAttribute('src','face-quote.html?done=1&_t='+Date.now());
      /* 완료 화면은 전송 흉내를 거쳐 뜬다 — 그 자리까지 기다려야 틀이 줄어든 꼴을 본다 */
      await inner(d,'#panel-C .es-frame', function(q){ return q.body.classList.contains('is-done'); });
      await wait(300); jump(d,'#panel-C'); }},
    /* A 탭 — 고르면 답이 나오는 체크리스트. 금액은 적지 않고 견적신청으로 넘긴다 */
    /* 열 줄은 접은 채로 서므로, 고르는 자리를 보여 주려면 먼저 펴야 한다 */
    'pl-고르기전':{url:ES, act:function(d){ hit($('#esPickToggle',d)); jump(d,'#plans'); }},
    'pl-프리미엄':{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      var box=d.querySelectorAll('.es-pick-item input');
      /* 3.0 줄(0) 을 먼저 고르고 프리미엄 줄(4) 을 더한다 — 답이 뒤집히는 자리다 */
      hit(box[0]); await wait(400); hit(box[4]); await wait(250);
      jump(d,'#plans'); }},
    'pl-30'    :{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      /* 3.0 줄 넷만 고른다 — 이제 3.0 은 미응답이 아니라 골라서 나오는 답이다 */
      var box=d.querySelectorAll('.es-pick-item input');
      hit(box[0]); hit(box[1]); hit(box[2]); hit(box[3]); await wait(250);
      jump(d,'#plans'); }},

    /* A 탭 — 기능 비교표 */
    'ft-전체'  :{url:ES,                          act:function(d){ jump(d,'#features'); }},

    /* 묶음을 접은 자리 — 기본은 펼침이라 여기서는 넷을 모두 눌러 접는다 */
    'ft-접기'  :{url:ES, act:function(d){
      d.querySelectorAll('.es-cat-t').forEach(function(t){ t.click(); });
      jump(d,'#features'); }},

    /* 머리줄이 붙는 것은 표 한가운데로 들어가야 보인다 — 네 번째 카테고리에 세운다 */
    'ft-머리줄':{url:ES, act:function(d){ jump(d,'.es-cat:nth-of-type(4)', 8); }},

    /* A 탭 — 끼워 둔 견적신청 폼. 체크리스트가 그 토글을 돌린다 */
    'ap-기본'   :{url:ES, act:async function(d){
      await inner(d,'#panel-A .es-frame'); jump(d,'#apply',8); }},
    'ap-3.0으로' :{url:ES, act:async function(d){
      await inner(d,'#panel-A .es-frame');
      /* 3.0 줄 하나면 답이 3.0 으로 서고, 그 답이 위 폼의 계약 유형까지 내린다 */
      hit(d.querySelectorAll('.es-pick-item input')[0]); await wait(400);
      jump(d,'#apply',8); }},
    'ap-금액'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(200);
      var t=q.querySelector('#sumMid'); if(t) t.open=true; await wait(150);
      jump(d,'#apply',8); }},
    'ap-연납'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(250);
      hit(q.querySelector('.pq-cycle input[value=year]')); await wait(250);
      jump(d,'#apply',8); }},
    'ap-막힘'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      /* 숨은 칸 이야기라 3.0 으로 내려 두고 눌러야 뜻이 선다 */
      hit(q.querySelector('.pq-type input[value=c30]')); await wait(250);
      /* 매출액은 채운다 — 비어 있으면 버튼이 막혀 눌러도 아무 일이 없다.
         막는 말을 보려면 먼저 누를 수 있어야 한다 */
      var sales=q.querySelector('#q-sales');
      sales.value='300000'; sales.dispatchEvent(new Event('input',{bubbles:true}));
      await wait(250);
      hit(q.querySelector('#agree')); await wait(100);
      hit(q.querySelector('#btnSubmit')); await wait(400);
      jump(d,'#apply',8); }},
    'ap-완료'   :{url:ES, act:async function(d){
      var fr=d.querySelector('#panel-A .es-frame'); if(!fr) return;
      await inner(d,'#panel-A .es-frame');
      fr.setAttribute('src','plan-quote.html?plan=prem&done=1&_t='+Date.now());
      await inner(d,'#panel-A .es-frame', function(q){ return q.body.classList.contains('is-done'); });
      await wait(400); jump(d,'#apply',8); }},

    /* 탭 밖 — 어느 탭에서나 같은 자리 */
    'fq-열림'  :{url:ES, act:async function(d){
      jump(d,'.es-faq'); await wait(60);
      var all=d.querySelectorAll('.faq details');
      if(all[1]){ all[1].open=true; } }},
    'cta-마지막':{url:ES, act:function(d){ jump(d,'.es-cta'); }}
  };

  function open(name){
    var s=S[name]; if(!s) return;
    var f=$('#screen iframe'); if(!f) return;
    f.onload=function(){
      if(!s.act) return;
      /* 그새 다른 시나리오로 옮겨 갔으면 손대지 않는다 */
      var now=document.querySelector('.proto-nav-btn.is-active');
      if(now && now.dataset.scenario!==name) return;
      try{ s.act(f.contentDocument); }catch(e){}
    };
    f.src=s.url+(s.url.indexOf('?')<0?'?':'&')+'_t='+Date.now();
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>

<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })

      document.body.insertBefore(d, document.body.firstChild);

  /* components.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */

<!-- ── 원본 링크 ─────────────────────────────────────────────────
     크롬의 「링크 복사」는 **이 페이지**의 주소를 준다 — 시나리오 목록과 폭
     컨트롤이 함께 딸려 오는 주소다. 폰에서 화면 자체를 만져 보려는 사람에게는
     그 껍데기가 필요 없다. 더구나 이 뷰어는 화면을 틀에 끼워 보여 주므로,
     폰에서 열면 폰 안에 또 틀이 생긴다 — 바로 앞 커밋들에서 고친 키보드·스크롤
     문제가 전부 '틀 안이냐 아니냐'에 걸려 있던 터라, 틀을 한 겹 더 두고 보는
     것은 실제 기기에서 볼 것을 못 보게 한다.

     그래서 지금 끼워 둔 화면의 주소를 그대로 주는 버튼을 하나 더 세운다.
     크롬은 외부 디자인 시스템이 내는 것이라 여기서 고칠 수 없다 — 대신 크롬이
     만든 툴바에 같은 생김새(.proto-share)로 붙는다.

     ⚠ 시나리오 가운데 주소로 적히지 않는 것들이 있다(체크리스트를 펴거나 폼에
        값을 넣는 자리). 그런 시나리오에서는 '그 화면의 첫 자리'가 복사된다 —
        주소가 들고 갈 수 있는 상태(?type= 따위)까지는 따라간다. -->
<script>
(function(){
  'use strict';

  /* 크롬은 .proto-content 를 제 틀로 갈아끼우고, 그 틀에 **이 페이지를 다시** 띄운다
     (?proto-frame=1). 그래서 문서가 둘이다 — 바깥에는 크롬만 있고 #screen 은 없으며,
     안쪽에 진짜 화면이 끼워져 있다. 버튼이 설 자리(툴바)는 바깥이고 읽을 주소는
     안쪽이라, 바깥에서 안쪽을 들여다본다. 같은 출처라 들여다볼 수 있다.
     안쪽 문서에서는 이 스크립트가 할 일이 없다 — 틀로 뜬 것이면 그대로 물러난다 */
  if(new URLSearchParams(location.search).get('proto-frame')) return;

  function screenIn(d){
    try{ var f = d && d.querySelector('#screen iframe'); return (f && f.src) || ''; }
    catch(e){ return ''; }
  }
  /* 캐시 깨려고 붙인 _t= 는 사람에게 줄 주소에 남길 것이 아니다 */
  function srcNow(){
    var raw = screenIn(document);
    if(!raw){
      /* 비교 모드에서는 틀이 여럿이다 — 셋 다 같은 화면이라 먼저 잡히는 것이면 된다 */
      var fr = document.querySelectorAll('iframe');
      for(var i=0; i<fr.length && !raw; i++){
        try{ raw = screenIn(fr[i].contentDocument); }catch(e){}
      }
    }
    if(!raw) return '';
    try{
      var u = new URL(raw, location.href);
      u.searchParams.delete('_t');
      return u.toString();
    }catch(e){ return raw; }
  }

  /* 복사는 두 벌이다 — 디자인 시스템이 같은 까닭을 적어 두었다.
     navigator.clipboard 는 보안 컨텍스트에서만 있는데, 폰에서 보려고 같은
     공유기의 http://192.168.x.x 로 띄운 순간이 정확히 그 경우다.
     둘 다 안 되면 주소를 띄워 손으로 복사하게 한다 — 안 됐는데 됐다고 하지 않는다 */
  function execCopy(t){
    var ta=document.createElement('textarea');
    ta.value=t; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:-9999px';
    document.body.appendChild(ta);
    ta.select(); try{ ta.setSelectionRange(0,t.length); }catch(e){}
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    return ok;
  }
  function copyText(t,done){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){done(true);},function(){done(execCopy(t));});
      return;
    }
    done(execCopy(t));
  }
  function localOnly(){
    var h=location.hostname;
    return location.protocol==='file:' ||
           h==='localhost'||h==='127.0.0.1'||h==='::1'||h==='0.0.0.0';
  }

  var btn=null, timer=0;
  function say(text,cls){
    btn.firstChild.textContent=text;
    btn.classList.toggle('is-done', cls==='done');
    btn.classList.toggle('is-local', cls==='local');
    clearTimeout(timer);
    if(cls) timer=setTimeout(function(){ say('원본 링크 복사',''); },2400);
  }
  function make(){
    btn=document.createElement('button');
    btn.type='button';
    btn.className='proto-share';
    var lb=document.createElement('span');
    lb.setAttribute('aria-live','polite');   /* 바뀐 글자를 읽어 준다 */
    lb.textContent='원본 링크 복사';
    btn.appendChild(lb);
    btn.addEventListener('click',function(){
      var url=srcNow(); if(!url) return;
      copyText(url,function(ok){
        if(!ok){ window.prompt('이 주소를 복사하세요', url); return; }
        say(localOnly()?'복사됨 · 이 컴퓨터에서만':'복사됨', localOnly()?'local':'done');
      });
    });
    return btn;
  }

  /* 무엇이 복사될지는 누르기 전에 보여야 한다 — 크롬의 「링크 복사」가 쓰는 규칙
     그대로다. 시나리오를 옮기면 틀의 주소가 바뀌므로 그때마다 고쳐 둔다 */
  function tip(){ if(btn) btn.title = srcNow() || '화면을 불러오는 중입니다'; }

  /* 툴바는 크롬이 만든다. 그 노드는 한 번 만들어지면 계속 같은 것이라(폭을 바꿀
     때 자리만 옮겨 다닌다), 한 번 붙여 두면 따라다닌다 — 매번 다시 붙일 일이 없다.
     다만 언제 생기는지는 크롬이 정하므로, 생길 때까지만 지켜본다 */
  var tries=0;
  (function attach(){
    var bar=document.querySelector('.proto-toolbar');
    if(bar){ bar.appendChild(make()); tip(); return; }
    if(++tries>120) return;              /* 2초쯤 기다리고 그만둔다 */
    requestAnimationFrame(attach);
  })();

  /* 귀띔말은 **읽을 때** 맞춘다. 안쪽 틀은 시나리오를 옮길 때마다 통째로 다시
     뜨므로 어느 한 노드에 load 를 걸어 두면 한 번 갈린 뒤로 조용해진다.
     손이 닿는 순간에 묻는 편이 노드가 몇 번을 갈려도 틀리지 않는다 */
  ['pointerenter','focus','touchstart'].forEach(function(ev){
    btn.addEventListener(ev, tip, {passive:true});
  });
})();
</script>
</body>
</html>
