<!-- design-system: v1.0.0 -->
<!-- prototype: 견적받기 — 조건별 화면 모아보기 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>견적받기 프로토타입</title>
<meta name="description" content="탭과 고른 것에 따라 달라지는 견적받기 화면을 시나리오별로 모아 본다.">
<!-- 김반장 3.0 디자인 시스템. 크롬(사이드바·설명·폭·비교)은 components.js 의
     initProtoChrome 이 맡는다 — 이 파일이 따로 만들지 않는다.
     주소가 절대경로인 것은 시스템 규약이다(견적신청 프로토타입과 같다) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/tokens.css">
<link rel="stylesheet" href="https://namiruan.github.io/kbz_3.0_ui_stytem/components.css">
<style>
/* 이 파일이 갖는 것은 '화면을 끼우는 자리' 하나뿐이다. 나머지 생김새는 전부 시스템이 낸다 */
#screen{display:block;width:100%;height:100dvh}
#screen iframe{display:block;width:100%;height:100%;border:0;background:var(--color-surface-base)}
</style>
</head>
<body>

<div class="proto-layout" data-proto-sub="조건별 화면 모아보기">
  <aside class="proto-sidebar">
    <!-- 접기 손잡이와 폭 컨트롤은 여기 적지만, 크롬이 툴바(화면 바로 위)로 옮긴다 -->
    <button class="proto-nav-toggle" type="button" aria-expanded="true" aria-label="시나리오 목록 접기">
      <svg aria-hidden="true"><use href="#icon-sidebar-collapse"></use></svg>
    </button>
    <div class="proto-viewport" role="group" aria-label="화면 폭">
      <button class="proto-viewport__btn is-active" type="button" data-viewport="lg" aria-pressed="true">lg</button>
      <button class="proto-viewport__btn" type="button" data-viewport="md" aria-pressed="false">md</button>
      <button class="proto-viewport__btn" type="button" data-viewport="sm" aria-pressed="false">sm</button>
      <button class="proto-viewport__btn" type="button" data-viewport="compare" aria-pressed="false">비교</button>
    </div>

    <div class="proto-nav-divider"></div>

    <nav class="proto-nav" aria-label="시나리오 선택">

      <span class="proto-nav-group-label">탭 세 가지</span>
      <button class="proto-nav-btn proto-nav-sub is-active" type="button" data-scenario="tb-첫진입"
        data-why="페이지를 열면 첫 탭입니다. 파는 것이 셋인데 셈법이 저마다 달라(프로그램은 사업장 단위, 단말기 둘은 현장 단위) 한 화면에 늘어놓으면 '월 얼마'가 세 뜻으로 읽힙니다. 탭이 그 셋을 가릅니다."
        data-steps="페이지를 엽니다 — 그 뒤로는 아무것도 누르지 않습니다"
        data-look="탭 셋이 머리글 바로 아래 섭니다|고른 탭만 파란 글씨와 밑줄을 갖습니다 — 밑줄 하나로는 흑백에서 구분이 약합니다|탭은 상품 이름 한 줄뿐입니다|주소에 ?type= 이 없으면 A 입니다">첫 진입 (A · 프로그램)</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-전자카드"
        data-why="퇴직공제 단말기 탭은 제 내용을 따로 갖지 않습니다. 이미 완성된 견적 화면(quote.html)을 그대로 끼웁니다 — 기기 소개도 금액 계산도 그 화면이 하고 있어, 여기서 요약을 또 적으면 같은 말을 두 벌로 기르게 됩니다."
        data-steps="주소에 ?type=B 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="탭 아래가 통째로 견적 화면입니다 — 그 화면의 머리('안면인식 출퇴근관리 단말기 / 임대 견적을 바로 받아보세요')는 접혀 있습니다. 탭이 이미 그 이름을 들고 있는데 한 번 더 세우면, 방금 누른 것의 이름을 다시 읽히는 셈입니다 — 고르고 수량을 넣으면 그 자리에서 금액이 섭니다|스크롤바가 하나뿐입니다 — 부모가 안쪽 높이를 재서 틀을 늘려 둡니다|끼운 화면에 제목이 없으니 탭이 그 노릇을 합니다|탭을 처음 열 때 받아 옵니다 — A 로 들어오면 B·C 는 아직 받지 않습니다">B · 퇴직공제 전자카드</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-안면인식"
        data-why="B 와 같은 방식으로 face-quote.html 을 끼웁니다. 두 화면은 흐름이 같고 묻는 칸만 달라, 탭을 오가며 견주어 보기 좋은 자리입니다."
        data-steps="주소에 ?type=C 를 붙여 엽니다(탭을 눌러도 같습니다)"
        data-look="현장별로 기간·수량을 받는 칸이 섭니다 — 퇴직공제는 기기별로 받던 자리입니다|'김반장 이용 중이신가요?'는 이 화면에만 있습니다|여기도 스크롤바는 하나뿐입니다">C · 안면인식 출퇴근관리</button>
      <span class="proto-nav-group-label proto-nav-group-label--sub">끼운 틀이 움직이는 자리</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-늘어남"
        data-why="끼운 화면은 가만히 있지 않습니다. 현장을 더하면 안쪽이 길어지는데, 틀을 한 번 재고 말면 아래가 잘리거나 틀 안에 스크롤바가 하나 더 생깁니다. 부모가 안쪽을 계속 지켜보는지 보는 자리입니다."
        data-steps="?type=C 로 열고 '현장 추가'를 두 번 누릅니다"
        data-look="현장이 늘어난 만큼 틀도 같이 길어집니다|틀 안에 스크롤바가 생기지 않습니다 — 페이지 스크롤 하나로 끝까지 내려갑니다|요약의 부제가 '단말기 N대 · 현장 3곳'으로 바뀝니다">현장을 더하면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-완료"
        data-why="늘어나는 것만큼 줄어드는 것도 맞아야 합니다. 완료 화면은 안내 두 줄뿐이라, 틀이 그대로면 아래가 텅 빈 상자로 남습니다."
        data-steps="?type=C 로 열고, 끼운 화면을 완료 상태(?done=1)로 바꿉니다"
        data-look="틀이 내용에 맞게 확 줄어듭니다|탭 줄과 FAQ 사이에 빈 자리가 남지 않습니다|'메인으로' 버튼은 끼운 화면의 것이라 탭을 벗어납니다 — 이 자리에서는 어울리지 않는 버튼입니다">완료 화면이 되면</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="tb-바꾸기"
        data-why="비교표를 한참 내려다 탭을 바꾸는 자리. 스크롤 위치를 그대로 두면 새 탭의 한가운데로 떨어져, 무엇이 바뀐 건지 알 수 없습니다. 탭 줄까지 되감아 그 상품의 처음부터 보여 줍니다."
        data-steps="A 탭에서 기능 비교표 한가운데까지 내려갑니다|탭 줄의 '안면인식 출퇴근관리'를 누릅니다"
        data-look="누르는 순간 탭 줄이 화면 맨 위로 되감깁니다|주소의 ?type= 이 C 로 바뀝니다 — 뒤로가기가 쌓이지는 않습니다(replaceState)|탭 줄은 스크롤을 따라붙어, 한참 내려가도 돌아올 수 있습니다">탭을 바꾸면</button>

      <span class="proto-nav-group-label">A · 어느 쪽이 맞을까</span>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-고르기전"
        data-why="줄글 두 벌을 견주게 하지 않고 고르게 합니다. 열 줄은 노션 「서비스별 기능 상세」의 기능을 '지금 겪는 일, 그래서 무엇이 필요한지' 한 문장으로 옮긴 것으로, 앞의 넷은 3.0 이 하는 일이고 뒤의 여섯은 🟡 프리미엄 전용입니다. 전부 프리미엄 전용으로만 채웠을 때는 무엇을 골라도 답이 하나뿐이었습니다 — 사실상 '대행 쓰실래요?' 한 문항을 여섯 번 물은 셈입니다. 그래도 가름은 점수가 아닙니다. 프리미엄 줄이 하나라도 끼면 프리미엄인데, 고른 그 일을 3.0 은 아예 하지 않기 때문입니다."
        data-steps="페이지를 열고 서비스 블록으로 내려갑니다 — 아무것도 고르지 않습니다"
        data-look="눈썹은 메인(partition-8)이 같은 갈림길을 두고 쓰는 물음 그대로입니다 — '내 상황엔 어떤 서비스가 맞을까?'. 제목은 가져오지 않았습니다: 저쪽 제목('근태·퇴직금 관리는 3.0, 신고 대행은 프리미엄')은 비교표를 요약하는 말이라 저 자리에서는 맞지만, 여기서는 눈썹이 물은 것을 제목이 바로 답해 버려 고를 까닭이 사라집니다. '퇴직금 관리'는 아래 열 줄에 있지도 않습니다|제목은 '필요한 항목을 체크하면 딱 맞는 서비스를 추천해 드립니다!' 입니다 — 눈썹이 묻고, 제목이 체크하면 답이 나온다고 약속하고, 열 줄이 체크할 것을 폅니다|설명 줄은 두지 않았습니다. 저쪽도 머리글 둘뿐이고, 무엇을 하라는 말은 아래 답 자리('해당하는 것을 골라 보세요')가 이미 합니다|열 줄은 접은 채로 섭니다 — 처음 보이는 것은 눈썹·제목과 '항목 체크하기' 알약 하나뿐이고(구역 1489 → 325px), 약속을 받을 사람만 폅니다. 체크리스트와 아래 비교표를 모두 펴 두면 정작 해야 할 일(위 견적 폼)보다 읽을거리가 먼저 길어집니다|손잡이는 제목 줄이 아니라 그 아래 알약입니다 — 비교표 묶음 제목은 왼쪽으로 붙는 표의 한 줄이지만, 이 제목은 가운데 선 큰 글이라 통째로 눌리는 띠가 되면 구역 머리가 손잡이처럼 보입니다|열 줄이 전폭 두 칸에 서고, 답은 마지막 줄 바로 아래 가로 바입니다|답을 오른쪽 기둥(340px)에 세웠더니 리스트가 328px 짜리 칸 둘로 눌려 열 줄이 모두 두 줄로 접혔습니다. 답을 아래로 내리니 그 폭이 리스트로 돌아와, 칸이 530px 가 되고 아홉 줄이 한 줄에 섭니다 — 블록 높이는 337 → 331px 로 오히려 줄었습니다|답 바 안에서는 도장 · 추천과 까닭 · 견적 받기 셋이 한 줄에 서고, 버튼은 오른쪽 끝으로 밀립니다 — 왼쪽은 답, 오른쪽은 다음 걸음입니다|체크리스트는 폼 아래입니다 — 단말기 두 탭은 누르면 바로 폼인데 여기만 체크리스트를 먼저 세우면, 같은 띠 아래 세 탭이 서로 다른 약속을 하는 꼴이 됩니다|답은 알약이 아니라 제목 글꼴로 적습니다 — 채운 알약으로 두었더니 바로 옆 '견적 받기'와 같은 모양이라 눌리는 것으로 보였습니다. 한 줄에 알약이 둘이면 둘 다 버튼으로 읽힙니다|제목과 까닭은 위아래로 가릅니다. 한 줄에 나란히 두면 어디까지가 답이고 어디부터가 까닭인지 경계가 서지 않습니다|아직은 도장도 없고, 회색으로 '해당하는 것을 골라 보세요'라고만 합니다|구역 바탕이 연한 파랑입니다 — 흰 바탕으로 두었더니 바로 위 폼 띠(#FBFBFB)와 네 단계밖에 차이가 나지 않아 두 구역이 한 덩이로 흘렀습니다. 아래 비교표는 회색이라 폼 → 테스트 → 표 가 색으로 끊깁니다|그 위에 서는 것들은 흰 카드로 뒤집었습니다 — 고른 줄도, 아직 답하지 않은 바도. 같은 파랑을 깔면 묻힙니다|'견적 받기' 버튼도 아직 없습니다 — 묻기도 전에 '이 구성으로'라고 하면 빈 말입니다|'아무것도 해당 없음'과 '아직 안 봤음'은 다른 상태라, 한 번이라도 손을 대야 답이 섭니다">고르기 전</button>
      <button class="proto-nav-btn proto-nav-sub" type="button" data-scenario="pl-프리미엄"
        data-why="프리미엄 줄이 하나라도 끼면 프리미엄입니다. 3.0 줄을 함께 골랐어도 마찬가지입니다 — 3.0 이 하는 일은 프리미엄도 그대로 하니까요. 왜 그런지를 답 줄이 바로 밝힙니다 — 답을 가른 프리미엄 줄만 세고, 그 일을 맡는 기능 이름을 불러 줍니다."
        data-steps="3.0 줄 하나('며칠씩 걸리던 급여 계산, 자동화가 필요합니다')를 먼저 고릅니다 — 아직 3.0 추천입니다|프리미엄 줄('매달 조마조마한 4대보험·퇴직공제 신고, 전문적인 도움이 필요합니다')을 더 고릅니다"

    el.dispatchEvent(new Event('change',{bubbles:true})); }

  /* 끼운 화면이 다 뜰 때까지 기다린다 — 고정 시간으로 짐작하면 느린 날에 빈손이다.
     ok 를 주면 그 조건까지 기다린다(완료 화면은 전송 흉내를 거쳐 2초쯤 걸린다) */
  async function inner(d,sel,ok){
    for(var i=0;i<60;i++){
      var fr=d.querySelector(sel), q=fr && fr.contentDocument;
      if(q && q.readyState==='complete' && q.body && q.body.children.length && (!ok || ok(q))) return q;
      await wait(100);
    }
    return null;
  }

  function jump(d,sel,off){
    var e=d.querySelector(sel); if(!e) return;
    var w=d.defaultView; if(!w) return;   /* 그새 틀이 갈려 나갔으면 잴 것이 없다 */
    var root=d.documentElement, prev=root.style.scrollBehavior;
    root.style.scrollBehavior='auto';
    w.scrollTo(0, e.getBoundingClientRect().top + w.scrollY - (off||0));
    root.style.scrollBehavior=prev;
  }

  var S={
    /* 탭 — 주소의 ?type= 이 곧 탭이다 */
    'tb-첫진입'  :{url:ES},
    'tb-전자카드':{url:ES+'?type=B'},
    'tb-안면인식':{url:ES+'?type=C'},

    /* 끼운 틀이 안쪽을 따라 움직이는지 — 이 구조에서 제일 깨지기 쉬운 자리다 */
    'tb-늘어남'  :{url:ES+'?type=C', act:async function(d){
      var q=await inner(d,'#panel-C .es-frame'); if(!q) return;
      hit(q.querySelector('#btnAddSite')); await wait(150);
      hit(q.querySelector('#btnAddSite')); await wait(400);
      jump(d,'#panel-C'); }},
    'tb-완료'    :{url:ES+'?type=C', act:async function(d){
      var fr=d.querySelector('#panel-C .es-frame'); if(!fr) return;
      await inner(d,'#panel-C .es-frame');
      /* 폼을 끝까지 채워 보내는 길은 견적 프로토타입이 이미 보여 준다.
         여기서 볼 것은 '틀이 줄어드는가' 하나라, 그 화면이 아는 지름길을 쓴다 */
      fr.setAttribute('src','face-quote.html?done=1&_t='+Date.now());
      /* 완료 화면은 전송 흉내를 거쳐 뜬다 — 그 자리까지 기다려야 틀이 줄어든 꼴을 본다 */
      await inner(d,'#panel-C .es-frame', function(q){ return q.body.classList.contains('is-done'); });
      await wait(300); jump(d,'#panel-C'); }},
    'tb-바꾸기'  :{url:ES, act:async function(d){
      jump(d,'.es-cat:nth-of-type(4)', 8); await wait(200);
      var c=d.querySelector('#tab-C'); if(c) c.click(); }},

    /* A 탭 — 고르면 답이 나오는 체크리스트. 금액은 적지 않고 견적신청으로 넘긴다 */
    /* 열 줄은 접은 채로 서므로, 고르는 자리를 보여 주려면 먼저 펴야 한다 */
    'pl-고르기전':{url:ES, act:function(d){ hit($('#esPickToggle',d)); jump(d,'#plans'); }},
    'pl-프리미엄':{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      var box=d.querySelectorAll('.es-pick-item input');
      /* 3.0 줄(0) 을 먼저 고르고 프리미엄 줄(4) 을 더한다 — 답이 뒤집히는 자리다 */
      hit(box[0]); await wait(400); hit(box[4]); await wait(250);
      jump(d,'#plans'); }},
    'pl-30'    :{url:ES, act:async function(d){
      hit($('#esPickToggle',d)); await wait(250);
      /* 3.0 줄 넷만 고른다 — 이제 3.0 은 미응답이 아니라 골라서 나오는 답이다 */
      var box=d.querySelectorAll('.es-pick-item input');
      hit(box[0]); hit(box[1]); hit(box[2]); hit(box[3]); await wait(250);
      jump(d,'#plans'); }},

    /* A 탭 — 기능 비교표 */
    'ft-전체'  :{url:ES,                          act:function(d){ jump(d,'#features'); }},

    /* 묶음을 접은 자리 — 기본은 펼침이라 여기서는 여섯을 모두 눌러 접는다 */
    'ft-접기'  :{url:ES, act:function(d){
      d.querySelectorAll('.es-cat-t').forEach(function(t){ t.click(); });
      jump(d,'#features'); }},

    /* 머리줄이 붙는 것은 표 한가운데로 들어가야 보인다 — 네 번째 카테고리에 세운다 */
    'ft-머리줄':{url:ES, act:function(d){ jump(d,'.es-cat:nth-of-type(4)', 8); }},

    /* A 탭 — 끼워 둔 견적신청 폼. 체크리스트가 그 토글을 돌린다 */
    'ap-기본'   :{url:ES, act:async function(d){
      await inner(d,'#panel-A .es-frame'); jump(d,'#apply',8); }},
    'ap-3.0으로' :{url:ES, act:async function(d){
      await inner(d,'#panel-A .es-frame');
      /* 3.0 줄 하나면 답이 3.0 으로 서고, 그 답이 위 폼의 계약 유형까지 내린다 */
      hit(d.querySelectorAll('.es-pick-item input')[0]); await wait(400);
      jump(d,'#apply',8); }},
    'ap-금액'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(200);
      var t=q.querySelector('#sumMid'); if(t) t.open=true; await wait(150);
      jump(d,'#apply',8); }},
    'ap-연납'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      put(q.querySelector('#q-sales'), '700000'); await wait(250);
      hit(q.querySelector('.pq-cycle input[value=year]')); await wait(250);
      jump(d,'#apply',8); }},
    'ap-막힘'   :{url:ES, act:async function(d){
      var q=await inner(d,'#panel-A .es-frame'); if(!q) return;
      /* 숨은 칸 이야기라 3.0 으로 내려 두고 눌러야 뜻이 선다 */
      hit(q.querySelector('.pq-type input[value=c30]')); await wait(250);
      hit(q.querySelector('#agree')); await wait(100);
      hit(q.querySelector('#btnSubmit')); await wait(400);
      jump(d,'#apply',8); }},
    'ap-완료'   :{url:ES, act:async function(d){
      var fr=d.querySelector('#panel-A .es-frame'); if(!fr) return;
      await inner(d,'#panel-A .es-frame');
      fr.setAttribute('src','plan-quote.html?plan=prem&done=1&_t='+Date.now());
      await inner(d,'#panel-A .es-frame', function(q){ return q.body.classList.contains('is-done'); });
      await wait(400); jump(d,'#apply',8); }},

    /* 탭 밖 — 어느 탭에서나 같은 자리 */
    'fq-열림'  :{url:ES, act:async function(d){
      jump(d,'.es-faq'); await wait(60);
      var all=d.querySelectorAll('.faq details');
      if(all[1]){ all[1].open=true; } }},
    'cta-마지막':{url:ES, act:function(d){ jump(d,'.es-cta'); }}
  };

  function open(name){
    var s=S[name]; if(!s) return;
    var f=$('#screen iframe'); if(!f) return;
    f.onload=function(){
      if(!s.act) return;
      /* 그새 다른 시나리오로 옮겨 갔으면 손대지 않는다 */
      var now=document.querySelector('.proto-nav-btn.is-active');
      if(now && now.dataset.scenario!==name) return;
      try{ s.act(f.contentDocument); }catch(e){}
    };
    f.src=s.url+(s.url.indexOf('?')<0?'?':'&')+'_t='+Date.now();
  }

  /* 크롬이 틀 안에서 ?scenario= 를 읽어 해당 버튼을 눌러 준다 — 그 누름을 여기서 받는다.
     DOMContentLoaded 보다 먼저 붙어 있어야 그 클릭을 놓치지 않는다 */
  document.querySelectorAll('.proto-nav-btn').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('.proto-nav-btn').forEach(function(o){
        o.classList.toggle('is-active', o===b); });
      open(b.dataset.scenario);
    });
  });
  var first=document.querySelector('.proto-nav-btn.is-active')||document.querySelector('.proto-nav-btn');
  if(first) open(first.dataset.scenario);
})();
</script>
<script src="https://namiruan.github.io/kbz_3.0_ui_stytem/components.js"></script>
<script>
  /* 아이콘은 스프라이트를 주입해 쓴다 (시스템 규약: 원격 절대 URL) */
  fetch('https://namiruan.github.io/kbz_3.0_ui_stytem/icons/sprite.svg')
    .then(function(r){ return r.text(); })
    .then(function(svg){
      var d=document.createElement('div');
      d.style.cssText='position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML=svg;
      document.body.insertBefore(d, document.body.firstChild);
    }).catch(function(){});
  /* components.js 는 초기화 함수를 등록만 한다 — 크롬은 여기서 켠다 */
  if (typeof initProtoChrome === 'function') initProtoChrome(document);
</script>
